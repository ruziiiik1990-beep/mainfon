<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - 4ak4ak</title>
    <link rel="stylesheet" href="style.css"> <!-- Стили шапки и фона -->
    <style>
        /* Убираем градиент с body, чтобы не перекрывал шапку. 
           Фон теперь будет просто белым или картинкой kolo11.png */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f4f4; /* Светлый фон, чтобы шапка выделялась */
        }

        /* Контейнер формы (сдвигаем вниз, чтобы не наезжал на шапку) */
        .auth-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 100px); /* Высота экрана минус шапка */
            padding: 40px 20px;
        }

        .auth-box {
            display: flex;
            width: 100%;
            max-width: 900px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            min-height: 500px;
        }

        /* ... (стили формы остаются прежними) ... */
        .auth-form-side { width: 50%; padding: 40px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        .decor { position: absolute; color: #e5e5e5; font-weight: bold; pointer-events: none; }
        .decor.cross { top: 10%; left: 15%; font-size: 30px; }
        .decor.circle { top: 20%; left: 30%; font-size: 40px; color: #fef3c7; }
        .decor.triangle { top: 10%; right: 15%; font-size: 30px; color: #fef3c7; }
        .decor.cross2 { bottom: 20%; left: 10%; font-size: 25px; color: #fef3c7; }
        .decor.circle2 { bottom: 10%; right: 20%; font-size: 35px; }
        .auth-form-container { width: 100%; max-width: 300px; z-index: 2; }
        .auth-form-container h1 { text-align: center; color: #555; font-size: 32px; letter-spacing: 3px; margin-bottom: 30px; font-weight: 400; }
        .input-group { margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 15px; border: 2px solid rgba(227, 118, 156, 0.7); border-radius: 25px; font-size: 16px; outline: none; box-sizing: border-box; transition: border-color 0.3s, box-shadow 0.3s; }
        .input-group input:focus { border-color: #e3769c; box-shadow: 0 0 10px rgba(227, 118, 156, 0.3); }
        .auth-options { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #666; margin-bottom: 25px; width: 100%; }
        .auth-options label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .auth-options input[type="checkbox"] { accent-color: #e3769c; width: 16px; height: 16px; }
        .auth-options a { color: #666; text-decoration: none; }
        .auth-options a:hover { color: #e3769c; }
        .submit-btn { width: 180px; padding: 15px; background-color: #e3769c; color: white; border: none; border-radius: 30px; font-size: 18px; cursor: pointer; display: block; margin: 0 auto 20px auto; transition: background-color 0.3s, transform 0.2s; box-shadow: 0 5px 15px rgba(227, 118, 156, 0.4); }
        .submit-btn:hover { background-color: #d05c83; transform: translateY(-2px); }
        .switch-page { text-align: center; font-size: 14px; color: #666; }
        .switch-page a { color: #e3769c; font-weight: bold; text-decoration: none; }
        .auth-image-side { width: 50%; background-color: #eef0f3; position: relative; }
        .auth-image-side img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        .error-msg { color: red; font-size: 14px; text-align: center; margin-bottom: 15px; display: none; }
        
        @media (max-width: 768px) { 
            .auth-box { flex-direction: column; } 
            .auth-form-side { width: 100%; padding: 30px 20px; } 
            .auth-image-side { display: none; } 
        }
    </style>
</head>
<body>

    <!-- 1. ШАПКА -->
    <div id="header-placeholder" class="header-wrapper"></div>
    <script>
        fetch('header.html').then(r => r.text()).then(data => {
            document.getElementById('header-placeholder').innerHTML = data;
        });
    </script>

    <!-- 2. ФОРМА ВХОДА (в контейнере, чтобы не наезжать на шапку) -->
    <div class="auth-wrapper">
        <div class="auth-box">
            <div class="auth-form-side">
                <span class="decor cross">✕</span>
                <span class="decor circle">○</span>
                <span class="decor triangle">△</span>
                <span class="decor cross2">✕</span>
                <span class="decor circle2">○</span>

                <div class="auth-form-container">
                    <h1>ВХОД</h1>
                    <div id="error-message" class="error-msg"></div>
                    
                    <form id="login-form">
                        <div class="input-group">
                            <input type="email" id="login-email" placeholder="Email" required>
                        </div>
                        <div class="input-group">
                            <input type="password" id="login-password" placeholder="Пароль" required>
                        </div>
                        
                        <div class="auth-options">
                            <label>
                                <input type="checkbox"> Запомнить
                            </label>
                            <a href="#">Забыли пароль?</a>
                        </div>

                        <button type="submit" id="login-btn" class="submit-btn">Войти</button>
                        
                        <p class="switch-page">Нет аккаунта? <a href="register.html">Регистрация</a></p>
                    </form>
                </div>
            </div>

            <div class="auth-image-side">
                <img src="logo1.jpg" alt="4ak4ak">
            </div>
        </div>
    </div>

    <!-- 3. FIREBASE СКРИПТ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "ТВОЙ_API_KEY",
            authDomain: "ak4ak-8be45.firebaseapp.com",
            databaseURL: "https://ak4ak-8be45-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "ak4ak-8be45",
            storageBucket: "ak4ak-8be45.appspot.com",
            messagingSenderId: "ТВОЙ_SENDER_ID",
            appId: "ТВОЙ_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('error-message');
            const btn = document.getElementById('login-btn');

            btn.disabled = true;
            btn.textContent = 'Вход...';
            errorDiv.style.display = 'none';

            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    window.location.href = "index.html"; // Успешный вход
                })
                .catch((error) => {
                    errorDiv.textContent = "Ошибка: " + error.message;
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Войти';
                });
        });
    </script>
</body>
</html>
