<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль - 4ak4ak</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-image: url('kolo13.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            color: #fff;
        }

        .profile-container {
            max-width: 900px;
            margin: 100px auto 40px auto;
            padding: 0 20px;
        }

        .profile-table-wrapper {
            background: #374151;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        
        .profile-intro, .profile-body { padding: 0 24px; }

        .profile-head {
            display: flex;
            align-items: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .profile-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            background-color: #555;
            border: 3px solid #e3769c;
            margin-right: 20px;
        }

        .profile-full-name { font-size: 24px; font-weight: 700; display: block; margin-bottom: 5px; }

        .seamless-iframe {
            width: 100%;
            border: none;
            overflow: hidden;
            display: block;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            margin-top: 20px;
            background: #374151;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .seamless-iframe::-webkit-scrollbar { display: none; width: 0; height: 0; }

        @media (max-width: 768px) {
            .profile-head { flex-direction: column; text-align: center; }
            .profile-photo { margin-right: 0; margin-bottom: 15px; }
        }
    </style>
</head>
<body>

    <div id="header-placeholder" class="header-wrapper"></div>

    <div class="profile-container">
        <div class="profile-table-wrapper">
            <div class="profile">
                <div class="profile-intro">
                    <div class="profile-head">
                        <div class="profile-photo" style="background-image: url('logo1.jpg');"></div>
                        <div class="profile-name">
                            <div class="profile-full-name" id="profile-name">Загрузка...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Iframe: OpenID (Steam ID) — локальный файл, uid подставляется скриптом -->
        <iframe
            src="steam.html"
            style="width:100%;border:none;overflow:hidden;display:block;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,0.4);margin-top:20px;"
            scrolling="no"
            class="seamless-iframe"
            id="steamFrame"
            allow="clipboard-write; popup">
        </iframe>

        <!-- Iframe: Достижения — локальный файл, uid подставляется скриптом -->
        <div style="max-width:900px;margin:20px auto 0;">
            <iframe
                src="dostizheni.html"
                style="width:100%;border:none;overflow:hidden;display:block;"
                scrolling="no"
                class="seamless-iframe"
                id="achievementsFrame">
            </iframe>
        </div>
    </div>

    <!-- Загрузка шапки и auth.js -->
    <script>
        fetch('header.html').then(r => r.text()).then(data => {
            document.getElementById('header-placeholder').innerHTML = data;
            const script = document.createElement('script');
            script.type = 'module';
            script.src = 'auth.js';
            document.body.appendChild(script);
        });
    </script>

    <!-- Скрипт для авто-размера iframe -->
    <script>
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'resize') {
                var frameId = null;
                if (event.data.frame === 'achievements') frameId = 'achievementsFrame';
                else if (event.data.frame === 'steam') frameId = 'steamFrame';
                
                if (frameId) {
                    var frame = document.getElementById(frameId);
                    if (frame && event.data.height) {
                        frame.style.height = event.data.height + 'px';
                    }
                }
            }
        });
    </script>

    <!-- Firebase: загрузка данных профиля и проверка прав админа -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDQMXKc1q4SQYIKlhqzPmB9-h0rCV90Itk",
            authDomain: "ak4ak-8be45.firebaseapp.com",
            databaseURL: "https://ak4ak-8be45-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "ak4ak-8be45",
            storageBucket: "ak4ak-8be45.appspot.com",
            messagingSenderId: "408070680295",
            appId: "1:408070680295:web:77b9656094e330b803bc42"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            // Обновляем токен, чтобы подхватить актуальные права (admin)
            await user.getIdToken(true);
            const tokenResult = await user.getIdTokenResult();
            const isAdmin = tokenResult.claims.admin === true;

            // Подставляем uid в iframe достижений и Steam
            document.getElementById('achievementsFrame').src = 'dostizheni.html?uid=' + user.uid + (isAdmin ? '&admin=1' : '');
            document.getElementById('steamFrame').src = 'steam.html?uid=' + user.uid;

            get(ref(db, 'users/' + user.uid)).then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    document.getElementById('profile-name').textContent = data.email.split('@')[0];
                } else {
                    document.getElementById('profile-name').textContent = "Пользователь";
                }
            });
        });
    </script>
</body>
</html>
