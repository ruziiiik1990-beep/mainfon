<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon/favicon.ico" type="image/x-icon">
<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <title>Профиль - 4ak4ak</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-image: url('kolo13.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            color: #fff;
        }

        .profile-container {
            max-width: 900px;
            margin: 100px auto 40px auto;
            padding: 0 20px;
        }

        .profile-table-wrapper {
            background: #374151;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            overflow: visible;
            margin-bottom: 20px;
            position: relative;
        }
        
        .profile-intro, .profile-body { padding: 0 24px; }

        /* Профиль-шапка: карточка по центру */
        .profile-head {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            gap: 0;
        }

        /* ====== ГОЛОГРАФИЧЕСКАЯ КАРТОЧКА ====== */
        :root {
            --pointer-x: 50%;
            --pointer-y: 50%;
            --pointer-from-center: 0;
            --pointer-from-top: 0.5;
            --pointer-from-left: 0.5;
            --card-opacity: 0;
            --rotate-x: 0deg;
            --rotate-y: 0deg;
            --background-x: 50%;
            --background-y: 50%;
            --grain: url(https://assets.codepen.io/13471/grain.webp);
            --metafy: url(https://assets.codepen.io/13471/metafy-repeat.png);
            --sunpillar-1: hsl(2, 100%, 73%);
            --sunpillar-2: hsl(53, 100%, 69%);
            --sunpillar-3: hsl(93, 100%, 69%);
            --sunpillar-4: hsl(176, 100%, 76%);
            --sunpillar-5: hsl(228, 100%, 74%);
            --sunpillar-6: hsl(283, 100%, 73%);
            --sunpillar-clr-1: var(--sunpillar-1);
            --sunpillar-clr-2: var(--sunpillar-2);
            --sunpillar-clr-3: var(--sunpillar-3);
            --sunpillar-clr-4: var(--sunpillar-4);
            --sunpillar-clr-5: var(--sunpillar-5);
            --sunpillar-clr-6: var(--sunpillar-6);
        }

        .profile-photo {
            width: 182px;
            aspect-ratio: 0.718;
            border-radius: 6.55% / 4.75%;
            position: relative;
            margin: 0 auto;
            flex-shrink: 0;
            box-sizing: border-box;
            --card-radius: 6.55% / 4.75%;
        }

        .profile-photo .card-wrapper {
            width: 100%;
            height: 100%;
            perspective: 500px;
            transform: translate3d(0, 0, 0.1px);
            position: relative;
            touch-action: none;
        }

        .profile-photo .card-wrapper::before {
            content: "";
            position: absolute;
            inset: -10px;
            background: inherit;
            background-position: inherit;
            border-radius: inherit;
            transition: all 0.5s ease;
            filter: contrast(2) saturate(2) blur(36px);
            transform: scale(0.8) translate3d(0, 0, 0.1px);
            background-size: 100% 100%;
            background-position: 0px 0px, 0px 0px, 50% 50%, 0px 0px;
            background-image: radial-gradient(
                farthest-side circle at var(--pointer-x, 50%) var(--pointer-y, 50%),
                hsla(266, 100%, 90%, var(--card-opacity)) 4%,
                hsla(266, 50%, 80%, calc(var(--card-opacity) * 0.75)) 10%,
                hsla(266, 25%, 70%, calc(var(--card-opacity) * 0.5)) 50%,
                hsla(266, 0%, 60%, 0) 100%
            ),
            radial-gradient(35% 52% at 55% 20%, #00FFAAC4 0%, #073AFF00 100%),
            radial-gradient(100% 100% at 50% 50%, #00C1FFFF 1%, #073AFF00 76%),
            conic-gradient(from 124deg at 50% 50%, #C137FFFF 0%, #07C6FFFF 40%, #07C6FFFF 60%, #C137FFFF 100%);
        }
        .profile-photo .card-wrapper:hover::before,
        .profile-photo .card-wrapper.active::before {
            filter: contrast(1) saturate(2) blur(40px) opacity(1);
            transform: scale(0.9) translate3d(0, 0, 0.1px);
        }

        .profile-photo #card {
            width: 100%;
            height: 100%;
            display: grid;
            aspect-ratio: 0.718;
            border-radius: var(--card-radius);
            position: relative;
            background-blend-mode: color-dodge, normal, normal, normal, normal;
            animation: glow-bg 12s linear infinite;
            box-shadow: rgba(0, 0, 0, 0.8) calc((var(--pointer-from-left) * 10px) - 3px) calc((var(--pointer-from-top) * 20px) - 6px) 20px -5px;
            transition: transform 1s ease;
            transform: translate3d(0, 0, 0.1px) rotateX(0deg) rotateY(0deg);
            background-size: 100% 100%;
            background-position: 0px 0px, 0px 0px, 50% 50%, 0px 0px;
            background-image: radial-gradient(
                farthest-side circle at var(--pointer-x, 50%) var(--pointer-y, 50%),
                hsla(266, 100%, 90%, var(--card-opacity)) 4%,
                hsla(266, 50%, 80%, calc(var(--card-opacity) * 0.75)) 10%,
                hsla(266, 25%, 70%, calc(var(--card-opacity) * 0.5)) 50%,
                hsla(266, 0%, 60%, 0) 100%
            ),
            radial-gradient(35% 52% at 55% 20%, #00FFAAC4 0%, #073AFF00 100%),
            radial-gradient(100% 100% at 50% 50%, #00C1FFFF 1%, #073AFF00 76%),
            conic-gradient(from 124deg at 50% 50%, #C137FFFF 0%, #07C6FFFF 40%, #07C6FFFF 60%, #C137FFFF 100%);
            overflow: hidden;
        }
        .profile-photo #card:hover,
        .profile-photo #card.active {
            transition: none;
            transform: translate3d(0, 0, 0.1px) rotateX(var(--rotate-y)) rotateY(var(--rotate-x));
        }
        .profile-photo .card-wrapper:hover,
        .profile-photo .card-wrapper.active {
            --card-opacity: 1;
        }
        .profile-photo #card * {
            border-radius: var(--card-radius);
            pointer-events: none;
        }

        /* Внутренняя раскладка: логотип сверху, ник+ранг снизу */
        .profile-photo #card .inside {
            inset: 1px;
            position: absolute;
            background-image: linear-gradient(145deg, #60496e8c 0%, #71C4FF44 100%);
            background-color: rgb(0 0 0 / 90%);
            border-radius: var(--card-radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 9% 0 7%;
            gap: 6px;
            z-index: 5;
            box-sizing: border-box;
        }

        .profile-photo .card__shine {
            position: absolute;
            inset: 0;
            border-radius: var(--card-radius);
            mask-image: var(--metafy);
            mask-mode: luminance;
            mask-repeat: repeat;
            mask-size: 150%;
            mask-position: top calc(200% - (var(--background-y) * 5)) left calc((100% - var(--background-x)));
            transition: filter 0.6s ease;
            filter: brightness(0.66) contrast(1.33) saturate(0.33) opacity(0.5);
            animation: holo-bg 18s linear infinite;
            mix-blend-mode: color-dodge;
            z-index: 3;
            background-image:
                repeating-linear-gradient(0deg,
                    var(--sunpillar-clr-1) calc(5% * 1),
                    var(--sunpillar-clr-2) calc(5% * 2),
                    var(--sunpillar-clr-3) calc(5% * 3),
                    var(--sunpillar-clr-4) calc(5% * 4),
                    var(--sunpillar-clr-5) calc(5% * 5),
                    var(--sunpillar-clr-6) calc(5% * 6),
                    var(--sunpillar-clr-1) calc(5% * 7)
                ),
                repeating-linear-gradient(-45deg,
                    #0e152e 0%,
                    hsl(180, 10%, 60%) 3.8%,
                    hsl(180, 29%, 66%) 4.5%,
                    hsl(180, 10%, 60%) 5.2%,
                    #0e152e 10%,
                    #0e152e 12%
                ),
                radial-gradient(
                    farthest-corner circle at var(--pointer-x) var(--pointer-y),
                    hsla(0, 0%, 0%, 0.1) 12%,
                    hsla(0, 0%, 0%, 0.15) 20%,
                    hsla(0, 0%, 0%, 0.25) 120%
                );
            background-position: 0% var(--background-y), calc(var(--background-x)) var(--background-y), center center;
            background-blend-mode: color, hard-light;
            background-size: 500% 500%, 300% 300%, 200% 200%;
            background-repeat: repeat;
        }

        .profile-photo .card__shine::before,
        .profile-photo .card__shine::after {
            content: "";
            position: absolute;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            border-radius: var(--card-radius);
        }

        .profile-photo #card:hover .card__shine,
        .profile-photo #card.active .card__shine {
            filter: brightness(0.85) contrast(1.5) saturate(0.5);
            animation: none;
        }
        .profile-photo #card:hover .card__shine::before,
        .profile-photo #card:hover .card__shine::after,
        .profile-photo #card.active .card__shine::before,
        .profile-photo #card.active .card__shine::after {
            opacity: 1;
        }

        .profile-photo .card__shine::before {
            background-image:
                linear-gradient(45deg,
                    var(--sunpillar-4),
                    var(--sunpillar-5),
                    var(--sunpillar-6),
                    var(--sunpillar-1),
                    var(--sunpillar-2),
                    var(--sunpillar-3)
                ),
                radial-gradient(circle at var(--pointer-x) var(--pointer-y), hsl(0, 0%, 70%) 0%, hsla(0, 0%, 30%, 20%) 90%),
                var(--grain);
            background-size: 250% 250%, 100% 100%, 220px 220px;
            background-position: var(--pointer-x) var(--pointer-y), center center, calc(var(--pointer-x) * 0.01) calc(var(--pointer-y) * 0.01);
            background-blend-mode: color-dodge;
            filter: brightness(calc(2 - var(--pointer-from-center))) contrast(calc(var(--pointer-from-center) + 2)) saturate(calc(0.5 + var(--pointer-from-center)));
            mix-blend-mode: luminosity;
        }

        .profile-photo .card__shine::after {
            background-image:
                repeating-linear-gradient(0deg,
                    var(--sunpillar-clr-1) calc(5% * 1),
                    var(--sunpillar-clr-2) calc(5% * 2),
                    var(--sunpillar-clr-3) calc(5% * 3),
                    var(--sunpillar-clr-4) calc(5% * 4),
                    var(--sunpillar-clr-5) calc(5% * 5),
                    var(--sunpillar-clr-6) calc(5% * 6),
                    var(--sunpillar-clr-1) calc(5% * 7)
                ),
                repeating-linear-gradient(-45deg,
                    #0e152e 0%,
                    hsl(180, 10%, 60%) 3.8%,
                    hsl(180, 29%, 66%) 4.5%,
                    hsl(180, 10%, 60%) 5.2%,
                    #0e152e 10%,
                    #0e152e 12%
                );
            background-position: 0% var(--background-y), calc((var(--background-x)) * 0.4) calc(var(--background-y) * 0.5);
            background-size: 200% 300%, 700% 700%;
            mix-blend-mode: difference;
            filter: brightness(0.8) contrast(1.5);
        }

        .profile-photo .card__glare {
            position: absolute;
            inset: 0;
            border-radius: var(--card-radius);
            background-image:
                radial-gradient(
                    farthest-corner circle at var(--pointer-x) var(--pointer-y),
                    hsl(248, 25%, 80%) 12%,
                    hsla(207, 40%, 30%, 0.8) 90%
                );
            mix-blend-mode: overlay;
            filter: brightness(0.8) contrast(1.2);
            z-index: 4;
        }

        /* Логотип */
        .profile-photo .avatar-wrap {
            width: 80%;
            margin: 0 auto;
            position: relative;
            z-index: 6;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-photo .avatar {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 50%;
            opacity: calc((1.9 - var(--pointer-from-center) * 0.6));
            box-shadow: rgba(0, 0, 0, 0.6) calc((var(--pointer-from-left) * 6px) - 2px) calc((var(--pointer-from-top) * 14px) - 4px) 20px -3px;
            display: block;
        }

        /* Ник и ранг — двумя строками */
        .profile-photo .details-wrap {
            position: relative;
            z-index: 6;
            width: 92%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 0 4px;
            box-sizing: border-box;
        }

        .profile-photo .profile-full-name {
            display: block;
            width: 100%;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.85), 0 0 10px rgba(102,192,244,0.35);
            letter-spacing: 0.4px;
            margin: 0;
            text-align: center;
            word-break: break-word;
            line-height: 1.2;
        }

        @keyframes glow-bg {
            0%   { --bgrotate: 0deg; }
            100% { --bgrotate: 360deg; }
        }

        @keyframes holo-bg {
            0%   { background-position: 0% var(--background-y), 0% 0%, center center; }
            100% { background-position: 0% var(--background-y), 90% 90%, center center; }
        }
        /* ====== /ГОЛОГРАФИЧЕСКАЯ КАРТОЧКА ====== */

        /* === Ранг (отдельной строкой под ником) === */
        .profile-rank-badge {
            display: flex;
            width: fit-content;
            margin: 0 auto;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #c7d0e0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.35);
            backdrop-filter: blur(4px);
        }
        .profile-rank-badge .material-symbols-outlined {
            font-size: 14px;
            color: #66c0f4;
        }
        .profile-rank-points {
            color: rgba(255,255,255,0.65);
            font-weight: 500;
            font-size: 10px;
            padding-left: 6px;
            border-left: 1px solid rgba(255,255,255,0.2);
        }
        .profile-rank-badge.rank-1 {
            background: linear-gradient(135deg, rgba(255,215,0,0.25), rgba(255,215,0,0.08));
            border-color: rgba(255,215,0,0.65);
            color: #ffd700;
            box-shadow: 0 0 16px rgba(255,215,0,0.3);
        }
        .profile-rank-badge.rank-1 .material-symbols-outlined { color: #ffd700; }
        .profile-rank-badge.rank-1 .profile-rank-points {
            color: rgba(255,215,0,0.85);
            border-left-color: rgba(255,215,0,0.35);
        }
        .profile-rank-badge.rank-2 {
            background: linear-gradient(135deg, rgba(192,192,192,0.25), rgba(192,192,192,0.08));
            border-color: rgba(192,192,192,0.65);
            color: #d8d8d8;
            box-shadow: 0 0 14px rgba(192,192,192,0.25);
        }
        .profile-rank-badge.rank-2 .material-symbols-outlined { color: #C0C0C0; }
        .profile-rank-badge.rank-2 .profile-rank-points {
            color: rgba(192,192,192,0.9);
            border-left-color: rgba(192,192,192,0.35);
        }
        .profile-rank-badge.rank-3 {
            background: linear-gradient(135deg, rgba(205,127,50,0.25), rgba(205,127,50,0.08));
            border-color: rgba(205,127,50,0.65);
            color: #e0a060;
            box-shadow: 0 0 14px rgba(205,127,50,0.25);
        }
        .profile-rank-badge.rank-3 .material-symbols-outlined { color: #CD7F32; }
        .profile-rank-badge.rank-3 .profile-rank-points {
            color: rgba(205,127,50,0.9);
            border-left-color: rgba(205,127,50,0.35);
        }

        .profile-section { padding: 20px 0; }
        .profile-section-name { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .profile-section-name .material-symbols-outlined { font-size: 22px; color: #66c0f4; }
        .profile-section-content { color: #c7d0e0; font-size: 14px; line-height: 1.6; }

        .profile-label { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: rgba(102,192,244,0.1); border: 1px solid rgba(102,192,244,0.3); color: #66c0f4; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; font-family: 'Inter', sans-serif; text-decoration: none; transition: all 0.2s; }
        .profile-label:hover { background: rgba(102,192,244,0.2); }
        .profile-label .material-symbols-outlined { font-size: 16px; }

                .ach-grid { display: flex; flex-wrap: wrap; gap: 20px; }

        /* === МИНИ-ГОЛОГРАФИЧЕСКАЯ КАРТОЧКА ДОСТИЖЕНИЯ === */
        .ach-item { position: relative; cursor: pointer; }

        .ach-card {
            width: 130px;
            aspect-ratio: 0.718;
            border-radius: 6.55% / 4.75%;
            position: relative;
            --card-radius: 6.55% / 4.75%;
            transition: transform 0.3s ease;
        }

        .ach-card-wrapper {
            width: 100%;
            height: 100%;
            perspective: 500px;
            transform: translate3d(0, 0, 0.1px);
            position: relative;
        }

        .ach-card-wrapper::before {
            content: "";
            position: absolute;
            inset: -8px;
            border-radius: inherit;
            transition: all 0.5s ease;
            filter: contrast(2) saturate(2) blur(28px);
            transform: scale(0.8) translate3d(0, 0, 0.1px);
            background-size: 100% 100%;
            background-position: 0px 0px, 0px 0px, 50% 50%, 0px 0px;
            background-image: radial-gradient(
                farthest-side circle at var(--pointer-x, 50%) var(--pointer-y, 50%),
                hsla(266, 100%, 90%, var(--card-opacity)) 4%,
                hsla(266, 50%, 80%, calc(var(--card-opacity) * 0.75)) 10%,
                hsla(266, 25%, 70%, calc(var(--card-opacity) * 0.5)) 50%,
                hsla(266, 0%, 60%, 0) 100%
            ),
            radial-gradient(35% 52% at 55% 20%, #00FFAAC4 0%, #073AFF00 100%),
            radial-gradient(100% 100% at 50% 50%, #00C1FFFF 1%, #073AFF00 76%),
            conic-gradient(from 124deg at 50% 50%, #C137FFFF 0%, #07C6FFFF 40%, #07C6FFFF 60%, #C137FFFF 100%);
        }

        .ach-card-wrapper:hover::before,
        .ach-card-wrapper.active::before {
            filter: contrast(1) saturate(2) blur(32px) opacity(1);
            transform: scale(0.9) translate3d(0, 0, 0.1px);
        }

        .ach-card-inner {
            width: 100%;
            height: 100%;
            display: grid;
            aspect-ratio: 0.718;
            border-radius: var(--card-radius);
            position: relative;
            background-blend-mode: color-dodge, normal, normal, normal, normal;
            box-shadow: rgba(0, 0, 0, 0.8) calc((var(--pointer-from-left) * 10px) - 3px) calc((var(--pointer-from-top) * 20px) - 6px) 20px -5px;
            transition: transform 1s ease;
            transform: translate3d(0, 0, 0.1px) rotateX(0deg) rotateY(0deg);
            background-size: 100% 100%;
            background-position: 0px 0px, 0px 0px, 50% 50%, 0px 0px;
            background-image: radial-gradient(
                farthest-side circle at var(--pointer-x, 50%) var(--pointer-y, 50%),
                hsla(266, 100%, 90%, var(--card-opacity)) 4%,
                hsla(266, 50%, 80%, calc(var(--card-opacity) * 0.75)) 10%,
                hsla(266, 25%, 70%, calc(var(--card-opacity) * 0.5)) 50%,
                hsla(266, 0%, 60%, 0) 100%
            ),
            radial-gradient(35% 52% at 55% 20%, #00FFAAC4 0%, #073AFF00 100%),
            radial-gradient(100% 100% at 50% 50%, #00C1FFFF 1%, #073AFF00 76%),
            conic-gradient(from 124deg at 50% 50%, #C137FFFF 0%, #07C6FFFF 40%, #07C6FFFF 60%, #C137FFFF 100%);
            overflow: hidden;
        }

        .ach-card-wrapper:hover .ach-card-inner,
        .ach-card-wrapper.active .ach-card-inner {
            transition: none;
            transform: translate3d(0, 0, 0.1px) rotateX(var(--rotate-y)) rotateY(var(--rotate-x));
        }

        .ach-card-wrapper:hover,
        .ach-card-wrapper.active {
            --card-opacity: 1;
        }

        .ach-card-inner * {
            border-radius: var(--card-radius);
            pointer-events: none;
        }

        .ach-card-inner .ach-inside {
            inset: 1px;
            position: absolute;
            background-image: linear-gradient(145deg, #60496e8c 0%, #71C4FF44 100%);
            background-color: rgb(0 0 0 / 85%);
            border-radius: var(--card-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10%;
            z-index: 5;
            box-sizing: border-box;
        }

        .ach-card-inner .ach-inside img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .ach-card .card__shine {
            position: absolute;
            inset: 0;
            border-radius: var(--card-radius);
            mask-image: var(--metafy);
            mask-mode: luminance;
            mask-repeat: repeat;
            mask-size: 150%;
            mask-position: top calc(200% - (var(--background-y) * 5)) left calc((100% - var(--background-x)));
            transition: filter 0.6s ease;
            filter: brightness(0.66) contrast(1.33) saturate(0.33) opacity(0.5);
            mix-blend-mode: color-dodge;
            z-index: 3;
            background-image:
                repeating-linear-gradient(0deg,
                    var(--sunpillar-clr-1) calc(5% * 1),
                    var(--sunpillar-clr-2) calc(5% * 2),
                    var(--sunpillar-clr-3) calc(5% * 3),

    <script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDQMXKc1q4SQYIKlhqzPmB9-h0rCV90Itk",
            authDomain: "ak4ak-8be45.firebaseapp.com",
            databaseURL: "https://ak4ak-8be45-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "ak4ak-8be45",
            storageBucket: "ak4ak-8be45.appspot.com",
            messagingSenderId: "408070680295",
            appId: "1:408070680295:web:77b9656094e330b803bc42"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        var currentUid = null;
        var isAdmin = false;

        const urlParams = new URLSearchParams(window.location.search);
        const viewUid = urlParams.get('uid');
        const viewNick = urlParams.get('nick');

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }
            currentUid = user.uid;

            const targetUid = viewUid || user.uid;

            const userSnap = await get(ref(db, 'users/' + user.uid));
            let myNick = null;
            if (userSnap.exists()) {
                const ud = userSnap.val();
                myNick = ud.nick || ud.email.split('@')[0];
            }
            if (myNick) {
                const adminSnap = await get(ref(db, 'playoff/adminNicks/' + myNick));
                isAdmin = adminSnap.exists() && adminSnap.val() === true;
            }

            get(ref(db, 'users/' + targetUid)).then((snapshot) => {
                let nick = "Пользователь";
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    nick = data.nick || data.email.split('@')[0];
                } else if (viewNick) {
                    nick = viewNick;
                }
                document.getElementById('profile-name').textContent = nick;
                loadPlayerStats(nick);
                loadPlayerRank(nick);
            });

            initAchievements(targetUid, isAdmin);
        });

        /* ======================== РАНГ ======================== */
        function chakChakWord(n) {
            var mod10 = n % 10;
            var mod100 = n % 100;
            if (mod100 >= 11 && mod100 <= 14) return 'чак-чаков';
            if (mod10 === 1) return 'чак-чак';
            if (mod10 >= 2 && mod10 <= 4) return 'чак-чака';
            return 'чак-чаков';
        }

        async function loadPlayerRank(nick) {
            if (!nick) return;
            try {
                const tournamentsSnap = await get(ref(db, 'playoff/tournaments'));
                const tournaments = tournamentsSnap.val() || {};

                const stats = {};
                for (const tid in tournaments) {
                    const t = tournaments[tid];
                    if (!t || !t.finalResult) continue;
                    const fr = t.finalResult;
                    const winners = fr.winners || [];
                    const runnersUp = fr.runnersUp || [];

                    winners.forEach(function(n) {
                        if (!n) return;
                        if (!stats[n]) stats[n] = { champ: 0, finalist: 0, points: 0 };
                        stats[n].champ++;
                        stats[n].points += 2;
                    });
                    runnersUp.forEach(function(n) {
                        if (!n) return;
                        if (!stats[n]) stats[n] = { champ: 0, finalist: 0, points: 0 };
                        stats[n].finalist++;
                        stats[n].points += 1;
                    });
                }

                if (!stats[nick] || stats[nick].points === 0) return;

                const arr = Object.keys(stats).map(function(n) {
                    return { nick: n, champ: stats[n].champ, finalist: stats[n].finalist, points: stats[n].points };
                });
                arr.sort(function(a, b) {
                    if (b.points !== a.points) return b.points - a.points;
                    if (b.champ !== a.champ) return b.champ - a.champ;
                    return b.finalist - a.finalist;
                });

                const pos = arr.findIndex(function(r) { return r.nick === nick; }) + 1;
                if (pos <= 0) return;

                const my = stats[nick];

                const rankEl = document.getElementById('profileRank');
                const textEl = document.getElementById('profileRankText');
                const pointsEl = document.getElementById('profileRankPoints');

                textEl.textContent = '#' + pos;
                pointsEl.textContent = my.points + ' ' + chakChakWord(my.points);

                rankEl.classList.remove('rank-1', 'rank-2', 'rank-3');
                if (pos === 1) rankEl.classList.add('rank-1');
                else if (pos === 2) rankEl.classList.add('rank-2');
                else if (pos === 3) rankEl.classList.add('rank-3');

                rankEl.style.display = 'flex';
                rankEl.style.margin = '0 auto';
                rankEl.style.width = 'fit-content';
            } catch (e) {
                console.error('Ошибка загрузки ранга:', e);
            }
        }

        /* ======================== СТАТИСТИКА ======================== */
        async function loadPlayerStats(nick) {
            const statsBlock = document.getElementById('profileStats');
            const statsList = document.getElementById('statsList');
            if (!statsBlock || !statsList || !nick) return;

            try {
                const tournamentsSnap = await get(ref(db, 'playoff/tournaments'));
                const tournaments = tournamentsSnap.val() || {};

                const stats = [];
                const stageOrder = { 'final': 4, 'sf': 3, 'qf': 2, 'ef': 1 };

                for (const tId in tournaments) {
                    const t = tournaments[tId];
                    if (!t || !t.matches) continue;
                    const matches = t.matches;

                    let maxStage = null;
                    let stageLabel = '';
                    let isWinner = false;
                    let isFinalist = false;
                    let prize = null;

                    for (const mid in matches) {
                        if (mid.indexOf('ef_') !== 0) continue;
                        const m = matches[mid];
                        if ((m.left || []).indexOf(nick) !== -1 || (m.right || []).indexOf(nick) !== -1) {
                            maxStage = 'ef'; stageLabel = '1/8 финала';
                        }
                    }
                    for (const mid in matches) {
                        if (mid.indexOf('qf_') !== 0) continue;
                        const m = matches[mid];
                        if ((m.left || []).indexOf(nick) !== -1 || (m.right || []).indexOf(nick) !== -1) {
                            maxStage = 'qf'; stageLabel = 'Четвертьфинал';
                        }
                    }
                    for (const mid of ['sf_w', 'sf_e']) {
                        const m = matches[mid];
                        if (!m) continue;
                        if ((m.left || []).indexOf(nick) !== -1 || (m.right || []).indexOf(nick) !== -1) {
                            maxStage = 'sf'; stageLabel = 'Полуфинал';
                        }
                    }
                    const finalM = matches['final'];
                    if (finalM) {
                        if ((finalM.left || []).indexOf(nick) !== -1 || (finalM.right || []).indexOf(nick) !== -1) {
                            maxStage = 'final';
                            stageLabel = 'Финал';
                            if (finalM.winner) {
                                const winSide = finalM.winner;
                                const loseSide = winSide === 'left' ? 'right' : 'left';
                                const winners = finalM[winSide] || [];
                                const finalists = finalM[loseSide] || [];
                                if (winners.indexOf(nick) !== -1) { isWinner = true; stageLabel = 'Победитель'; }
                                else if (finalists.indexOf(nick) !== -1) { isFinalist = true; stageLabel = 'Финалист'; }
                            }
                        }
                    }

                    if (finalM && finalM.prizes) {
                        const p = finalM.prizes['win_' + nick] || finalM.prizes['fin_' + nick];
                        if (p && p.name) prize = p;
                    }

                    if (maxStage) {
                        stats.push({
                            tournamentName: t.name || tId,
                            stage: maxStage,
                            stageLabel: stageLabel,
                            isWinner: isWinner,
                            isFinalist: isFinalist,
                            prize: prize
                        });
                    }
                }

                if (stats.length === 0) {
                    statsBlock.style.display = 'none';
                    return;
                }

                stats.sort(function(a, b) { return stageOrder[b.stage] - stageOrder[a.stage]; });

                statsBlock.style.display = 'block';
                statsList.innerHTML = stats.map(function(s) {
                    var stageCls = 'stat-stage';
                    var icon = 'flag';
                    if (s.isWinner) { stageCls += ' winner'; icon = 'emoji_events'; }
                    else if (s.isFinalist) { stageCls += ' finalist'; icon = 'military_tech'; }
                    else if (s.stage === 'final') { icon = 'emoji_events'; }
                    else if (s.stage === 'sf') { icon = 'workspace_premium'; }

                    var prizeHtml = '';
                    if (s.prize) {
                        prizeHtml =
                            '<div class="stat-prize">' +
                                '<img src="' + s.prize.url + '" alt="' + s.prize.name + '">' +
                                '<div>' +
                                    '<div class="stat-prize-label">Приз</div>' +
                                    '<div class="stat-prize-name">' + s.prize.name + '</div>' +
                                '</div>' +
                            '</div>';
                    }

                    return (
                        '<div class="stat-card">' +
                            '<div class="stat-tournament">' + s.tournamentName + '</div>' +
                            '<div class="' + stageCls + '">' +
                                '<span class="material-symbols-outlined">' + icon + '</span>' +
                                s.stageLabel +
                            '</div>' +
                            prizeHtml +
                        '</div>'
                    );
                }).join('');

            } catch (e) {
                console.error('Ошибка загрузки статистики:', e);
                statsBlock.style.display = 'none';
            }
        }

        /* ======================== ДОСТИЖЕНИЯ ======================== */
        var achRef = null;
        var lastAchData = null;
        var targetAchievementsUid = null;

        function initAchievements(uid, admin) {
            targetAchievementsUid = uid;
            achRef = ref(db, 'achievements/' + uid);

            if (admin) {
                document.getElementById('achAdminBtns').style.display = 'flex';
            }

            onValue(achRef, function(snapshot) {
                lastAchData = snapshot.val();
                renderAchievements();
            });

            document.getElementById('achAddBtn').addEventListener('click', function() {
                document.getElementById('achAdminPanel').classList.toggle('visible');
            });
            document.getElementById('achSubmitBtn').addEventListener('click', achAdd);
            document.getElementById('achCancelBtn').addEventListener('click', function() {
                document.getElementById('achAdminPanel').classList.remove('visible');
            });

            document.querySelectorAll('.ach-img-option').forEach(function(img) {
                img.addEventListener('click', function() {
                    achSelectImg(img, img.getAttribute('src'));
                });
            });

            document.addEventListener('click', function(e) {
                if (!e.target.closest('.ach-item')) {
                    document.querySelectorAll('.ach-item').forEach(function(item) { item.classList.remove('active'); });
                }
            });
        }

        function renderAchievements() {
            var loading = document.getElementById('achLoading');
            if (loading) loading.style.display = 'none';

            var grid = document.getElementById('achGrid');
            var empty = document.getElementById('achEmpty');
            var data = lastAchData;

            grid.querySelectorAll('.ach-item').forEach(function(el) { el.remove(); });

            if (!data) {
                if (empty) empty.style.display = 'block';
                return;
            }

            if (empty) empty.style.display = 'none';

            Object.keys(data).forEach(function(key) {
                var item = data[key];
                var div = document.createElement('div');
                div.className = 'ach-item';
                div.addEventListener('click', function() { achToggleTooltip(div); });

                var deleteBtn = '';
                if (isAdmin) {
                    deleteBtn = '<button class="ach-delete-btn" data-key="' + key + '" title="Удалить">&times;</button>';
                }

                               div.innerHTML =
                    '<div class="ach-card">' +
                        '<div class="ach-card-wrapper">' +
                            '<div class="ach-card-inner">' +
                                '<div class="ach-inside">' +
                                    '<img src="' + item.img + '" alt="">' +
                                '</div>' +
                                '<div class="card__shine"></div>' +
                                '<div class="card__glare"></div>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                    deleteBtn +
                    '<div class="ach-tooltip"><span class="ach-title">' + (item.title || '') + '</span>' + (item.desc || '') + '</div>';
                
                var del = div.querySelector('.ach-delete-btn');
                if (del) {
                    del.addEventListener('click', function(e) {
                        e.stopPropagation();
                        achDelete(key);
                    });
                }

                grid.appendChild(div);
            });
        }

        function achToggleTooltip(el) {
            document.querySelectorAll('.ach-item').forEach(function(item) { if (item !== el) item.classList.remove('active'); });
            el.classList.toggle('active');
        }

        function achSelectImg(el, url) {
            document.querySelectorAll('.ach-img-option').forEach(function(opt) { opt.classList.remove('selected'); });
            el.classList.add('selected');
            document.getElementById('achSelectedImg').value = url;
        }

        function achAdd() {
            var img = document.getElementById('achSelectedImg').value;
            var title = document.getElementById('achTitle').value.trim();
            var desc = document.getElementById('achDesc').value.trim();
            if (!img) { alert('Выберите картинку!'); return; }
            if (!title) { alert('Введите название!'); return; }

            var newItemRef = push(achRef);
            set(newItemRef, { img: img, title: title, desc: desc }).then(function() {
                document.getElementById('achTitle').value = '';
                document.getElementById('achDesc').value = '';
                document.getElementById('achSelectedImg').value = '';
                document.querySelectorAll('.ach-img-option').forEach(function(opt) { opt.classList.remove('selected'); });
                document.getElementById('achAdminPanel').classList.remove('visible');
            });
        }

        function achDelete(key) {
            if (!confirm('Удалить?')) return;
            remove(ref(db, 'achievements/' + targetAchievementsUid + '/' + key));
        }
    </script>

    <!-- Голографическая карточка: взаимодействие с курсором -->
    <script>
    (function() {
        const $wrap = document.querySelector(".profile-photo .card-wrapper");
        const $card = document.querySelector("#card");
        if (!$wrap || !$card) return;

        const cardUpdate = (e) => {
            if (e.pointerType === "touch" && e.preventDefault) e.preventDefault();

            const dimensions = $card.getBoundingClientRect();
            const l = e.offsetX;
            const t = e.offsetY;
            const h = dimensions.height;
            const w = dimensions.width;
            const px = clamp(Math.abs((100 / w) * l), 0, 100);
            const py = clamp(Math.abs((100 / h) * t), 0, 100);
            const cx = px - 50;
            const cy = py - 50;

            $wrap.setAttribute(
                "style",
                `
                  --pointer-x: ${px}%;
                  --pointer-y: ${py}%;
                  --background-x: ${adjust(px, 0, 100, 35, 65)}%;
                  --background-y: ${adjust(py, 0, 100, 35, 65)}%;
                  --pointer-from-center: ${clamp(
                    Math.sqrt((py - 50) * (py - 50) + (px - 50) * (px - 50)) / 50,
                    0,
                    1
                  )};
                  --pointer-from-top: ${py / 100};
                  --pointer-from-left: ${px / 100};
                  --rotate-x: ${round(-(cx / 5))}deg;
                  --rotate-y: ${round(cy / 4)}deg;
                `
            );
        };

        function ease(x) {
            return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
        }

        function easedFunc(durationMs, onProgress, onComplete) {
            let startTime = performance.now();
            let canceled = false;

            function loop() {
                if (canceled) return;
                const currentTime = performance.now();
                const progress = (currentTime - startTime) / durationMs;
                const easedProgress = ease(progress);
                onProgress(easedProgress);
                if (progress < 1) requestAnimationFrame(loop);
                else if (onComplete) onComplete();
            }
            loop();

            return { cancel: () => { canceled = true; } };
        }

        const round = (value, precision = 3) => parseFloat(value.toFixed(precision));
        const clamp = (value, min = 0, max = 100) => Math.min(Math.max(value, min), max);
        const adjust = (value, fromMin, fromMax, toMin, toMax) =>
            round(toMin + ((toMax - toMin) * (value - fromMin)) / (fromMax - fromMin));

        const halfW = $wrap.clientWidth / 2;
        const halfH = $wrap.clientHeight / 2;

        let easer;
        $card.addEventListener("pointerenter", () => { if (easer) easer.cancel(); });
        $card.addEventListener("pointermove", cardUpdate);
        $card.addEventListener("pointerout", (e) => {
            easer = easedFunc(
                1000,
                (p) => {
                    const x = adjust(p, 0, 1, e.offsetX, halfW);
                    const y = adjust(p, 0, 1, e.offsetY, halfH);
                    cardUpdate({ offsetX: x, offsetY: y });
                }
            );
        });

        cardUpdate({ offsetX: $wrap.clientWidth - 10, offsetY: 10 });

        setTimeout(() => {
            easer = easedFunc(
                2500,
                (p) => {
                    const x = adjust(p, 0, 1, $wrap.clientWidth - 10, halfW);
                    const y = adjust(p, 0, 1, 10, halfH);
                    cardUpdate({ offsetX: x, offsetY: y });
                }
            );
        }, 800);
    })();
            /* === ГОЛОГРАФИЧЕСКИЕ КАРТОЧКИ ДОСТИЖЕНИЙ === */
    (function() {
        // Функция для обновления позиции курсора на мини-карточке
        function updateAchCard(e) {
            const wrapper = e.currentTarget;
            const inner = wrapper.querySelector('.ach-card-inner');
            if (!inner) return;

            const dimensions = inner.getBoundingClientRect();
            const l = e.clientX - dimensions.left;
            const t = e.clientY - dimensions.top;
            const h = dimensions.height;
            const w = dimensions.width;
            const px = Math.min(Math.max((100 / w) * l, 0), 100);
            const py = Math.min(Math.max((100 / h) * t, 0), 100);
            const cx = px - 50;
            const cy = py - 50;

            wrapper.style.setProperty('--pointer-x', px + '%');
            wrapper.style.setProperty('--pointer-y', py + '%');
            wrapper.style.setProperty('--background-x', px + '%');
            wrapper.style.setProperty('--background-y', py + '%');
            wrapper.style.setProperty('--pointer-from-center', Math.min(Math.sqrt((py - 50) * (py - 50) + (px - 50) * (px - 50)) / 50, 1));
            wrapper.style.setProperty('--pointer-from-top', py / 100);
            wrapper.style.setProperty('--pointer-from-left', px / 100);
            wrapper.style.setProperty('--rotate-x', (-(cx / 5)) + 'deg');
            wrapper.style.setProperty('--rotate-y', (cy / 4) + 'deg');
        }

        // Функция сброса (когда курсор уходит)
        function resetAchCard(e) {
            const wrapper = e.currentTarget;
            wrapper.style.setProperty('--rotate-x', '0deg');
            wrapper.style.setProperty('--rotate-y', '0deg');
            wrapper.style.setProperty('--pointer-from-center', '0');
            wrapper.style.setProperty('--card-opacity', '0');
            wrapper.classList.remove('active');
        }

        // Применяем к карточкам при их появлении
        function attachAchEvents() {
            document.querySelectorAll('.ach-card-wrapper').forEach(function(wrapper) {
                if (wrapper.dataset.eventsAttached) return;
                wrapper.dataset.eventsAttached = 'true';
                wrapper.addEventListener('mouseenter', function() {
                    wrapper.classList.add('active');
                    wrapper.style.setProperty('--card-opacity', '1');
                });
                wrapper.addEventListener('mousemove', updateAchCard);
                wrapper.addEventListener('mouseleave', resetAchCard);
            });
        }

        // Наблюдаем за появлением новых карточек
        const grid = document.getElementById('achGrid');
        if (grid) {
            const observer = new MutationObserver(attachAchEvents);
            observer.observe(grid, { childList: true, subtree: true });
            attachAchEvents();
        }
    })();
    </script>
