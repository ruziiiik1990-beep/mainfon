<html lang="ru">
<head>

    <title>Профиль - 4ak4ak</title>
    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-image: url('kolo13.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            color: #fff;
        }

        .profile-container {
            max-width: 900px;
            margin: 100px auto 40px auto;
            padding: 0 20px;
        }

        .profile-table-wrapper {
            background: #374151;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            overflow: visible;
            margin-bottom: 20px;
            position: relative;
        }
        
        .profile-intro, .profile-body { padding: 0 24px; }

        .profile-head {
            display: flex;
            align-items: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .profile-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            background-color: #555;
            border: 3px solid #e3769c;
            margin-right: 20px;
            flex-shrink: 0;
        }

        .profile-name {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .profile-full-name { font-size: 24px; font-weight: 700; display: block; }

        /* === Ранг рядом с ником === */
        .profile-rank-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            color: #c7d0e0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .profile-rank-badge .material-symbols-outlined {
            font-size: 18px;
            color: #66c0f4;
        }
        .profile-rank-points {
            color: rgba(255,255,255,0.55);
            font-weight: 500;
            font-size: 12px;
            padding-left: 8px;
            border-left: 1px solid rgba(255,255,255,0.15);
        }
        /* Золото — 1 место */
        .profile-rank-badge.rank-1 {
            background: linear-gradient(135deg, rgba(255,215,0,0.22), rgba(255,215,0,0.05));
            border-color: rgba(255,215,0,0.55);
            color: #ffd700;
            box-shadow: 0 0 16px rgba(255,215,0,0.25);
        }
        .profile-rank-badge.rank-1 .material-symbols-outlined { color: #ffd700; }
        .profile-rank-badge.rank-1 .profile-rank-points {
            color: rgba(255,215,0,0.8);
            border-left-color: rgba(255,215,0,0.3);
        }
        /* Серебро — 2 место */
        .profile-rank-badge.rank-2 {
            background: linear-gradient(135deg, rgba(192,192,192,0.22), rgba(192,192,192,0.05));
            border-color: rgba(192,192,192,0.55);
            color: #d8d8d8;
            box-shadow: 0 0 14px rgba(192,192,192,0.2);
        }
        .profile-rank-badge.rank-2 .material-symbols-outlined { color: #C0C0C0; }
        .profile-rank-badge.rank-2 .profile-rank-points {
            color: rgba(192,192,192,0.85);
            border-left-color: rgba(192,192,192,0.3);
        }
        /* Бронза — 3 место */
        .profile-rank-badge.rank-3 {
            background: linear-gradient(135deg, rgba(205,127,50,0.22), rgba(205,127,50,0.05));
            border-color: rgba(205,127,50,0.55);
            color: #e0a060;
            box-shadow: 0 0 14px rgba(205,127,50,0.2);
        }
        .profile-rank-badge.rank-3 .material-symbols-outlined { color: #CD7F32; }
        .profile-rank-badge.rank-3 .profile-rank-points {
            color: rgba(205,127,50,0.85);
            border-left-color: rgba(205,127,50,0.3);
        }

        .profile-section { padding: 20px 0; }
        .profile-section-name { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .profile-section-name .material-symbols-outlined { font-size: 22px; color: #66c0f4; }
        .profile-section-content { color: #c7d0e0; font-size: 14px; line-height: 1.6; }

        .profile-label { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: rgba(102,192,244,0.1); border: 1px solid rgba(102,192,244,0.3); color: #66c0f4; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; font-family: 'Inter', sans-serif; text-decoration: none; transition: all 0.2s; }
        .profile-label:hover { background: rgba(102,192,244,0.2); }
        .profile-label .material-symbols-outlined { font-size: 16px; }

        .ach-grid { display: flex; flex-wrap: wrap; gap: 12px; }
        .ach-item { position: relative; cursor: pointer; transition: transform 0.2s ease; }
        .ach-item:hover { transform: scale(1.08); z-index: 999; }
        .ach-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 10px; border: 2px solid rgba(255,255,255,0.15); display: block; }
        .ach-delete-btn { position: absolute; top: -4px; right: -4px; width: 18px; height: 18px; border-radius: 50%; background: #dc2626; color: #fff; border: none; font-size: 12px; line-height: 18px; text-align: center; cursor: pointer; display: none; z-index: 10; padding: 0; }
        .ach-item:hover .ach-delete-btn { display: block; }
        
        .ach-tooltip { position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%) translateY(8px) scale(0.8); opacity: 0; background: #1a1a2e; color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 13px; line-height: 1.5; max-width: 260px; min-width: 160px; box-shadow: 0 6px 20px rgba(0,0,0,0.6); pointer-events: none; z-index: 9999; transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); white-space: normal; text-align: center; }
        .ach-tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 7px solid transparent; border-top-color: #1a1a2e; }
        .ach-item.active .ach-tooltip { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
        .ach-item.active { z-index: 999; }
        .ach-tooltip .ach-title { display: block; font-weight: 700; color: #66c0f4; margin-bottom: 4px; font-size: 14px; }
        .ach-empty { color: #6b7280; font-size: 13px; font-style: italic; }
        .ach-loading { color: #6b7280; font-size: 13px; font-style: italic; text-align: center; padding: 20px; }

        .ach-admin-panel { display: none; margin-top: 16px; padding: 16px; background: rgba(0,0,0,0.3); border-radius: 12px; border: 1px dashed rgba(102,192,244,0.25); }
        .ach-admin-panel.visible { display: block; }
        .ach-admin-panel h4 { margin: 0 0 12px 0; color: #e0e6f0; font-size: 14px; font-weight: 600; }
        .ach-img-picker { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .ach-img-option { width: 56px; height: 56px; border-radius: 8px; border: 3px solid transparent; cursor: pointer; object-fit: cover; transition: all 0.2s; }
        .ach-img-option:hover { border-color: rgba(102,192,244,0.5); transform: scale(1.1); }
        .ach-img-option.selected { border-color: #66c0f4; box-shadow: 0 0 12px rgba(102,192,244,0.4); }
        .ach-admin-input { width: 100%; box-sizing: border-box; padding: 8px 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: rgba(0,0,0,0.3); color: #e0e6f0; font-size: 13px; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s; }
        .ach-admin-input:focus { border-color: #66c0f4; }

        /* === Статистика турниров === */
        .profile-stats { padding: 0 0 26px; }
        .profile-stats .profile-section-name {
            margin: 22px 0 14px;

            border-top: 1px solid rgba(255,255,255,0.1);

        .stats-list { display: flex; flex-direction: column; gap: 12px; }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 14px 18px;
            transition: border-color 0.2s, transform 0.2s;

        .stat-card:hover {
            border-color: rgba(102,192,244,0.4);
            transform: translateY(-2px);
        }
        .stat-tournament {
            font-size: 15px;
            font-weight: 700;
            color: #66c0f4;
            margin-bottom: 8px;
        }
        .stat-stage {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #c7d0e0;
            padding: 4px 12px;
            background: rgba(255,255,255,0.06);
            border-radius: 20px;
        }
        .stat-stage .material-symbols-outlined { font-size: 18px; color: #ffd700; }
        .stat-stage.winner {
            color: #66bb6a;
            background: rgba(76,175,80,0.15);
            border: 1px solid rgba(76,175,80,0.35);
        }
        .stat-stage.winner .material-symbols-outlined { color: #66bb6a; }
        .stat-stage.finalist {
            color: #ffd700;
            background: rgba(255,215,0,0.12);
            border: 1px solid rgba(255,215,0,0.35);
        }
        .stat-prize {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .stat-prize img {
            width: 88px;
            height: 50px;
            object-fit: contain;
            border-radius: 6px;
            border: 1px solid rgba(255,215,0,0.3);
            background: rgba(0,0,0,0.3);
            padding: 2px;
        }
        .stat-prize-label {
            font-size: 10px;
            color: rgba(255,255,255,0.45);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 2px;
        }
        .stat-prize-name { font-size: 13px; font-weight: 600; color: #ffd700; }

        @media (max-width: 768px) {
            .profile-head { flex-direction: column; text-align: center; }
            .profile-photo { margin-right: 0; margin-bottom: 15px; }
            .profile-name { justify-content: center; }
        }
    </style>
</head>

    <script>
        fetch('header.html').then(r => r.text()).then(data => {
            document.getElementById('header-placeholder').innerHTML = data;
            const script = document.createElement('script');
            script.type = 'module';
            script.src = 'auth.js';
            document.body.appendChild(script);

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDQMXKc1q4SQYIKlhqzPmB9-h0rCV90Itk",
            authDomain: "ak4ak-8be45.firebaseapp.com",
            databaseURL: "https://ak4ak-8be45-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "ak4ak-8be45",
            storageBucket: "ak4ak-8be45.appspot.com",
            messagingSenderId: "408070680295",
            appId: "1:408070680295:web:77b9656094e330b803bc42"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        var currentUid = null;
        var isAdmin = false;

        const urlParams = new URLSearchParams(window.location.search);
        const viewUid = urlParams.get('uid');
        const viewNick = urlParams.get('nick');

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }
            currentUid = user.uid;

            const targetUid = viewUid || user.uid;

            // === ПРОВЕРКА АДМИНА ЧЕРЕЗ playoff/adminNicks ===
            const userSnap = await get(ref(db, 'users/' + user.uid));
            let myNick = null;
            if (userSnap.exists()) {
                const ud = userSnap.val();
                myNick = ud.nick || ud.email.split('@')[0];
            }
            if (myNick) {
                const adminSnap = await get(ref(db, 'playoff/adminNicks/' + myNick));
                isAdmin = adminSnap.exists() && adminSnap.val() === true;
            }

            get(ref(db, 'users/' + targetUid)).then((snapshot) => {
                let nick = "Пользователь";
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    nick = data.nick || data.email.split('@')[0];
                } else if (viewNick) {
                    nick = viewNick;
                }
                document.getElementById('profile-name').textContent = nick;
                loadPlayerStats(nick);
                loadPlayerRank(nick);
            });

            initAchievements(targetUid, isAdmin);
        });

        /* ======================== РАНГ (турнирная таблица) ======================== */
        // Склонение "чак-чак"
        function chakChakWord(n) {
            var mod10 = n % 10;
            var mod100 = n % 100;
            if (mod100 >= 11 && mod100 <= 14) return 'чак-чаков';
            if (mod10 === 1) return 'чак-чак';
            if (mod10 >= 2 && mod10 <= 4) return 'чак-чака';
            return 'чак-чаков';
        }

        async function loadPlayerRank(nick) {
            if (!nick) return;
            try {
                const tournamentsSnap = await get(ref(db, 'playoff/tournaments'));
                const tournaments = tournamentsSnap.val() || {};

                // Считаем очки — точно так же, как в rank.html
                const stats = {};
                for (const tid in tournaments) {
                    const t = tournaments[tid];
                    if (!t || !t.finalResult) continue;
                    const fr = t.finalResult;
                    const winners = fr.winners || [];
                    const runnersUp = fr.runnersUp || [];

                    winners.forEach(function(n) {
                        if (!n) return;
                        if (!stats[n]) stats[n] = { champ: 0, finalist: 0, points: 0 };
                        stats[n].champ++;
                        stats[n].points += 2;
                    });
                    runnersUp.forEach(function(n) {
                        if (!n) return;
                        if (!stats[n]) stats[n] = { champ: 0, finalist: 0, points: 0 };
                        stats[n].finalist++;
                        stats[n].points += 1;
                    });
                }

                // Если у игрока нет очков — ранг не показываем
                if (!stats[nick] || stats[nick].points === 0) {
                    return;
                }

                // Сортируем как в rank.html
                const arr = Object.keys(stats).map(function(n) {
                    return { nick: n, champ: stats[n].champ, finalist: stats[n].finalist, points: stats[n].points };
                });
                arr.sort(function(a, b) {
                    if (b.points !== a.points) return b.points - a.points;
                    if (b.champ !== a.champ) return b.champ - a.champ;
                    return b.finalist - a.finalist;
                });

                const pos = arr.findIndex(function(r) { return r.nick === nick; }) + 1;
                if (pos <= 0) return;

                const my = stats[nick];

                const rankEl = document.getElementById('profileRank');
                const textEl = document.getElementById('profileRankText');
                const pointsEl = document.getElementById('profileRankPoints');

                textEl.textContent = '#' + pos;
                pointsEl.textContent = my.points + ' ' + chakChakWord(my.points);

                rankEl.classList.remove('rank-1', 'rank-2', 'rank-3');
                if (pos === 1) rankEl.classList.add('rank-1');
                else if (pos === 2) rankEl.classList.add('rank-2');
                else if (pos === 3) rankEl.classList.add('rank-3');

                rankEl.style.display = 'inline-flex';

            } catch (e) {
                console.error('Ошибка загрузки ранга:', e);
            }
        }
        /* ====================== /РАНГ ====================== */

        /* ======================== СТАТИСТИКА ТУРНИРОВ ======================== */
        async function loadPlayerStats(nick) {
            const statsBlock = document.getElementById('profileStats');
            const statsList = document.getElementById('statsList');
            if (!statsBlock || !statsList || !nick) return;

            try {
                const tournamentsSnap = await get(ref(db, 'playoff/tournaments'));
                const tournaments = tournamentsSnap.val() || {};

                const stats = [];
                const stageOrder = { 'final': 4, 'sf': 3, 'qf': 2, 'ef': 1 };

                for (const tId in tournaments) {
                    const t = tournaments[tId];
                    if (!t || !t.matches) continue;
                    const matches = t.matches;

                    let maxStage = null;
                    let stageLabel = '';
                    let isWinner = false;
                    let isFinalist = false;
                    let prize = null;

                    // 1/8 финала
                    for (const mid in matches) {
                        if (mid.indexOf('ef_') !== 0) continue;
                        const m = matches[mid];
                        const left = m.left || [];
                        const right = m.right || [];
                        if (left.indexOf(nick) !== -1 || right.indexOf(nick) !== -1) {
                            maxStage = 'ef'; stageLabel = '1/8 финала';
                        }
                    }
                    // Четвертьфинал
                    for (const mid in matches) {
                        if (mid.indexOf('qf_') !== 0) continue;
                        const m = matches[mid];
                        const left = m.left || [];
                        const right = m.right || [];
                        if (left.indexOf(nick) !== -1 || right.indexOf(nick) !== -1) {
                            maxStage = 'qf'; stageLabel = 'Четвертьфинал';
                        }
                    }
                    // Полуфинал
                    for (const mid of ['sf_w', 'sf_e']) {
                        const m = matches[mid];
                        if (!m) continue;
                        const left = m.left || [];
                        const right = m.right || [];
                        if (left.indexOf(nick) !== -1 || right.indexOf(nick) !== -1) {
                            maxStage = 'sf'; stageLabel = 'Полуфинал';
                        }
                    }
                    // Финал
                    const finalM = matches['final'];
                    if (finalM) {
                        const left = finalM.left || [];
                        const right = finalM.right || [];
                        if (left.indexOf(nick) !== -1 || right.indexOf(nick) !== -1) {
                            maxStage = 'final';
                            stageLabel = 'Финал';
                            if (finalM.winner) {
                                const winSide = finalM.winner;
                                const loseSide = winSide === 'left' ? 'right' : 'left';
                                const winners = finalM[winSide] || [];
                                const finalists = finalM[loseSide] || [];
                                if (winners.indexOf(nick) !== -1) { isWinner = true; stageLabel = 'Победитель'; }
                                else if (finalists.indexOf(nick) !== -1) { isFinalist = true; stageLabel = 'Финалист'; }
                            }
                        }
                    }

                    // Приз
                    if (finalM && finalM.prizes) {
                        const p = finalM.prizes['win_' + nick] || finalM.prizes['fin_' + nick];
                        if (p && p.name) prize = p;
                    }

                    if (maxStage) {
                        stats.push({
                            tournamentName: t.name || tId,
                            stage: maxStage,
                            stageLabel: stageLabel,
                            isWinner: isWinner,
                            isFinalist: isFinalist,
                            prize: prize
                        });
                    }
                }

                if (stats.length === 0) {
                    statsBlock.style.display = 'none';
                    return;
                }

                stats.sort(function(a, b) { return stageOrder[b.stage] - stageOrder[a.stage]; });

                statsBlock.style.display = 'block';
                statsList.innerHTML = stats.map(function(s) {
                    var stageCls = 'stat-stage';
                    var icon = 'flag';
                    if (s.isWinner) { stageCls += ' winner'; icon = 'emoji_events'; }
                    else if (s.isFinalist) { stageCls += ' finalist'; icon = 'military_tech'; }
                    else if (s.stage === 'final') { icon = 'emoji_events'; }
                    else if (s.stage === 'sf') { icon = 'workspace_premium'; }

                    var prizeHtml = '';
                    if (s.prize) {
                        prizeHtml =
                            '<div class="stat-prize">' +
                                '<img src="' + s.prize.url + '" alt="' + s.prize.name + '">' +
                                '<div>' +
                                    '<div class="stat-prize-label">Приз</div>' +
                                    '<div class="stat-prize-name">' + s.prize.name + '</div>' +
                                '</div>' +
                            '</div>';
                    }

                    return (
                        '<div class="stat-card">' +
                            '<div class="stat-tournament">' + s.tournamentName + '</div>' +
                            '<div class="' + stageCls + '">' +
                                '<span class="material-symbols-outlined">' + icon + '</span>' +
                                s.stageLabel +
                            '</div>' +
                            prizeHtml +
                        '</div>'
                    );
                }).join('');

            } catch (e) {
                console.error('Ошибка загрузки статистики:', e);
                statsBlock.style.display = 'none';
            }
        }
        /* ====================== /СТАТИСТИКА ТУРНИРОВ ====================== */

        var achRef = null;
        var lastAchData = null;
        var targetAchievementsUid = null;

        function initAchievements(uid, admin) {
            targetAchievementsUid = uid;
            achRef = ref(db, 'achievements/' + uid);

            if (admin) {
                document.getElementById('achAdminBtns').style.display = 'flex';
            }

            onValue(achRef, function(snapshot) {
                lastAchData = snapshot.val();
                renderAchievements();
            });

            document.getElementById('achAddBtn').addEventListener('click', function() {
                document.getElementById('achAdminPanel').classList.toggle('visible');
            });
            document.getElementById('achSubmitBtn').addEventListener('click', achAdd);
            document.getElementById('achCancelBtn').addEventListener('click', function() {
                document.getElementById('achAdminPanel').classList.remove('visible');
            });

            document.querySelectorAll('.ach-img-option').forEach(function(img) {
                img.addEventListener('click', function() {
                    achSelectImg(img, img.getAttribute('src'));
                });
            });

            document.addEventListener('click', function(e) {
                if (!e.target.closest('.ach-item')) {
                    document.querySelectorAll('.ach-item').forEach(function(item) { item.classList.remove('active'); });
                }
            });
        }

        function renderAchievements() {
            var loading = document.getElementById('achLoading');
            if (loading) loading.style.display = 'none';

            var grid = document.getElementById('achGrid');
            var empty = document.getElementById('achEmpty');
            var data = lastAchData;

            grid.querySelectorAll('.ach-item').forEach(function(el) { el.remove(); });

            if (!data) {
                if (empty) empty.style.display = 'block';
                return;
            }

            if (empty) empty.style.display = 'none';

            Object.keys(data).forEach(function(key) {
                var item = data[key];
                var div = document.createElement('div');
                div.className = 'ach-item';
                div.addEventListener('click', function() { achToggleTooltip(div); });

                var deleteBtn = '';
                if (isAdmin) {
                    deleteBtn = '<button class="ach-delete-btn" data-key="' + key + '" title="Удалить">&times;</button>';
                }

                div.innerHTML = '<img src="' + item.img + '" alt="">' + deleteBtn +
                    '<div class="ach-tooltip"><span class="ach-title">' + (item.title || '') + '</span>' + (item.desc || '') + '</div>';
                
                var del = div.querySelector('.ach-delete-btn');
                if (del) {
                    del.addEventListener('click', function(e) {
                        e.stopPropagation();
                        achDelete(key);
                    });
                }

                grid.appendChild(div);
            });
        }

        function achToggleTooltip(el) {
            document.querySelectorAll('.ach-item').forEach(function(item) { if (item !== el) item.classList.remove('active'); });
            el.classList.toggle('active');
        }

        function achSelectImg(el, url) {
            document.querySelectorAll('.ach-img-option').forEach(function(opt) { opt.classList.remove('selected'); });
            el.classList.add('selected');
            document.getElementById('achSelectedImg').value = url;
        }

        function achAdd() {
            var img = document.getElementById('achSelectedImg').value;
            var title = document.getElementById('achTitle').value.trim();
            var desc = document.getElementById('achDesc').value.trim();
            if (!img) { alert('Выберите картинку!'); return; }
            if (!title) { alert('Введите название!'); return; }

            var newItemRef = push(achRef);
            set(newItemRef, { img: img, title: title, desc: desc }).then(function() {
                document.getElementById('achTitle').value = '';
                document.getElementById('achDesc').value = '';
                document.getElementById('achSelectedImg').value = '';
                document.querySelectorAll('.ach-img-option').forEach(function(opt) { opt.classList.remove('selected'); });
                document.getElementById('achAdminPanel').classList.remove('visible');
            });
        }

        function achDelete(key) {
            if (!confirm('Удалить?')) return;
            remove(ref(db, 'achievements/' + targetAchievementsUid + '/' + key));
        }
    </script>
