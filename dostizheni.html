<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Достижения</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: transparent; color: #e0e6f0; }
        
        .profile-table-wrapper { max-width: 900px; margin: 0 auto; background: #374151; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); overflow: hidden; }
        .profile-body { padding: 0 24px; }
        .profile-section { padding: 20px 0; }
        .profile-section-name { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .profile-section-name .material-symbols-outlined { font-size: 22px; color: #66c0f4; }
        .profile-section-content { color: #c7d0e0; font-size: 14px; line-height: 1.6; }
        
        .ach-grid { display: flex; flex-wrap: wrap; gap: 12px; }
        .ach-item { position: relative; cursor: pointer; transition: transform 0.2s ease; }
        .ach-item:hover { transform: scale(1.08); }
        .ach-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 10px; border: 2px solid rgba(255,255,255,0.15); display: block; }
        .ach-delete-btn { position: absolute; top: -4px; right: -4px; width: 18px; height: 18px; border-radius: 50%; background: #dc2626; color: #fff; border: none; font-size: 12px; line-height: 18px; text-align: center; cursor: pointer; display: none; z-index: 10; padding: 0; }
        .ach-item:hover .ach-delete-btn { display: block; }
        
        .ach-tooltip { position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%) translateY(8px) scale(0.8); opacity: 0; background: #1a1a2e; color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 13px; line-height: 1.5; max-width: 260px; min-width: 160px; box-shadow: 0 6px 20px rgba(0,0,0,0.6); pointer-events: none; z-index: 100; transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); white-space: normal; text-align: center; }
        .ach-tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 7px solid transparent; border-top-color: #1a1a2e; }
        .ach-item.active .ach-tooltip { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
        .ach-tooltip .ach-title { display: block; font-weight: 700; color: #66c0f4; margin-bottom: 4px; font-size: 14px; }
        .ach-empty { color: #6b7280; font-size: 13px; font-style: italic; }
        .ach-loading { color: #6b7280; font-size: 13px; font-style: italic; text-align: center; padding: 20px; }

        .profile-labels { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
        .profile-label { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: rgba(102,192,244,0.1); border: 1px solid rgba(102,192,244,0.3); color: #66c0f4; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; font-family: 'Inter', sans-serif; text-decoration: none; transition: all 0.2s; }
        .profile-label:hover { background: rgba(102,192,244,0.2); }
        .profile-label .material-symbols-outlined { font-size: 16px; }

        .ach-admin-panel { display: none; margin-top: 16px; padding: 16px; background: rgba(0,0,0,0.3); border-radius: 12px; border: 1px dashed rgba(102,192,244,0.25); }
        .ach-admin-panel.visible { display: block; }
        .ach-admin-panel h4 { margin: 0 0 12px 0; color: #e0e6f0; font-size: 14px; font-weight: 600; }
        .ach-img-picker { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .ach-img-option { width: 56px; height: 56px; border-radius: 8px; border: 3px solid transparent; cursor: pointer; object-fit: cover; transition: all 0.2s; }
        .ach-img-option:hover { border-color: rgba(102,192,244,0.5); transform: scale(1.1); }
        .ach-img-option.selected { border-color: #66c0f4; box-shadow: 0 0 12px rgba(102,192,244,0.4); }
        .ach-admin-input { width: 100%; box-sizing: border-box; padding: 8px 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: rgba(0,0,0,0.3); color: #e0e6f0; font-size: 13px; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s; }
        .ach-admin-input:focus { border-color: #66c0f4; }
    </style>
</head>
<body>

<div class="profile-table-wrapper">
    <div class="profile">
        <div class="profile-body" style="padding: 20px 24px;">
            <div class="profile-section" style="border-top: none;">
                <h3 class="profile-section-name">
                    <span class="material-symbols-outlined">military_tech</span> Достижения
                </h3>
                <div class="profile-section-content">
                    <div class="ach-grid" id="achGrid">
                        <div class="ach-loading" id="achLoading">Загрузка...</div>
                        <div class="ach-empty" id="achEmpty" style="display:none;">Достижений пока нет</div>
                    </div>
                    <div class="profile-labels" id="achAdminBtns" style="display:none;">
                        <a href="javascript:void(0)" class="profile-label" onclick="achToggleAdmin()">
                            <span class="material-symbols-outlined">add_circle</span> Добавить достижение
                        </a>
                    </div>
                    <div class="ach-admin-panel" id="achAdminPanel">
                        <h4>Выберите картинку достижения:</h4>
                        <div class="ach-img-picker" id="achImgPicker">
                            <img class="ach-img-option" src="Screenshot_11.png" onclick="achSelectImg(this, 'Screenshot_11.png')">
                            <img class="ach-img-option" src="Screenshot_12.png" onclick="achSelectImg(this, 'Screenshot_12.png')">
                            <img class="ach-img-option" src="Screenshot_7.png" onclick="achSelectImg(this, 'Screenshot_7.png')">
                            <img class="ach-img-option" src="Screenshot_8.png" onclick="achSelectImg(this, 'Screenshot_8.png')">
                            <img class="ach-img-option" src="kolo11.png" onclick="achSelectImg(this, 'kolo11.png')">
                            <img class="ach-img-option" src="logo1.jpg" onclick="achSelectImg(this, 'logo1.jpg')">
                        </div>
                        <input type="hidden" id="achSelectedImg" value="">
                        <input type="text" class="ach-admin-input" id="achTitle" placeholder="Название достижения">
                        <input type="text" class="ach-admin-input" id="achDesc" placeholder="За что выдано">
                        <div class="profile-labels">
                            <a href="javascript:void(0)" class="profile-label" onclick="achAdd()"><span class="material-symbols-outlined">check</span> Добавить</a>
                            <a href="javascript:void(0)" class="profile-label" onclick="achToggleAdmin()"><span class="material-symbols-outlined">close</span> Отмена</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getDatabase, ref, onValue, push, set, remove } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

    const firebaseConfig = { databaseURL: 'https://ak4ak-8be45-default-rtdb.europe-west1.firebasedatabase.app/' };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const params = new URLSearchParams(window.location.search);
    const uid = params.get('uid') || 'unknown';
    const isAdmin = params.get('admin') === '1';
    var selectedImgUrl = '';

    if (isAdmin) document.getElementById('achAdminBtns').style.display = 'flex';

    const achRef = ref(db, 'achievements/' + uid);

    onValue(achRef, function(snapshot) {
        var loading = document.getElementById('achLoading');
        if (loading) loading.style.display = 'none';

        var grid = document.getElementById('achGrid');
        var empty = document.getElementById('achEmpty');
        var data = snapshot.val();

        grid.querySelectorAll('.ach-item').forEach(function(el) { el.remove(); });

        if (!data) {
            if (empty) empty.style.display = 'block';
            return;
        }

        if (empty) empty.style.display = 'none';

        Object.keys(data).forEach(function(key) {
            var item = data[key];
            var div = document.createElement('div');
            div.className = 'ach-item';
            div.onclick = function() { achToggleTooltip(this); };

            var deleteBtn = '';
            if (isAdmin) {
                deleteBtn = '<button class="ach-delete-btn" onclick="achDelete(\'' + key + '\'); event.stopPropagation();" title="Удалить">&times;</button>';
            }

            div.innerHTML = '<img src="' + item.img + '" alt="">' + deleteBtn +
                '<div class="ach-tooltip"><span class="ach-title">' + (item.title || '') + '</span>' + (item.desc || '') + '</div>';
            grid.appendChild(div);
        });
    });

    window.achToggleTooltip = function(el) {
        document.querySelectorAll('.ach-item').forEach(function(item) { if (item !== el) item.classList.remove('active'); });
        el.classList.toggle('active');
    };

    window.achToggleAdmin = function() { document.getElementById('achAdminPanel').classList.toggle('visible'); };

    window.achSelectImg = function(el, url) {
        selectedImgUrl = url;
        document.querySelectorAll('.ach-img-option').forEach(function(opt) { opt.classList.remove('selected'); });
        el.classList.add('selected');
        document.getElementById('achSelectedImg').value = url;
    };

    window.achAdd = function() {
        var img = document.getElementById('achSelectedImg').value;
        var title = document.getElementById('achTitle').value.trim();
        var desc = document.getElementById('achDesc').value.trim();
        if (!img) { alert('Выберите картинку!'); return; }
        if (!title) { alert('Введите название!'); return; }

        var newItemRef = push(achRef);
        set(newItemRef, { img: img, title: title, desc: desc }).then(function() {
            document.getElementById('achTitle').value = '';
            document.getElementById('achDesc').value = '';
            document.getElementById('achSelectedImg').value = '';
            document.querySelectorAll('.ach-img-option').forEach(function(opt) { opt.classList.remove('selected'); });
            document.getElementById('achAdminPanel').classList.remove('visible');
        });
    };

    window.achDelete = function(key) {
        if (!confirm('Удалить?')) return;
        remove(ref(db, 'achievements/' + uid + '/' + key));
    };

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.ach-item')) {
            document.querySelectorAll('.ach-item').forEach(function(item) { item.classList.remove('active'); });
        }
    });
</script>
</body>
</html>
