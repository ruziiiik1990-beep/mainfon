<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Файлы - 4ak4ak</title>
  <link rel="stylesheet" href="style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Inter', sans-serif;
    }

    .page-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: url('pngg/3kolo.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
      pointer-events: none;
    }
    .page-bg::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.55);
    }

    .files-container {
      max-width: 900px;
      margin: 100px auto 40px auto;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .files-title {
      color: #4a9eff;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
      text-shadow: 0 2px 10px rgba(74, 158, 255, 0.5);
    }

    .download-block {
      background: rgba(10, 42, 107, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(74, 158, 255, 0.5);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    .download-icon {
      font-size: 64px;
      margin-bottom: 20px;
      display: block;
    }

    .download-title {
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    .download-desc {
      color: rgba(255, 255, 255, 0.7);
      font-size: 15px;
      line-height: 1.6;
      max-width: 600px;
      margin: 0 auto 30px auto;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 18px 50px;
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      color: #fff;
      text-decoration: none;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 25px rgba(39, 174, 96, 0.5);
      transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
      cursor: pointer;
    }
    .download-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(39, 174, 96, 0.7);
      background: linear-gradient(135deg, #2ecc71, #27ae60);
    }
    .download-btn:active {
      transform: translateY(-1px);
    }

    .download-note {
      margin-top: 25px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      font-style: italic;
    }

    .download-arrow {
      font-size: 22px;
    }
  </style>
</head>
<body>

  <!-- Фон -->
  <div class="page-bg"></div>

  <!-- Шапка -->
  <div id="header-placeholder" class="header-wrapper"></div>

  <div class="files-container">
    <div class="files-title">Файлы</div>

    <div class="download-block">
      <span class="download-icon">🛡️</span>
      <div class="download-title">Античит для турниров</div>
      <div class="download-desc">
        Скачайте античит <b>ruzikTastyAC</b> для участия в турнирах. 
        Установите его перед началом игры, чтобы подтвердить честность матча.
      </div>

      <a href="pngg/ruzikTastyAC.zip" download class="download-btn">
        <span class="download-arrow">⬇️</span> Скачать Анти-чит
      </a>

      <div class="download-note">
        Файл скачивается напрямую с сайта. Введите его в игру перед матчем.
      </div>
    </div>
  </div>

  <script>
    fetch('header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-placeholder').innerHTML = data;
        const script = document.createElement('script');
        script.type = 'module';
        script.src = 'auth.js';
        document.body.appendChild(script);
      })
      .catch(error => console.error('Ошибка загрузки шапки:', error));
  </script>

</body>
</html>
