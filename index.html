<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4ak4ak</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            pointer-events: none;
        }
        .slider-section {
            margin-top: 100px;
            padding: 20px 0;
            position: relative;
            z-index: 5;
        }
        .slider-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
        }
        .promo-slider {
            width: 100%;
            border-radius: 16px;
        }
        .promo-card {
            position: relative;
            overflow: hidden;
            background: #374151;
            min-height: 520px;
            border-radius: 16px;
        }
        .slide-inner-frame-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .slide-inner-frame-bg iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            border-radius: 16px;
        }
        /* Контентная карточка (текст и кнопка) — поверх iframe */
        .promo-card-inner {
            position: relative;
            z-index: 2;
            height: 100%;
            pointer-events: auto;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 30px;
        }
        .promo-card-content {
            text-align: left;
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            max-width: 60%;
        }
        .promo-card-content h2 {
            color: #fff;
            margin-bottom: 15px;
            font-size: 26px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        .promo-btn {
            display: inline-block;
            padding: 12px 30px;
            background: #e3769c;
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: background 0.3s;
            pointer-events: auto;
        }
        .promo-btn:hover { background: #d05c83; }
        /* Стрелки внутри слайда, внизу у краёв (поверх iframe) */
        .slide-arrow {
            position: absolute;
            bottom: 20px;
            z-index: 20;
            background: rgba(55, 65, 81, 0.8);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            transition: background 0.3s;
        }
        .slide-arrow:hover { background: #e3769c; }
        .slide-arrow svg { width: 24px; height: 24px; fill: currentColor; }
        .slide-arrow-prev { left: 20px; }
        .slide-arrow-next { right: 20px; }
        /* Кнопка Read More справа от таблицы, не дальше 150px от края */
        .promo-btn-right {
            position: absolute;
            right: 150px;
            bottom: 30px;
            z-index: 20;
        }
        @media (max-width: 768px) {
            .promo-card-content { max-width: 100%; }
            .promo-btn-right { position: static; right: auto; bottom: auto; margin-top: 15px; }
            .slide-arrow { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>

    <div id="header-placeholder" class="header-wrapper"></div>

    <div class="slider-section">
        <div class="container slider-container">
            <div class="swiper promo-slider">
                <div class="swiper-wrapper">
                    <!-- СЛАЙД 1: Частицы -->
                    <div class="swiper-slide promo-card">
                        <div class="slide-inner-frame-bg">
                            <iframe src="particles.html"></iframe>
                        </div>
                        <div class="promo-card-inner">
                            <div class="promo-card-content">
                                <h2>Возможность получить скины играя в турнире</h2>
                                <a href="tournaments.html" class="promo-btn">Read More</a>
                            </div>
                        </div>
                        <button class="slide-arrow slide-arrow-prev swiper-btn-prev">
                            <svg><use xlink:href="/.s/t/2301/icons/icons.svg#chevron_left"></use></svg>
                        </button>
                        <button class="slide-arrow slide-arrow-next swiper-btn-next">
                            <svg><use xlink:href="/.s/t/2301/icons/icons.svg#chevron_right"></use></svg>
                        </button>
                    </div>
                    
                    <!-- СЛАЙД 2: Плей-офф (был 3-м) -->
                    <div class="swiper-slide promo-card">
                        <div class="slide-inner-frame-bg">
                            <iframe src="playoff.html"></iframe>
                        </div>
                        <div class="promo-card-inner">
                            <div class="promo-card-content">
                                <h2>за участие получай чак-чак</h2>
                                <a href="tournaments.html" class="promo-btn">Read More</a>
                            </div>
                        </div>
                        <button class="slide-arrow slide-arrow-prev swiper-btn-prev">
                            <svg><use xlink:href="/.s/t/2301/icons/icons.svg#chevron_left"></use></svg>
                        </button>
                        <button class="slide-arrow slide-arrow-next swiper-btn-next">
                            <svg><use xlink:href="/.s/t/2301/icons/icons.svg#chevron_right"></use></svg>
                        </button>
                    </div>
                    
                    <!-- СЛАЙД 3: Таблица (был 2-м) -->
                    <div class="swiper-slide promo-card">
                        <div class="slide-inner-frame-bg">
                            <iframe src="table.html"></iframe>
                        </div>
                        <div class="promo-card-inner">
                            <div class="promo-card-content">
                                <h2>участвуй в турнире</h2>
                            </div>
                        </div>
                        <!-- Кнопка Read More справа от таблицы -->
                        <a href="tournaments.html" class="promo-btn promo-btn-right">Read More</a>
                        <button class="slide-arrow slide-arrow-prev swiper-btn-prev">
                            <svg><use xlink:href="/.s/t/2301/icons/icons.svg#chevron_left"></use></svg>
                        </button>
                        <button class="slide-arrow slide-arrow-next swiper-btn-next">
                            <svg><use xlink:href="/.s/t/2301/icons/icons.svg#chevron_right"></use></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <img src="kolo11.png" class="bg-image" alt="Фон">

    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                const script = document.createElement('script');
                script.type = 'module';
                script.src = 'auth.js';
                document.body.appendChild(script);
            })
            .catch(error => console.error('Ошибка загрузки шапки:', error));
    </script>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new Swiper('.promo-slider', {
                loop: true,
                spaceBetween: 24,
                autoHeight: true,
                navigation: {
                    nextEl: '.swiper-btn-next',
                    prevEl: '.swiper-btn-prev',
                },
            });
        });
    </script>
</body>
</html>
