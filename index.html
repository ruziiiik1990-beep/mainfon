<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4ak4ak</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            /* Убрали height: 100% и overflow: hidden, чтобы появился скролл */
        }
        .background-container {
            width: 100%;
            min-height: 100vh; /* Блок будет растягиваться по содержимому, но не меньше высоты экрана */
            /* Замените имя ниже на имя вашей картинки */
            background-image: url('kolo11.png'); 
            
            /* --- ВОТ ГЛАВНЫЕ ИЗМЕНЕНИЯ ДЛЯ КАРТИНКИ --- */
            background-size: contain; /* Картинка будет вписываться целиком, не обрезаясь */
            background-position: top center; /* Прижимаем картинку к верху по центру */
            background-repeat: no-repeat; /* Картинка не будет повторяться */
            
            /* Если вы хотите, чтобы картинка заполняла ширину экрана, 
               и при этом прокручивалась вниз, используйте эти настройки вместо contain: */
            /* background-size: 100% auto; */
        }
    </style>
</head>
<body>

    <div class="background-container">
        <!-- Здесь пока пусто, но как только вы добавите контент, 
             высота страницы увеличится и ползунок появится -->
    </div>

</body>
</html>
