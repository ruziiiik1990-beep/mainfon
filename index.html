
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4ak4ak</title>
    <!-- Подключаем наши стили из отдельного файла -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Место, куда скрипт вставит шапку из header.html -->
    <div id="header-placeholder" class="header-wrapper"></div>

    <!-- 2. ФОН (картинка) -->
    <img src="kolo11.png" class="bg-image" alt="Фон">

    <!-- 3. Скрипт, который автоматически загружает шапку -->
    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
            })
            .catch(error => console.error('Ошибка загрузки шапки:', error));
    </script>

</body>
</html>
