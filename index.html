<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon/favicon.ico" type="image/x-icon">
<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <title>4ak4ak</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            z-index: 0;
            pointer-events: none;
        }
        .slider-section {
            position: relative;
            z-index: 5;
            margin-top: 100px;
            padding: 20px 0;
        }
        .slider-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
        }
        .promo-slider {
            width: 100%;
            border-radius: 16px;
        }
        .promo-card {
            position: relative;
            overflow: hidden;
            background: #374151;
            min-height: 520px;
            border-radius: 16px;
        }

        /* === Обёртка iframe + голограмма — наклоняется вместе === */
        .slide-inner-frame-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
            transform: rotateX(0deg) rotateY(0deg);
            will-change: transform;
        }
        .slide-inner-frame-bg iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            border-radius: 16px;
            pointer-events: none;   /* мышь проходит сквозь iframe к родителю */
        }

        /* Плавный возврат к центру */
        .holo-card.is-resetting .slide-inner-frame-bg {
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.3, 1);
        }

        .promo-card-inner {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 3;
            padding: 25px;
            pointer-events: none;
        }
        .promo-card-content {
            text-align: left;
            padding: 0;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            border-radius: 0;
            max-width: 450px;
            pointer-events: auto;
        }
        .promo-card-content h2 {
            color: #fff;
            margin-bottom: 15px;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        .promo-btn {
            display: inline-block;
            padding: 12px 30px;
            background: #e3769c;
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .promo-btn:hover { background: #d05c83; }
        .slide-arrow {
            position: absolute;
            bottom: 20px;
            z-index: 20;
            background: rgba(55, 65, 81, 0.9);
            border: 2px solid rgba(255,255,255,0.3);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 32px;
            font-weight: bold;
            line-height: 1;
            transition: background 0.3s, border-color 0.3s;
            padding: 0;
        }
        .slide-arrow:hover { 
            background: #e3769c; 
            border-color: #e3769c;
        }
        .slide-arrow-prev { left: 20px; }
        .slide-arrow-next { right: 20px; }

        /* ====== ГОЛОГРАФИЧЕСКИЙ ФОН + ПЕРЕМЕННЫЕ КУРСОРА ====== */
        :root {
            --metafy: url(https://assets.codepen.io/13471/metafy-repeat.png);
            --grain: url(https://assets.codepen.io/13471/grain.webp);
            --sunpillar-1: hsl(2, 100%, 73%);
            --sunpillar-2: hsl(53, 100%, 69%);
            --sunpillar-3: hsl(93, 100%, 69%);
            --sunpillar-4: hsl(176, 100%, 76%);
            --sunpillar-5: hsl(228, 100%, 74%);
            --sunpillar-6: hsl(283, 100%, 73%);
            --sunpillar-clr-1: var(--sunpillar-1);
            --sunpillar-clr-2: var(--sunpillar-2);
            --sunpillar-clr-3: var(--sunpillar-3);
            --sunpillar-clr-4: var(--sunpillar-4);
            --sunpillar-clr-5: var(--sunpillar-5);
            --sunpillar-clr-6: var(--sunpillar-6);
        }

        .holo-card {
            perspective: 1000px;
            --pointer-x: 50%;
            --pointer-y: 50%;
            --pointer-from-center: 0;
            --pointer-from-top: 0.5;
            --pointer-from-left: 0.5;
            --rotate-x: 0deg;
            --rotate-y: 0deg;
            --background-x: 50%;
            --background-y: 50%;
        }

        .slide-holo {
            position: absolute;
            inset: 0;
            border-radius: 16px;
            overflow: hidden;
            pointer-events: none;
            z-index: 2;
            background-color: #000;
            mix-blend-mode: screen;
        }

        /* shine — переливающиеся полосы, следуют за курсором */
        .slide-holo::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            mask-image: var(--metafy);
            mask-mode: luminance;
            mask-repeat: repeat;
            mask-size: 150%;
            mask-position: top calc(200% - (var(--background-y) * 5)) left calc((100% - var(--background-x)));
            filter: brightness(0.95) contrast(1.6) saturate(0.7);
            animation: holo-bg 18s linear infinite;
            mix-blend-mode: color-dodge;
            background-image:
                repeating-linear-gradient(0deg,
                    var(--sunpillar-clr-1) calc(5% * 1),
                    var(--sunpillar-clr-2) calc(5% * 2),
                    var(--sunpillar-clr-3) calc(5% * 3),
                    var(--sunpillar-clr-4) calc(5% * 4),
                    var(--sunpillar-clr-5) calc(5% * 5),
                    var(--sunpillar-clr-6) calc(5% * 6),
                    var(--sunpillar-clr-1) calc(5% * 7)
                ),
                repeating-linear-gradient(-45deg,
                    #0e152e 0%,
                    hsl(180, 10%, 60%) 3.8%,
                    hsl(180, 29%, 66%) 4.5%,
                    hsl(180, 10%, 60%) 5.2%,
                    #0e152e 10%,
                    #0e152e 12%
                ),
                radial-gradient(
                    farthest-corner circle at var(--pointer-x, 50%) var(--pointer-y, 50%),
                    hsla(0, 0%, 0%, 0.1) 12%,
                    hsla(0, 0%, 0%, 0.15) 20%,
                    hsla(0, 0%, 0%, 0.25) 120%
                );
            background-position: 0% var(--background-y), calc(var(--background-x)) var(--background-y), center center;
            background-blend-mode: color, hard-light;
            background-size: 500% 500%, 300% 300%, 200% 200%;
            background-repeat: repeat;
        }

        /* glare — блик следует за курсором */
        .slide-holo::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background-image: radial-gradient(
                farthest-corner circle at var(--pointer-x, 50%) var(--pointer-y, 50%),
                hsl(248, 25%, 80%) 8%,
                hsla(207, 40%, 30%, 0.8) 90%
            );
            mix-blend-mode: overlay;
            filter: brightness(0.75) contrast(1.25);
            opacity: calc(0.25 + var(--pointer-from-center) * 0.7);
        }

        @keyframes holo-bg {
            0%   { background-position: 0% var(--background-y), 0% 0%, center center; }
            100% { background-position: 0% var(--background-y), 90% 90%, center center; }
        }
        /* ====== /ГОЛОГРАФИЧЕСКИЙ ФОН ====== */

        @media (max-width: 768px) {
            .promo-card-content { max-width: 100%; }
            .promo-card-content h2 { font-size: 18px; }
            .slide-arrow { width: 40px; height: 40px; font-size: 26px; }
            .holo-card { perspective: none; }   /* на мобиле без наклона */
            .slide-inner-frame-bg { transform: none !important; }
        }
    </style>
</head>
<body>

    <div id="header-placeholder" class="header-wrapper"></div>

    <img src="kolo11.png" class="bg-image" alt="Фон">

    <div class="slider-section">
        <div class="container slider-container">
            <div class="swiper promo-slider">
                <div class="swiper-wrapper">
                    <!-- СЛАЙД 1: Частицы → Правила -->
                    <div class="swiper-slide promo-card">
                        <div class="slide-inner-frame-bg">
                            <iframe src="particles.html"></iframe>
                        </div>
                        <div class="promo-card-inner">
                            <div class="promo-card-content">
                                <h2>Возможность получить скины играя в турнире</h2>
                                <a href="https://4ak4ak.pages.dev/rules.html" class="promo-btn">Read More</a>
                            </div>
                        </div>
                        <button class="slide-arrow slide-arrow-prev swiper-btn-prev">&#8249;</button>
                        <button class="slide-arrow slide-arrow-next swiper-btn-next">&#8250;</button>
                    </div>
                    
                    <!-- СЛАЙД 2: Плей-офф → Турниры -->
                    <div class="swiper-slide promo-card">
                        <div class="slide-inner-frame-bg">
                            <iframe src="playoff.html"></iframe>
                        </div>
                        <div class="promo-card-inner">
                            <div class="promo-card-content">
                                <h2>участвуй в турнире</h2>
                                <a href="https://4ak4ak.pages.dev/tournaments.html" class="promo-btn">Read More</a>
                            </div>
                        </div>
                        <button class="slide-arrow slide-arrow-prev swiper-btn-prev">&#8249;</button>
                        <button class="slide-arrow slide-arrow-next swiper-btn-next">&#8250;</button>
                    </div>
                    
                    <!-- СЛАЙД 3: Таблица + голограмма + наклон + курсор -->
                    <div class="swiper-slide promo-card holo-card" id="holoCard">
                        <div class="slide-inner-frame-bg" id="holoInner">
                            <iframe src="table.html"></iframe>
                            <div class="slide-holo"></div>
                        </div>
                        <div class="promo-card-inner">
                            <div class="promo-card-content">
                                <h2>за участие получай чак-чак</h2>
                                <a href="https://4ak4ak.pages.dev/rank.html" class="promo-btn">Read More</a>
                            </div>
                        </div>
                        <button class="slide-arrow slide-arrow-prev swiper-btn-prev">&#8249;</button>
                        <button class="slide-arrow slide-arrow-next swiper-btn-next">&#8250;</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                const script = document.createElement('script');
                script.type = 'module';
                script.src = 'auth.js';
                document.body.appendChild(script);
            })
            .catch(error => console.error('Ошибка загрузки шапки:', error));
    </script>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new Swiper('.promo-slider', {
                loop: true,
                spaceBetween: 24,
                autoHeight: true,
                navigation: {
                    nextEl: '.swiper-btn-next',
                    prevEl: '.swiper-btn-prev',
                },
            });

            // ===== Голографическая карточка: наклон + курсор =====
            const holoCard = document.getElementById('holoCard');
            const holoInner = document.getElementById('holoInner');
            if (!holoCard || !holoInner) return;

            const clamp = (v, min = 0, max = 100) => Math.min(Math.max(v, min), max);
            const round = (v, p = 3) => parseFloat(v.toFixed(p));
            const adjust = (v, fMin, fMax, tMin, tMax) =>
                round(tMin + ((tMax - tMin) * (v - fMin)) / (fMax - fMin));

            holoCard.addEventListener('pointermove', (e) => {
                const rect = holoCard.getBoundingClientRect();
                const px = clamp(((e.clientX - rect.left) / rect.width) * 100);
                const py = clamp(((e.clientY - rect.top) / rect.height) * 100);
                const cx = px - 50;
                const cy = py - 50;
                const fromCenter = clamp(Math.sqrt(cx * cx + cy * cy) / 50, 0, 1);

                holoCard.style.setProperty('--pointer-x', px + '%');
                holoCard.style.setProperty('--pointer-y', py + '%');
                holoCard.style.setProperty('--background-x', adjust(px, 0, 100, 35, 65) + '%');
                holoCard.style.setProperty('--background-y', adjust(py, 0, 100, 35, 65) + '%');
                holoCard.style.setProperty('--pointer-from-center', fromCenter);
                holoCard.style.setProperty('--pointer-from-top', py / 100);
                holoCard.style.setProperty('--pointer-from-left', px / 100);

                const rotX = round(-(cx / 5));
                const rotY = round(cy / 4);
                holoInner.style.transform = `rotateX(${rotY}deg) rotateY(${rotX}deg)`;
            });

            holoCard.addEventListener('pointerleave', () => {
                holoCard.classList.add('is-resetting');
                holoInner.style.transform = 'rotateX(0deg) rotateY(0deg)';
                holoCard.style.setProperty('--pointer-x', '50%');
                holoCard.style.setProperty('--pointer-y', '50%');
                holoCard.style.setProperty('--pointer-from-center', '0');
                holoCard.style.setProperty('--rotate-x', '0deg');
                holoCard.style.setProperty('--rotate-y', '0deg');
                setTimeout(() => holoCard.classList.remove('is-resetting'), 800);
            });
        });
    </script>
</body>
</html>
