<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon/favicon.ico" type="image/x-icon">
<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <title>4ak4ak</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        /* Фон: абсолютный, под слайдером, но страница прокручивается */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            z-index: 0;
            pointer-events: none;
        }

        /* Слайдер поверх фона */
        .slider-section {
            position: relative;
            z-index: 5;
            margin-top: 100px; /* отступ от шапки */
            padding: 20px 0;
        }
        .slider-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
        }
        .promo-slider {
            width: 100%;
            border-radius: 16px;
        }
        .promo-card {
            position: relative;
            overflow: hidden;
            background: #374151;
            min-height: 520px;
            border-radius: 16px;
        }
        .slide-inner-frame-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .slide-inner-frame-bg iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            border-radius: 16px;
        }
        .promo-card-inner {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            padding: 25px;
            pointer-events: none;
        }
        .promo-card-content {
            text-align: left;
            padding: 0;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            border-radius: 0;
            max-width: 450px;
            pointer-events: auto;
        }
        .promo-card-content h2 {
            color: #fff;
            margin-bottom: 15px;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        .promo-btn {
            display: inline-block;
            padding: 12px 30px;
            background: #e3769c;
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .promo-btn:hover { background: #d05c83; }
        .slide-arrow {
            position: absolute;
            bottom: 20px;
            z-index: 20;
            background: rgba(55, 65, 81, 0.9);
            border: 2px solid rgba(255,255,255,0.3);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 32px;
            font-weight: bold;
            line-height: 1;
            transition: background 0.3s, border-color 0.3s;
            padding: 0;
        }
        .slide-arrow:hover { 
            background: #e3769c; 
            border-color: #e3769c;
        }
        .slide-arrow-prev { left: 20px; }
        .slide-arrow-next { right: 20px; }
        @media (max-width: 768px) {
            .promo-card-content { max-width: 100%; }
            .promo-card-content h2 { font-size: 18px; }
            .slide-arrow { width: 40px; height: 40px; font-size: 26px; }
        }
    </style>
</head>
<body>

    <div id="header-placeholder" class="header-wrapper"></div>

    <img src="kolo11.png" class="bg-image" alt="Фон">

    <div class="slider-section">
        <div class="container slider-container">
            <div class="swiper promo-slider">
                <div class="swiper-wrapper">
                    <!-- СЛАЙД 1: Частицы → Правила -->
                    <div class="swiper-slide promo-card">
                        <div class="slide-inner-frame-bg">
                            <iframe src="particles.html"></iframe>
                        </div>
                        <div class="promo-card-inner">
                            <div class="promo-card-content">
                                <h2>Возможность получить скины играя в турнире</h2>
                                <a href="https://4ak4ak.pages.dev/rules.html" class="promo-btn">Read More</a>
                            </div>
                        </div>
                        <button class="slide-arrow slide-arrow-prev swiper-btn-prev">&#8249;</button>
                        <button class="slide-arrow slide-arrow-next swiper-btn-next">&#8250;</button>
                    </div>
                    
                    <!-- СЛАЙД 2: Плей-офф → Турниры -->
                    <div class="swiper-slide promo-card">
                        <div class="slide-inner-frame-bg">
                            <iframe src="playoff.html"></iframe>
                        </div>
                        <div class="promo-card-inner">
                            <div class="promo-card-content">
                                <h2>участвуй в турнире</h2>
                                <a href="https://4ak4ak.pages.dev/tournaments.html" class="promo-btn">Read More</a>
                            </div>
                        </div>
                        <button class="slide-arrow slide-arrow-prev swiper-btn-prev">&#8249;</button>
                        <button class="slide-arrow slide-arrow-next swiper-btn-next">&#8250;</button>
                    </div>
                    
                    <!-- СЛАЙД 3: Таблица → Rank -->
                    <div class="swiper-slide promo-card">
                        <div class="slide-inner-frame-bg">
                            <iframe src="table.html"></iframe>
                        </div>
                        <div class="promo-card-inner">
                            <div class="promo-card-content">
                                <h2>за участие получай чак-чак</h2>
                                <a href="https://4ak4ak.pages.dev/rank.html" class="promo-btn">Read More</a>
                            </div>
                        </div>
                        <button class="slide-arrow slide-arrow-prev swiper-btn-prev">&#8249;</button>
                        <button class="slide-arrow slide-arrow-next swiper-btn-next">&#8250;</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                const script = document.createElement('script');
                script.type = 'module';
                script.src = 'auth.js';
                document.body.appendChild(script);
            })
            .catch(error => console.error('Ошибка загрузки шапки:', error));
    </script>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new Swiper('.promo-slider', {
                loop: true,
                spaceBetween: 24,
                autoHeight: true,
                navigation: {
                    nextEl: '.swiper-btn-next',
                    prevEl: '.swiper-btn-prev',
                },
            });
        });
    </script>
</body>
</html>
