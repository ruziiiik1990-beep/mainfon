<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4ak4ak</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            /* Убрали height: 100% и overflow: hidden, чтобы появился ползунок */
        }
        .background-container {
            width: 100%;
            /* Вместо height: 100% используем min-height, чтобы блок мог расти */
            min-height: 100vh; 
            background-image: url('kolo11.png'); 
            
            /* ВОТ ГЛАВНОЕ: ширина 100% экрана, высота подстраивается (auto) */
            background-size: 100% auto; 
            background-position: top center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>

    <div class="background-container">
        <!-- В будущем сюда вы будете добавлять другие элементы -->
    </div>

</body>
</html>
