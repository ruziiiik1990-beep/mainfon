<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon/favicon.ico" type="image/x-icon">
<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <title>4ak4ak</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            z-index: 0;
            pointer-events: none;
        }
        .slider-section {
            position: relative;
            z-index: 5;
            margin-top: 100px;
            padding: 20px 0;
        }
        .slider-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
        }
        .promo-slider {
            width: 100%;
            border-radius: 16px;
        }
        .promo-card {
            position: relative;
            overflow: hidden;
            background: #374151;
            min-height: 520px;
            border-radius: 16px;
        }
        .slide-inner-frame-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .slide-inner-frame-bg iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            border-radius: 16px;
        }
        .promo-card-inner {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
            padding: 25px;
            pointer-events: none;
        }
        .promo-card-content {
            text-align: left;
            padding: 0;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            border-radius: 0;
            max-width: 450px;
            pointer-events: auto;
        }
        .promo-card-content h2 {
            color: #fff;
            margin-bottom: 15px;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        .promo-btn {
            display: inline-block;
            padding: 12px 30px;
            background: #e3769c;
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .promo-btn:hover { background: #d05c83; }
        .slide-arrow {
            position: absolute;
            bottom: 20px;
            z-index: 30;
            background: rgba(55, 65, 81, 0.9);
            border: 2px solid rgba(255,255,255,0.3);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 32px;
            font-weight: bold;
            line-height: 1;
            transition: background 0.3s, border-color 0.3s;
            padding: 0;
        }
        .slide-arrow:hover { 
            background: #e3769c; 
            border-color: #e3769c;
        }
        .slide-arrow-prev { left: 20px; }
        .slide-arrow-next { right: 20px; }

        /* ====== РЕЙТИНГОВАЯ ТАБЛИЦА (встроена в слайд) ====== */
        .rating-container {
            max-width: 900px;
            margin: 90px auto 20px;
            padding: 20px;
            background: rgba(10, 42, 107, 0.55);
            border: 1px solid rgba(74, 158, 255, 0.45);
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            position: relative;
            isolation: isolate;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* Обёртка для наклона */
        .holo-inner {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
            transform: rotateX(0deg) rotateY(0deg);
            will-change: transform;
        }
        .holo-card.is-resetting .holo-inner {
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.3, 1);
        }

        /* Голографический слой — ПОД содержимым, ПОВЕРХ фона контейнера */
        .rating-holo {
            position: absolute;
            inset: 0;
            border-radius: 14px;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
            background-color: #000;
            mix-blend-mode: screen;
        }

        /* shine — переливающиеся полосы, анимированные + следят за курсором */
        .rating-holo::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background-image:
                repeating-linear-gradient(0deg,
                    var(--sunpillar-1) 0%,
                    var(--sunpillar-2) 5%,
                    var(--sunpillar-3) 10%,
                    var(--sunpillar-4) 15%,
                    var(--sunpillar-5) 20%,
                    var(--sunpillar-6) 25%,
                    var(--sunpillar-1) 30%,
                    var(--sunpillar-2) 35%,
                    var(--sunpillar-3) 40%,
                    var(--sunpillar-4) 45%,
                    var(--sunpillar-5) 50%,
                    var(--sunpillar-6) 55%,
                    var(--sunpillar-1) 60%,
                    var(--sunpillar-2) 65%,
                    var(--sunpillar-3) 70%,
                    var(--sunpillar-4) 75%,
                    var(--sunpillar-5) 80%,
                    var(--sunpillar-6) 85%,
                    var(--sunpillar-1) 90%,
                    var(--sunpillar-2) 95%,
                    var(--sunpillar-3) 100%
                ),
                repeating-linear-gradient(-45deg,
                    #0e152e 0%,
                    hsl(180, 10%, 60%) 3.8%,
                    hsl(180, 29%, 66%) 4.5%,
                    hsl(180, 10%, 60%) 5.2%,
                    #0e152e 10%,
                    #0e152e 12%
                );
            background-size: 500% 500%, 300% 300%;
            background-position: 0% 50%, calc(var(--background-x, 50%)) calc(var(--background-y, 50%));
            background-blend-mode: color, hard-light;
            filter: brightness(0.95) contrast(1.5) saturate(0.65);
            animation: holo-bg 8s linear infinite;
            mix-blend-mode: color-dodge;
            mask-image: linear-gradient(135deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,1) 50%, rgba(0,0,0,0.4) 100%);
            opacity: 0.85;
        }

        /* glare — блик, следует за курсором */
        .rating-holo::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background-image: radial-gradient(
                farthest-corner circle at var(--pointer-x, 50%) var(--pointer-y, 50%),
                hsl(248, 25%, 85%) 10%,
                hsla(207, 40%, 30%, 0.7) 90%
            );
            mix-blend-mode: overlay;
            filter: brightness(0.8) contrast(1.25);
            opacity: calc(0.3 + var(--pointer-from-center, 0) * 0.6);
        }

        @keyframes holo-bg {
            0%   { background-position: 0% 50%, 0% 0%; }
            100% { background-position: 0% 50%, 90% 90%; }
        }

        /* Содержимое таблицы — ПОВЕРХ голограммы */
        .rating-title,
        .rating-scroll,
        .rating-note {
            position: relative;
            z-index: 1;
        }

        .rating-title {
            color: #d6e7ff;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            text-shadow:
                0 1px 3px rgba(0, 0, 0, 1),
                0 0 14px rgba(74, 158, 255, 0.6);
        }

        .rating-scroll {
            max-height: 340px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(74, 158, 255, 0.6) rgba(10, 42, 107, 0.2);
            border-radius: 8px;
        }
        .rating-scroll::-webkit-scrollbar { width: 8px; }
        .rating-scroll::-webkit-scrollbar-track { background: rgba(10, 42, 107, 0.2); border-radius: 4px; }
        .rating-scroll::-webkit-scrollbar-thumb { background: rgba(74, 158, 255, 0.6); border-radius: 4px; }

        .rating-table { width: 100%; border-collapse: collapse; color: #fff; table-layout: fixed; }
        .rating-table th, .rating-table td {
            padding: 0;
            border-bottom: 1px solid rgba(140, 190, 255, 0.22);
            text-align: center;
            vertical-align: middle;
            background: rgba(10, 42, 107, 0.35);
            white-space: nowrap;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 1), 0 0 8px rgba(0, 0, 0, 0.8);
        }
        .cell-content { display: block; padding: 6px 16px; text-align: center; }
        .rating-table th {
            font-weight: 700;
            color: rgba(255, 255, 255, 0.98);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 2;
            background: rgba(10, 42, 107, 0.7);
        }
        .rating-table tbody tr:last-child td { border-bottom: none; }

        .pos-cell { width: 40px; font-weight: 800; font-size: 16px; color: rgba(255, 255, 255, 0.7); }
        .pos-cell.first { color: #ffd700; font-size: 18px; text-shadow: 0 0 12px rgba(255,215,0,0.6), 0 1px 3px #000; }
        .pos-cell.second { color: #e0e0e0; font-size: 17px; text-shadow: 0 0 10px rgba(220,220,220,0.5), 0 1px 3px #000; }
        .pos-cell.third { color: #e0a060; font-size: 16px; text-shadow: 0 0 10px rgba(205,127,50,0.5), 0 1px 3px #000; }

        .name-cell { font-weight: 600; font-size: 15px; }
        .name-cell.first { color: #ffd700; font-weight: 800; text-shadow: 0 0 12px rgba(255,215,0,0.55), 0 1px 3px #000; }
        .name-cell.second { color: #e5e5e5; font-weight: 800; text-shadow: 0 0 10px rgba(220,220,220,0.45), 0 1px 3px #000; }
        .name-cell.third { color: #e0a060; font-weight: 800; text-shadow: 0 0 10px rgba(205,127,50,0.45), 0 1px 3px #000; }
        .name-cell a { color: inherit; text-decoration: none; }
        .name-cell a:hover { text-decoration: underline; text-shadow: 0 0 16px currentColor, 0 1px 3px #000; }

        .champ-cell { width: 90px; font-weight: 700; font-size: 15px; }
        .champ-cell.first { color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5), 0 1px 3px #000; }
        .champ-cell.second { color: #e0e0e0; text-shadow: 0 0 10px rgba(220,220,220,0.4), 0 1px 3px #000; }
        .champ-cell.third { color: #e0a060; text-shadow: 0 0 10px rgba(205,127,50,0.4), 0 1px 3px #000; }

        .finalist-cell { width: 90px; font-weight: 700; font-size: 15px; }
        .finalist-cell.first { color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5), 0 1px 3px #000; }
        .finalist-cell.second { color: #e0e0e0; text-shadow: 0 0 10px rgba(220,220,220,0.4), 0 1px 3px #000; }
        .finalist-cell.third { color: #e0a060; text-shadow: 0 0 10px rgba(205,127,50,0.4), 0 1px 3px #000; }

        .points-cell { width: 110px; font-weight: 700; color: #ffd700; font-size: 18px; text-shadow: 0 0 12px rgba(255,215,0,0.55), 0 1px 3px #000; }
        .points-cell.zero { color: rgba(255, 215, 0, 0.35); font-size: 14px; }

        .rating-empty {
            text-align: center;
            color: rgba(255, 255, 255, 0.55);
            font-size: 14px;
            padding: 24px;
            font-style: italic;
        }

        .rating-note {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            margin-top: 12px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 1);
        }

        @media (max-width: 768px) {
            .promo-card-content { max-width: 100%; }
            .promo-card-content h2 { font-size: 18px; }
            .slide-arrow { width: 40px; height: 40px; font-size: 26px; }
            .rating-container { margin-top: 80px; }
            .holo-card { perspective: none; }
            .holo-inner { transform: none !important; }
        }
    </style>
</head>

    <!-- Объявления CSS-переменных sunpillar (глобально) -->

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new Swiper('.promo-slider', {
                loop: true,
                spaceBetween: 24,
                autoHeight: true,
                navigation: {
                    nextEl: '.swiper-btn-next',
                    prevEl: '.swiper-btn-prev',
                },
            });

            // ===== Наклон таблицы + курсор =====
            const holoCard = document.getElementById('holoCard');
            const holoInner = holoCard ? holoCard.querySelector('.holo-inner') : null;
            if (holoCard && holoInner) {
                const clamp = (v, min = 0, max = 100) => Math.min(Math.max(v, min), max);
                const round = (v, p = 2) => parseFloat(v.toFixed(p));
                const adjust = (v, fMin, fMax, tMin, tMax) =>
                    round(tMin + ((tMax - tMin) * (v - fMin)) / (fMax - fMin));

                holoCard.addEventListener('pointermove', (e) => {
                    const rect = holoCard.getBoundingClientRect();
                    const px = clamp(((e.clientX - rect.left) / rect.width) * 100);
                    const py = clamp(((e.clientY - rect.top) / rect.height) * 100);
                    const cx = px - 50;
                    const cy = py - 50;
                    const fromCenter = clamp(Math.sqrt(cx * cx + cy * cy) / 50, 0, 1);

                    holoCard.style.setProperty('--pointer-x', px + '%');
                    holoCard.style.setProperty('--pointer-y', py + '%');
                    holoCard.style.setProperty('--background-x', adjust(px, 0, 100, 35, 65) + '%');
                    holoCard.style.setProperty('--background-y', adjust(py, 0, 100, 35, 65) + '%');
                    holoCard.style.setProperty('--pointer-from-center', fromCenter);

                    const rotX = round(-(cx / 5));
                    const rotY = round(cy / 4);
                    holoInner.style.transform = `rotateX(${rotY}deg) rotateY(${rotX}deg)`;
                });

                holoCard.addEventListener('pointerleave', () => {
                    holoCard.classList.add('is-resetting');
                    holoInner.style.transform = 'rotateX(0deg) rotateY(0deg)';
                    holoCard.style.setProperty('--pointer-x', '50%');
                    holoCard.style.setProperty('--pointer-y', '50%');
                    holoCard.style.setProperty('--pointer-from-center', '0');
                    setTimeout(() => holoCard.classList.remove('is-resetting'), 800);
                });
            }
        });
    </script>

    <!-- Firebase + логика рейтинга -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script>
        (function() {
            var firebaseConfig = {
                apiKey: "AIzaSyDQMXKc1q4SQYIKlhqzPmB9-h0rCV90Itk",
                authDomain: "ak4ak-8be45.firebaseapp.com",
                databaseURL: "https://ak4ak-8be45-default-rtdb.europe-west1.firebasedatabase.app",
                projectId: "ak4ak-8be45",
                storageBucket: "ak4ak-8be45.appspot.com",
                messagingSenderId: "408070680295",
                appId: "1:408070680295:web:77b9656094e330b803bc42"
            };
            firebase.initializeApp(firebaseConfig);
            var db = firebase.database();

            function escapeHtml(t) {
                if (!t) return '';
                return String(t)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            function renderRating(allResults) {
                var body = document.getElementById('ratingBody');
                if (!body) return;

                var stats = {};
                allResults.forEach(function(finalResult) {
                    if (!finalResult) return;
                    (finalResult.winners || []).forEach(function(nick) {
                        if (!nick) return;
                        if (!stats[nick]) stats[nick] = { champ: 0, finalist: 0, points: 0 };
                        stats[nick].champ++;
                        stats[nick].points += 2;
                    });
                    (finalResult.runnersUp || []).forEach(function(nick) {
                        if (!nick) return;
                        if (!stats[nick]) stats[nick] = { champ: 0, finalist: 0, points: 0 };
                        stats[nick].finalist++;
                        stats[nick].points += 1;
                    });
                });

                if (Object.keys(stats).length === 0) {
                    body.innerHTML = '<tr><td colspan="5" class="rating-empty">Итоги появятся после финала</td></tr>';
                    return;
                }

                var arr = Object.keys(stats).map(function(nick) {
                    return { nick: nick, champ: stats[nick].champ, finalist: stats[nick].finalist, points: stats[nick].points };
                });

                arr.sort(function(a, b) {
                    if (b.points !== a.points) return b.points - a.points;
                    if (b.champ !== a.champ) return b.champ - a.champ;
                    return b.finalist - a.finalist;
                });

                var html = '';
                arr.forEach(function(row, i) {
                    var pos = i + 1;
                    var cls = (pos === 1) ? ' first' : (pos === 2) ? ' second' : (pos === 3) ? ' third' : '';
                    var pointsClass = (row.points === 0) ? ' zero' : '';

                    html += '<tr>'
                        + '<td class="pos-cell' + cls + '"><span class="cell-content">' + pos + '</span></td>'
                        + '<td><span class="cell-content"><span class="name-cell' + cls + '"><a href="profile.html?nick=' + encodeURIComponent(row.nick) + '" target="_top">' + escapeHtml(row.nick) + '</a></span></span></td>'
                        + '<td class="champ-cell"><span class="cell-content"><span class="champ-cell' + cls + '">' + row.champ + '</span></span></td>'
                        + '<td class="finalist-cell"><span class="cell-content"><span class="finalist-cell' + cls + '">' + row.finalist + '</span></span></td>'
                        + '<td class="points-cell"><span class="cell-content"><span class="points-cell' + pointsClass + '">' + row.points + '</span></span></td>'
                        + '</tr>';
                });
                body.innerHTML = html;
            }

            db.ref('playoff/tournaments').on('value', function(snap) {
                var tournaments = snap.val() || {};
                var allResults = [];
                Object.keys(tournaments).forEach(function(tid) {
                    if (tournaments[tid] && tournaments[tid].finalResult) {
                        allResults.push(tournaments[tid].finalResult);
                    }
                });
                renderRating(allResults);
            });
        })();
    </script>
</body>
