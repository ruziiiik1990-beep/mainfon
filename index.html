<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon/favicon.ico" type="image/x-icon">
<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <title>4ak4ak</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* === Глобальные переменные эффекта === */
        :root {
            --sunpillar-1: hsl(2, 100%, 73%);
            --sunpillar-2: hsl(53, 100%, 69%);
            --sunpillar-3: hsl(93, 100%, 69%);
            --sunpillar-4: hsl(176, 100%, 76%);
            --sunpillar-5: hsl(228, 100%, 74%);
            --sunpillar-6: hsl(283, 100%, 73%);
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            z-index: 0;
            pointer-events: none;
        }

        .slider-section {
            position: relative;
            z-index: 5;
            margin-top: 100px;
            padding: 20px 0;
        }
        .slider-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
        }
        .promo-slider {
            width: 100%;
            border-radius: 16px;
        }
        .promo-card {
            position: relative;
            overflow: hidden;
            background: #374151;
            min-height: 520px;
            border-radius: 16px;
        }
        /* Только 3-й слайд получает 3D-перспективу */
        .promo-card.slide-3 {
            perspective: 1200px;
        }
        .slide-inner-frame-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .slide-inner-frame-bg iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            border-radius: 16px;
        }
        .promo-card-inner {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
            padding: 25px;
            pointer-events: none;
        }
        .promo-card-content {
            text-align: left;
            padding: 0;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            border-radius: 0;
            max-width: 450px;
            pointer-events: auto;
        }
        .promo-card-content h2 {
            color: #fff;
            margin-bottom: 15px;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        .promo-btn {
            display: inline-block;
            padding: 12px 30px;
            background: #e3769c;
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .promo-btn:hover { background: #d05c83; }
        .slide-arrow {
            position: absolute;
            bottom: 20px;
            z-index: 30;
            background: rgba(55, 65, 81, 0.9);
            border: 2px solid rgba(255,255,255,0.3);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 32px;
            font-weight: bold;
            line-height: 1;
            transition: background 0.3s, border-color 0.3s;
            padding: 0;
        }
        .slide-arrow:hover { 
            background: #e3769c; 
            border-color: #e3769c;
        }
        .slide-arrow-prev { left: 20px; }
        .slide-arrow-next { right: 20px; }

        /* ====== РЕЙТИНГОВАЯ ТАБЛИЦА С ГОЛОГРАММОЙ И НАКЛОНОМ ====== */
        .rating-container {
            position: relative;
            max-width: 900px;
            margin: 145px auto 80px;
            padding: 15px;
            background: rgba(10, 42, 107, 0.55);
            border: 1px solid rgba(74, 158, 255, 0.45);
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            isolation: isolate;
            transform-style: preserve-3d;
            transform: rotateX(0deg) rotateY(0deg);
            transition: transform 0.15s ease-out;
            will-change: transform;
            --pointer-x: 50%;
            --pointer-y: 50%;
            --pointer-from-center: 0;
            --background-x: 50%;
            --background-y: 50%;
            cursor: pointer;
        }
        .rating-container.is-resetting {
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.3, 1);
        }

        /* Голографический слой — под содержимым */
        .rating-holo {
            position: absolute;
            inset: 0;
            border-radius: 14px;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
            mix-blend-mode: screen;
        }

        /* shine — мелкие переливы sunpillar, фиксированный размер тайла (как в профиле) */
        .rating-holo::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                repeating-linear-gradient(0deg,
                    var(--sunpillar-1) 0%,
                    var(--sunpillar-2) 5%,
                    var(--sunpillar-3) 10%,
                    var(--sunpillar-4) 15%,
                    var(--sunpillar-5) 20%,
                    var(--sunpillar-6) 25%,
                    var(--sunpillar-1) 30%,
                    var(--sunpillar-2) 35%,
                    var(--sunpillar-3) 40%,
                    var(--sunpillar-4) 45%,
                    var(--sunpillar-5) 50%,
                    var(--sunpillar-6) 55%,
                    var(--sunpillar-1) 60%,
                    var(--sunpillar-2) 65%,
                    var(--sunpillar-3) 70%,
                    var(--sunpillar-4) 75%,
                    var(--sunpillar-5) 80%,
                    var(--sunpillar-6) 85%,
                    var(--sunpillar-1) 90%,
                    var(--sunpillar-2) 95%,
                    var(--sunpillar-3) 100%
                ),
                repeating-linear-gradient(-45deg,
                    #0e152e 0%,
                    hsl(180, 10%, 60%) 3.8%,
                    hsl(180, 29%, 66%) 4.5%,
                    hsl(180, 10%, 60%) 5.2%,
                    #0e152e 10%,
                    #0e152e 12%
                );
            background-size: 80px 80px, 200px 200px;   /* ← фиксированный размер, как в профиле */
            background-position: calc(var(--background-x)) var(--background-y), center center;
            background-blend-mode: color, hard-light;
            filter: brightness(0.9) contrast(1.5) saturate(0.65);
            animation: holo-bg 8s linear infinite;
        }

        /* glare — блик за курсором */
        .rating-holo::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(
                farthest-corner circle at var(--pointer-x, 50%) var(--pointer-y, 50%),
                hsl(248, 25%, 90%) 8%,
                hsla(207, 40%, 30%, 0.6) 90%
            );
            mix-blend-mode: overlay;
            filter: brightness(0.85) contrast(1.2);
            opacity: calc(0.3 + var(--pointer-from-center) * 0.6);
        }

        @keyframes holo-bg {
            0%   { background-position: 0% 50%, 0% 0%; }
            100% { background-position: 80px 50%, 90% 90%; }
        }

        /* Контент таблицы — поверх голограммы */
        .rating-title,
        .rating-scroll,
        .rating-note {
            position: relative;
            z-index: 1;
        }

        .rating-title {
            color: #d6e7ff;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            text-shadow:
                0 1px 3px rgba(0, 0, 0, 1),
                0 0 14px rgba(74, 158, 255, 0.6);
        }

        .rating-scroll {
            max-height: 220px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(74, 158, 255, 0.6) rgba(10, 42, 107, 0.2);
            border-radius: 8px;
        }
        .rating-scroll::-webkit-scrollbar { width: 8px; }
        .rating-scroll::-webkit-scrollbar-track { background: rgba(10, 42, 107, 0.2); border-radius: 4px; }
        .rating-scroll::-webkit-scrollbar-thumb { background: rgba(74, 158, 255, 0.6); border-radius: 4px; }

        .rating-table { width: 100%; border-collapse: collapse; color: #fff; table-layout: fixed; }
        .rating-table th, .rating-table td {
            padding: 0;
            border-bottom: 1px solid rgba(140, 190, 255, 0.22);
            text-align: center;
            vertical-align: middle;
            background: rgba(10, 42, 107, 0.35);
            white-space: nowrap;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 1), 0 0 8px rgba(0, 0, 0, 0.8);
        }
        .cell-content { display: block; padding: 6px 16px; text-align: center; }
        .rating-table th {
            font-weight: 700;
            color: rgba(255, 255, 255, 0.98);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 2;
            background: rgba(10, 42, 107, 0.75);
        }
        .rating-table tbody tr:last-child td { border-bottom: none; }

        .pos-cell { width: 40px; font-weight: 800; font-size: 16px; color: rgba(255, 255, 255, 0.7); }
        .pos-cell.first { color: #ffd700; font-size: 18px; text-shadow: 0 0 12px rgba(255,215,0,0.6), 0 1px 3px #000; }
        .pos-cell.second { color: #e0e0e0; font-size: 17px; text-shadow: 0 0 10px rgba(220,220,220,0.5), 0 1px 3px #000; }
        .pos-cell.third { color: #e0a060; font-size: 16px; text-shadow: 0 0 10px rgba(205,127,50,0.5), 0 1px 3px #000; }

        .name-cell { font-weight: 600; font-size: 15px; }
        .name-cell.first { color: #ffd700; font-weight: 800; text-shadow: 0 0 12px rgba(255,215,0,0.55), 0 1px 3px #000; }
        .name-cell.second { color: #e5e5e5; font-weight: 800; text-shadow: 0 0 10px rgba(220,220,220,0.45), 0 1px 3px #000; }
        .name-cell.third { color: #e0a060; font-weight: 800; text-shadow: 0 0 10px rgba(205,127,50,0.45), 0 1px 3px #000; }

        .champ-cell { width: 90px; font-weight: 700; font-size: 15px; }
        .champ-cell.first { color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5), 0 1px 3px #000; }
        .champ-cell.second { color: #e0e0e0; text-shadow: 0 0 10px rgba(220,220,220,0.4), 0 1px 3px #000; }
        .champ-cell.third { color: #e0a060; text-shadow: 0 0 10px rgba(205,127,50,0.4), 0 1px 3px #000; }

        .finalist-cell { width: 90px; font-weight: 700; font-size: 15px; }
        .finalist-cell.first { color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5), 0 1px 3px #000; }
        .finalist-cell.second { color: #e0e0e0; text-shadow: 0 0 10px rgba(220,220,220,0.4), 0 1px 3px #000; }
        .finalist-cell.third { color: #e0a060; text-shadow: 0 0 10px rgba(205,127,50,0.4), 0 1px 3px #000; }

        .points-cell { width: 110px; font-weight: 700; color: #ffd700; font-size: 18px; text-shadow: 0 0 12px rgba(255,215,0,0.55), 0 1px 3px #000; }
        .points-cell.zero { color: rgba(255, 215, 0, 0.35); font-size: 14px; text-shadow: 0 1px 3px #000; }

        .rating-note {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            margin-top: 6px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 1);
        }

        @media (max-width: 768px) {
            .promo-card-content { max-width: 100%; }
            .promo-card-content h2 { font-size: 18px; }
            .slide-arrow { width: 40px; height: 40px; font-size: 26px; }
            .promo-card.slide-3 { perspective: none; }
            .rating-container { transform: none !important; margin: 120px auto 80px; }
        }
    </style>
</head>
<body>

    <div id="header-placeholder" class="header-wrapper"></div>

    <img src="kolo11.png" class="bg-image" alt="Фон">

    <div class="slider-section">
        <div class="container slider-container">

                    <div class="swiper-slide promo-card">

                    <!-- СЛАЙД 3: Турнирная таблица + голограмма + наклон (статика) -->

                        <div class="promo-card-inner">
                            <div class="promo-card-content">

                                <a href="https://4ak4ak.pages.dev/rank.html" class="promo-btn">Read More</a>

                        <div class="rating-container" id="holoCard">

                            <div class="rating-title">Турнирная таблица</div>
                            <div class="rating-scroll">
                                <table class="rating-table">
                                    <thead>

                                        <tr>
                                            <td class="pos-cell"><span class="cell-content">4</span></td>

    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
                const script = document.createElement('script');
                script.type = 'module';
                script.src = 'auth.js';
                document.body.appendChild(script);
            })
            .catch(error => console.error('Ошибка загрузки шапки:', error));
    </script>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new Swiper('.promo-slider', {
                loop: true,
                spaceBetween: 24,
                autoHeight: true,
                navigation: {
                    nextEl: '.swiper-btn-next',
                    prevEl: '.swiper-btn-prev',
                },
            });

            /* ====== Наклон таблицы за курсором + блик ====== */
            const holoCard = document.getElementById('holoCard');
            if (!holoCard) return;

            const clamp = (v, min = 0, max = 100) => Math.min(Math.max(v, min), max);
            const round = (v, p = 2) => parseFloat(v.toFixed(p));
            const adjust = (v, fMin, fMax, tMin, tMax) =>
                round(tMin + ((tMax - tMin) * (v - fMin)) / (fMax - fMin));

            holoCard.addEventListener('pointermove', (e) => {
                holoCard.classList.remove('is-resetting');

                const rect = holoCard.getBoundingClientRect();
                const px = clamp(((e.clientX - rect.left) / rect.width) * 100);
                const py = clamp(((e.clientY - rect.top) / rect.height) * 100);
                const cx = px - 50;
                const cy = py - 50;
                const fromCenter = clamp(Math.sqrt(cx * cx + cy * cy) / 50, 0, 1);

                holoCard.style.setProperty('--pointer-x', px + '%');
                holoCard.style.setProperty('--pointer-y', py + '%');
                holoCard.style.setProperty('--background-x', adjust(px, 0, 100, 35, 65) + '%');
                holoCard.style.setProperty('--background-y', adjust(py, 0, 100, 35, 65) + '%');
                holoCard.style.setProperty('--pointer-from-center', fromCenter);

                const rotX = round(-(cy / 6));
                const rotY = round(cx / 6);
                holoCard.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            });

            holoCard.addEventListener('pointerleave', () => {
                holoCard.classList.add('is-resetting');
                holoCard.style.transform = 'rotateX(0deg) rotateY(0deg)';
                holoCard.style.setProperty('--pointer-x', '50%');
                holoCard.style.setProperty('--pointer-y', '50%');
                holoCard.style.setProperty('--pointer-from-center', '0');
                holoCard.style.setProperty('--background-x', '50%');
                holoCard.style.setProperty('--background-y', '50%');
                setTimeout(() => holoCard.classList.remove('is-resetting'), 800);
            });
        });
    </script>
</body>
</html>
