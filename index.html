<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon/favicon.ico" type="image/x-icon">
<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <title>4ak4ak</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pointer-x: 50%;
            --pointer-y: 50%;
            --pointer-from-center: 0;
            --pointer-from-top: 0.5;
            --pointer-from-left: 0.5;
            --card-opacity: 0;
            --rotate-x: 0deg;
            --rotate-y: 0deg;
            --background-x: 50%;
            --background-y: 50%;
            --card-scale: 1;
            --translate-x: 0px;
            --translate-y: 0px;

            --grain: url(https://assets.codepen.io/13471/grain.webp);
            --metafy: url(https://assets.codepen.io/13471/metafy-repeat.png);
            --sunpillar-1: hsl(2, 100%, 73%);
            --sunpillar-2: hsl(53, 100%, 69%);
            --sunpillar-3: hsl(93, 100%, 69%);
            --sunpillar-4: hsl(176, 100%, 76%);
            --sunpillar-5: hsl(228, 100%, 74%);
            --sunpillar-6: hsl(283, 100%, 73%);
            --sunpillar-clr-1: var(--sunpillar-1);
            --sunpillar-clr-2: var(--sunpillar-2);
            --sunpillar-clr-3: var(--sunpillar-3);
            --sunpillar-clr-4: var(--sunpillar-4);
            --sunpillar-clr-5: var(--sunpillar-5);
            --sunpillar-clr-6: var(--sunpillar-6);

            --card-radius: 6.55% / 4.75%;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            z-index: 0;
            pointer-events: none;
        }
        .slider-section {
            position: relative;
            z-index: 5;
            margin-top: 100px;
            padding: 20px 0;
        }
        .slider-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
        }
        .promo-slider {
            width: 100%;
            border-radius: 16px;
        }
        .promo-card {
            position: relative;
            overflow: hidden;
            background: #374151;
            min-height: 520px;
            border-radius: 16px;
        }
        .slide-inner-frame-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .slide-inner-frame-bg iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            border-radius: 16px;
        }
        .promo-card-inner {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
            padding: 25px;
            pointer-events: none;
        }
        .promo-card-content {
            text-align: left;
            padding: 0;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            border-radius: 0;
            max-width: 450px;
            pointer-events: auto;
        }
        .promo-card-content h2 {
            color: #fff;
            margin-bottom: 15px;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        .promo-btn {
            display: inline-block;
            padding: 12px 30px;
            background: #e3769c;
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .promo-btn:hover { background: #d05c83; }
        .slide-arrow {
            position: absolute;
            bottom: 20px;
            z-index: 30;
            background: rgba(55, 65, 81, 0.9);
            border: 2px solid rgba(255,255,255,0.3);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 32px;
            font-weight: bold;
            line-height: 1;
            transition: background 0.3s, border-color 0.3s;
            padding: 0;
        }
        .slide-arrow:hover { background: #e3769c; border-color: #e3769c; }
        .slide-arrow-prev { left: 20px; }
        .slide-arrow-next { right: 20px; }

        /* ===== СЛАЙД 3 — БЕЗ ДВОЙНОГО PERSPECTIVE, БОЛЬШЕ ОТСТУП СВЕРХУ ===== */
        .promo-card.slide-3 {
            display: grid;
            place-items: center;
            padding: 110px 40px 70px;
            /* perspective: 1000px; — УБРАНО, теперь только на card-wrapper */
        }

        .card-wrapper {
            perspective: 500px;
            transform: translate3d( 0, 0, 0.1px);
            position: relative;
            touch-action: none;
            margin: 0 auto;
            z-index: 15; /* ниже promo-card-inner (20), выше promo-card (0) */
        }
        .card-wrapper::before {
            content: "";
            position: absolute;
            inset: -10px;
            background: inherit;
            background-position: inherit;
            border-radius: inherit;
            transition: all 0.5s ease;
            filter: contrast(2) saturate(2) blur(36px);
            transform: scale(0.8) translate3d(0,0,0.1px);
            background-size: 100% 100%;
            background-position: 0px 0px,0px 0px,50% 50%,0px 0px;
            background-image: radial-gradient(
                farthest-side circle at var(--pointer-x, 50%) var(--pointer-y, 50%),
                hsla(266, 100%, 90%, var(--card-opacity)) 4%,
                hsla(266, 50%, 80%, calc(var(--card-opacity) * 0.75)) 10%,
                hsla(266, 25%, 70%, calc(var(--card-opacity) * 0.5)) 50%,
                hsla(266, 0%, 60%, 0) 100%
            ),
            radial-gradient(35% 52% at 55% 20%, #00FFAAC4 0%, #073AFF00 100%),
            radial-gradient(100% 100% at 50% 50%, #00C1FFFF 1%, #073AFF00 76%),
            conic-gradient(from 124deg at 50% 50%, #C137FFFF 0%, #07C6FFFF 40%, #07C6FFFF 60%, #C137FFFF 100%);
        }
        .card-wrapper:hover,
        .card-wrapper.active {
            --card-opacity: 1;
        }
        .card-wrapper:hover::before,
        .card-wrapper.active::before {
            filter: contrast(1) saturate(2) blur(40px) opacity(1);
            transform: scale(0.9) translate3d(0,0,0.1px);
        }

        #card {
            /* 320 → 300: ещё больше запаса по вертикали */
            height: 300px;
            display: grid;
            aspect-ratio: 2.013; /* 604/300 */
            border-radius: var(--card-radius);
            position: relative;
            transform-style: preserve-3d; /* ← НОВОЕ: 3D-пространство для детей */
            background-blend-mode: color-dodge, normal, normal, normal, normal;
            animation: glow-bg 12s linear infinite;
            box-shadow: rgba(0, 0, 0, 0.8) calc( (var(--pointer-from-left) * 10px) - 3px) calc( (var(--pointer-from-top) * 20px) - 6px) 20px -5px;
            transition: transform 1s ease;
            transform: translate3d( 0, 0, 0.1px) rotateX(0deg) rotateY(0deg);
            background-size: 100% 100%;
            background-position: 0px 0px,0px 0px,50% 50%,0px 0px;
            background-image: radial-gradient(
                farthest-side circle at var(--pointer-x, 50%) var(--pointer-y, 50%),
                hsla(266, 100%, 90%, var(--card-opacity)) 4%,
                hsla(266, 50%, 80%, calc(var(--card-opacity) * 0.75)) 10%,
                hsla(266, 25%, 70%, calc(var(--card-opacity) * 0.5)) 50%,
                hsla(266, 0%, 60%, 0) 100%
            ),
            radial-gradient(35% 52% at 55% 20%, #00FFAAC4 0%, #073AFF00 100%),
            radial-gradient(100% 100% at 50% 50%, #00C1FFFF 1%, #073AFF00 76%),
            conic-gradient(from 124deg at 50% 50%, #C137FFFF 0%, #07C6FFFF 40%, #07C6FFFF 60%, #C137FFFF 100%);
            overflow: hidden;
        }
        #card:hover,
        #card.active {
            transition: none;
            transform: translate3d(0,0,0.1px) rotateX(var(--rotate-y)) rotateY(var(--rotate-x));
        }
        #card * {
            display: grid;
            grid-area: 1/-1;
            border-radius: var(--card-radius);
            transform: translate3d(0px, 0px, 0.1px);
            pointer-events: none;
        }

        #card .inside {
            inset: 1px;
            position: absolute;
            background-image: linear-gradient(145deg, #60496e8c 0%, #71C4FF44 100%);
            background-color: transparent;
            transform: translate3d(0px, 0px, 0.01px);
            border-radius: var(--card-radius);
            overflow: hidden;
            transform-style: preserve-3d; /* ← НОВОЕ */
        }

        .card__shine {
            mask-image: var(--metafy);
            mask-mode: luminance;
            mask-repeat: repeat;
            mask-size: 150%;
            mask-position: top calc(200% - (var(--background-y) * 5)) left calc((100% - var(--background-x)));
            transition: filter .6s ease;
            filter: brightness(.66) contrast(1.33) saturate(.33) opacity(0.5);
            animation: holo-bg 18s linear infinite;
            mix-blend-mode: color-dodge;
        }

        .card__shine,
        .card__shine::after {
            --space: 5%;
            --angle: -45deg;
            display: grid;
            transform: translate3d( 0, 0, 1px);
            overflow: hidden;
            z-index: 3;
            background: transparent;
            background-size: cover;
            background-position: center;
            background-image:
                repeating-linear-gradient( 0deg,
                    var(--sunpillar-clr-1) calc(var(--space)*1),
                    var(--sunpillar-clr-2) calc(var(--space)*2),
                    var(--sunpillar-clr-3) calc(var(--space)*3),
                    var(--sunpillar-clr-4) calc(var(--space)*4),
                    var(--sunpillar-clr-5) calc(var(--space)*5),
                    var(--sunpillar-clr-6) calc(var(--space)*6),
                    var(--sunpillar-clr-1) calc(var(--space)*7)
                ),
                repeating-linear-gradient(
                    var(--angle),
                    #0e152e 0%,
                    hsl(180, 10%, 60%) 3.8%,
                    hsl(180, 29%, 66%) 4.5%,
                    hsl(180, 10%, 60%) 5.2%,
                    #0e152e 10%,
                    #0e152e 12%
                ),
                radial-gradient(
                    farthest-corner circle
                    at var(--pointer-x) var(--pointer-y),
                    hsla(0, 0%, 0%, 0.1) 12%,
                    hsla(0, 0%, 0%, 0.15) 20%,
                    hsla(0, 0%, 0%, 0.25) 120%
                );
            background-position: 0% var(--background-y), calc( var(--background-x) ) var(--background-y), center center;
            background-blend-mode: color, hard-light;
            background-size: 500% 500%, 300% 300%, 200% 200%;
            background-repeat: repeat;
        }

        .card__shine::before,
        .card__shine::after {
            content: "";
            background-position: center;
            background-size: cover;
            grid-area: 1/1;
            opacity: 0;
            pointer-events: none;
        }

        #card:hover .card__shine,
        #card.active .card__shine {
            filter: brightness(.85) contrast(1.5) saturate(.5);
            animation: none;
        }
        #card:hover .card__shine::before,
        #card:hover .card__shine::after,
        #card.active .card__shine::before,
        #card.active .card__shine::after {
            opacity: 1;
        }

        .card__shine::before {
            background-image:
                linear-gradient( 45deg,
                    var(--sunpillar-4),
                    var(--sunpillar-5),
                    var(--sunpillar-6),
                    var(--sunpillar-1),
                    var(--sunpillar-2),
                    var(--sunpillar-3)
                ),
                radial-gradient( circle at var(--pointer-x) var(--pointer-y), hsl(0, 0%, 70%) 0%, hsla(0, 0%, 30%, 20%) 90% ),
                var(--grain);
            background-size: 250% 250%, 100% 100%, 220px 220px;
            background-position: var(--pointer-x) var(--pointer-y), center center, calc(var(--pointer-x) * 0.01) calc(var(--pointer-y) * 0.01);
            background-blend-mode: color-dodge;
            filter: brightness(calc( 2 - var(--pointer-from-center))) contrast(calc( var(--pointer-from-center) + 2 )) saturate(calc( .5 + var(--pointer-from-center) ));
            mix-blend-mode: luminosity;
        }

        .card__shine::after {
            background-position: 0% var(--background-y), calc( (var(--background-x) ) * 0.4) calc( var(--background-y) * 0.5), center center;
            background-size: 200% 300%, 700% 700%, 100% 100%;
            mix-blend-mode: difference;
            filter: brightness(.8) contrast(1.5);
        }

        #card .card__glare {
            transform: translate3d( 0, 0, 1.1px);
            overflow: hidden;
            background-image:
                radial-gradient(
                    farthest-corner circle at var(--pointer-x) var(--pointer-y),
                    hsl(248, 25%, 80%) 12%,
                    hsla(207, 40%, 30%, .8) 90%
                );
            mix-blend-mode: overlay;
            filter: brightness(.8) contrast(1.2);
            z-index: 4;
        }

        /* will-change УБРАН с shine/glare — предотвращает GPU-обрезку при наклоне */

        @keyframes glow-bg {
            0% { --bgrotate: 0deg; }
            100% { --bgrotate: 360deg; }
        }
        @keyframes holo-bg {
            0% { background-position: 0% var(--background-y), 0% 0%, center center; }
            100% { background-position: 0% var(--background-y), 90% 90%, center center; }
        }

        /* ============================================================
           card__content — таблица
           ============================================================ */
        #card .card__content {
            grid-area: 1 / -1;
            display: flex !important;
            flex-direction: column;
            justify-content: space-between;
            gap: 4px;
            padding: 10px 14px;
            border-radius: var(--card-radius);
            pointer-events: none;
            position: relative;
            z-index: 5;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        #card .card__content * {
            display: revert !important;
            grid-area: auto !important;
            border-radius: 0 !important;
            transform: none !important;
            pointer-events: auto;
        }
        #card .card__content table { display: table !important; width: 100%; border-collapse: collapse; table-layout: fixed; }
        #card .card__content thead { display: table-header-group !important; }
        #card .card__content tbody { display: table-row-group !important; }
        #card .card__content tr { display: table-row !important; }
        #card .card__content th,
        #card .card__content td { display: table-cell !important; }

        .rating-title {
            color: #d6e7ff;
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
            text-shadow:
                0 2px 4px rgba(0, 0, 0, 1),
                0 0 15px rgba(74, 158, 255, 0.6);
        }

        .rating-table {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
            table-layout: fixed;
        }
        .rating-table th,
        .rating-table td {
            padding: 0;
            border-bottom: 1px solid rgba(140, 190, 255, 0.25);
            text-align: center;
            vertical-align: middle;
            background: rgba(10, 42, 107, 0.18);
            white-space: nowrap;
            text-shadow:
                0 2px 4px rgba(0, 0, 0, 1),
                0 0 10px rgba(0, 0, 0, 0.9);
        }
        .cell-content { display: block !important; padding: 5px 8px; }
        .rating-table th {
            font-weight: 700;
            color: rgba(255, 255, 255, 0.98);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.8px;
            background: rgba(10, 42, 107, 0.38);
        }
        .rating-table tbody tr:last-child td { border-bottom: none; }

        .pos-cell { width: 34px; font-weight: 800; font-size: 15px; color: rgba(255, 255, 255, 0.75); }
        .pos-cell.first { color: #ffd700; font-size: 17px; text-shadow: 0 0 14px rgba(255,215,0,0.6), 0 2px 4px #000; }
        .pos-cell.second { color: #e0e0e0; font-size: 15px; text-shadow: 0 0 10px rgba(220,220,220,0.5), 0 2px 4px #000; }
        .pos-cell.third { color: #e0a060; font-size: 15px; text-shadow: 0 0 10px rgba(205,127,50,0.5), 0 2px 4px #000; }

        .name-cell { font-weight: 600; font-size: 14px; }
        .name-cell.first { color: #ffd700; font-weight: 800; text-shadow: 0 0 14px rgba(255,215,0,0.55), 0 2px 4px #000; }
        .name-cell.second { color: #e5e5e5; font-weight: 800; text-shadow: 0 0 10px rgba(220,220,220,0.5), 0 2px 4px #000; }
        .name-cell.third { color: #e0a060; font-weight: 800; text-shadow: 0 0 10px rgba(205,127,50,0.5), 0 2px 4px #000; }

        .champ-cell { width: 85px; font-weight: 700; font-size: 14px; }
        .champ-cell.first { color: #ffd700; text-shadow: 0 0 14px rgba(255,215,0,0.55), 0 2px 4px #000; }
        .champ-cell.second { color: #e0e0e0; text-shadow: 0 0 10px rgba(220,220,220,0.5), 0 2px 4px #000; }
        .champ-cell.third { color: #e0a060; text-shadow: 0 0 10px rgba(205,127,50,0.5), 0 2px 4px #000; }

        .finalist-cell { width: 85px; font-weight: 700; font-size: 14px; }
        .finalist-cell.first { color: #ffd700; text-shadow: 0 0 14px rgba(255,215,0,0.55), 0 2px 4px #000; }
        .finalist-cell.second { color: #e0e0e0; text-shadow: 0 0 10px rgba(220,220,220,0.5), 0 2px 4px #000; }
        .finalist-cell.third { color: #e0a060; text-shadow: 0 0 10px rgba(205,127,50,0.5), 0 2px 4px #000; }

        .points-cell { width: 85px; font-weight: 700; color: #ffd700; font-size: 17px; text-shadow: 0 0 14px rgba(255,215,0,0.6), 0 2px 4px #000; }
        .points-cell.zero { color: rgba(255, 215, 0, 0.35); font-size: 14px; text-shadow: 0 2px 4px #000; }

        .rating-note {
            text-align: center;
            color: rgba(255, 255, 255, 0.75);
            font-size: 11px;
            margin-top: 3px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 1);
        }

        @media (max-width: 768px) {
            .promo-card-content { max-width: 100%; }
            .promo-card-content h2 { font-size: 18px; }
            .slide-arrow { width: 40px; height: 40px; font-size: 26px; }
            #card { height: 260px; aspect-ratio: 1.6; }
            .promo-card.slide-3 { padding: 90px 15px 60px; }
            #card .card__content { padding: 8px 8px; }
            .rating-title { font-size: 12px; }
            .rating-table th { font-size: 10px; }
            .cell-content { padding: 4px 5px; }
            .pos-cell { width: 25px; font-size: 11px; }
            .pos-cell.first { font-size: 12px; }
            .pos-cell.second,
            .pos-cell.third { font-size: 11px; }
            .name-cell { font-size: 10px; }
            .champ-cell,
            .finalist-cell { width: 55px; font-size: 10px; }
            .points-cell { width: 55px; font-size: 12px; }
            .points-cell.zero { font-size: 10px; }
            .rating-note { font-size: 9px; }
        }
    </style>
</head>
<body>

    <div id="header-placeholder" class="header-wrapper"></div>

    <img src="kolo11.png" class="bg-image" alt="Фон">

    <div class="slider-section">
        <div class="container slider-container">
            <div class="swiper promo-slider">
                <div class="swiper-wrapper">
                    <div class="swiper-slide promo-card">
                        <div class="slide-inner-frame-bg">
                            <iframe src="particles.html"></iframe>
                        </div>
                        <div class="promo-card-inner">
                            <div class="promo-card-content">
                                <h2>Возможность получить скины играя в турнире</h2>
                                <a href="https://4ak4ak.pages.dev/rules.html" class="promo-btn">Read More</a>
                            </div>
                        </div>
                        <button class="slide-arrow slide-arrow-prev swiper-btn-prev">&#8249;</button>
                        <button class="slide-arrow slide-arrow-next swiper-btn-next">&#8250;</button>
                    </div>
                    
                    <div class="swiper-slide promo-card">
                        <div class="slide-inner-frame-bg">
                            <iframe src="playoff.html"></iframe>
                        </div>
                        <div class="promo-card-inner">
                            <div class="promo-card-content">
                                <h2>участвуй в турнире</h2>
                                <a href="https://4ak4ak.pages.dev/tournaments.html" class="promo-btn">Read More</a>
                            </div>
                        </div>
                        <button class="slide-arrow slide-arrow-prev swiper-btn-prev">&#8249;</button>
                        <button class="slide-arrow slide-arrow-next swiper-btn-next">&#8250;</button>
                    </div>
                    
                    <div class="swiper-slide promo-card slide-3">
                        <div class="promo-card-inner">
                            <div class="promo-card-content">
                                <h2>за участие получай чак-чак</h2>
                                <a href="https://4ak4ak.pages.dev/rank.html" class="promo-btn">Read More</a>
                            </div>
                        </div>

                        <div class="card-wrapper active">
                            <section id="card" class="active">
                                <div class="inside">
                                    <div class="card__shine"></div>
                                    <div class="card__glare"></div>
                                    <div class="card__content">
                                        <div class="rating-title">Турнирная таблица</div>
                                        <table class="rating-table">
                                            <thead>
                                                <tr>
                                                    <th class="pos-cell"><span class="cell-content">#</span></th>
                                                    <th><span class="cell-content">Игрок</span></th>
                                                    <th class="champ-cell"><span class="cell-content">Чемпион</span></th>
                                                    <th class="finalist-cell"><span class="cell-content">Финалист</span></th>
                                                    <th class="points-cell"><span class="cell-content">Чак-чак</span></th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr>
                                                    <td class="pos-cell first"><span class="cell-content">1</span></td>
                                                    <td><span class="cell-content"><span class="name-cell first">s1mple</span></span></td>
                                                    <td class="champ-cell"><span class="cell-content"><span class="champ-cell first">2</span></span></td>
                                                    <td class="finalist-cell"><span class="cell-content"><span class="finalist-cell first">0</span></span></td>

    <!-- ============================================================
         JS — ИСПРАВЛЕНА ПЕТЛЯ ОБРАТНОЙ СВЯЗИ
         Координаты считаются от статичного card-wrapper,
         а не от наклонённого #card
         ============================================================ -->
    <script>
    (function() {
        const $wrap = document.querySelector(".card-wrapper");
        const $card = document.querySelector("#card");
        if (!$wrap || !$card) return;

        const round = (value, precision = 3) => parseFloat(value.toFixed(precision));
        const clamp = (value, min = 0, max = 100) => Math.min(Math.max(value, min), max);
        const adjust = (value, fromMin, fromMax, toMin, toMax) =>
            round(toMin + ((toMax - toMin) * (value - fromMin)) / (fromMax - fromMin));

        let currentPx = 50;
        let currentPy = 50;

        // Единая функция установки значений из процентов
        const setFromPxPy = (px, py) => {
            currentPx = px;
            currentPy = py;

            const cx = px - 50;
            const cy = py - 50;
            const fromCenter = clamp(Math.sqrt(cx * cx + cy * cy) / 50, 0, 1);

            $wrap.style.setProperty('--pointer-x', px + '%');
            $wrap.style.setProperty('--pointer-y', py + '%');
            $wrap.style.setProperty('--background-x', adjust(px, 0, 100, 35, 65) + '%');
            $wrap.style.setProperty('--background-y', adjust(py, 0, 100, 35, 65) + '%');
            $wrap.style.setProperty('--pointer-from-center', fromCenter);
            $wrap.style.setProperty('--pointer-from-top', py / 100);
            $wrap.style.setProperty('--pointer-from-left', px / 100);
            $wrap.style.setProperty('--rotate-x', round(-(cx / 37.5)) + 'deg');
            $wrap.style.setProperty('--rotate-y', round(cy / 30) + 'deg');
        };

        // Из локальных пикселей card-wrapper
        const setFromLocalPx = (localPx, localPy) => {
            const w = $wrap.clientWidth || 1;
            const h = $wrap.clientHeight || 1;
            setFromPxPy(
                clamp((localPx / w) * 100, 0, 100),
                clamp((localPy / h) * 100, 0, 100)
            );
        };

        // Стабильные координаты: bbox card-wrapper НЕ наклоняется
        const cardUpdate = (e) => {
            const rect = $wrap.getBoundingClientRect();
            const localPx = e.clientX - rect.left;
            const localPy = e.clientY - rect.top;
            setFromLocalPx(localPx, localPy);
        };

        function ease(x) {
            return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
        }

        function easedFunc(durationMs, onProgress, onComplete) {
            let startTime = performance.now();
            let canceled = false;

            function loop() {
                if (canceled) return;
                const currentTime = performance.now();
                const progress = (currentTime - startTime) / durationMs;
                const easedProgress = ease(progress);
                onProgress(easedProgress);
                if (progress < 1) {
                    requestAnimationFrame(loop);
                } else {
                    if (onComplete) onComplete();
                }
            }
            loop();

            return { cancel: () => { canceled = true; } };
        }

        const halfW = $wrap.clientWidth / 2;
        const halfH = $wrap.clientHeight / 2;

        let easer;
        $card.addEventListener("pointerenter", () => {
            if (easer) easer.cancel();
        });
        $card.addEventListener("pointermove", cardUpdate);
        $card.addEventListener("pointerout", () => {
            // Плавный возврат от текущей позиции к центру
            const startX = currentPx;
            const startY = currentPy;
            easer = easedFunc(
                800,
                (p) => {
                    setFromPxPy(
                        adjust(p, 0, 1, startX, 50),
                        adjust(p, 0, 1, startY, 50)
                    );
                },
                () => {
                    $card.classList.remove("active");
                    $wrap.classList.remove("active");
                }
            );
        });

        // Стартовая позиция: правый верхний угол (в локальных пикселях)
        setFromLocalPx($wrap.clientWidth - 70, 60);

        // Интро-анимация к центру
        setTimeout(() => {
            easer = easedFunc(
                3000,
                (p) => {
                    setFromLocalPx(
                        adjust(p, 0, 1, $wrap.clientWidth - 70, halfW),
                        adjust(p, 0, 1, 60, halfH)
                    );
                },
                () => {
                    $card.classList.remove("active");
                    $wrap.classList.remove("active");
                }
            );
        }, 1000);
    })();
    </script>
