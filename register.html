<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - 4ak4ak</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
        }
        #header-placeholder {
            width: 100%;
            position: relative;
            z-index: 10;
        }
        .auth-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 100px);
            padding: 40px 20px;
        }
        .auth-box {
            display: flex;
            width: 100%;
            max-width: 900px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            min-height: 500px;
        }
        .auth-form-side { width: 50%; padding: 40px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        .decor { position: absolute; color: #e5e5e5; font-weight: bold; pointer-events: none; }
        .decor.cross { top: 10%; left: 15%; font-size: 30px; }
        .decor.circle { top: 20%; left: 30%; font-size: 40px; color: #fef3c7; }
        .decor.triangle { top: 10%; right: 15%; font-size: 30px; color: #fef3c7; }
        .decor.cross2 { bottom: 20%; left: 10%; font-size: 25px; color: #fef3c7; }
        .decor.circle2 { bottom: 10%; right: 20%; font-size: 35px; }
        .auth-form-container { width: 100%; max-width: 300px; z-index: 2; }
        .auth-form-container h1 { text-align: center; color: #555; font-size: 32px; letter-spacing: 3px; margin-bottom: 30px; font-weight: 400; }
        .input-group { margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 15px; border: 2px solid rgba(227, 118, 156, 0.7); border-radius: 25px; font-size: 16px; outline: none; box-sizing: border-box; transition: border-color 0.3s, box-shadow 0.3s; }
        .input-group input:focus { border-color: #e3769c; box-shadow: 0 0 10px rgba(227, 118, 156, 0.3); }
        .submit-btn { width: 180px; padding: 15px; background-color: #e3769c; color: white; border: none; border-radius: 30px; font-size: 18px; cursor: pointer; display: block; margin: 20px auto; transition: background-color 0.3s, transform 0.2s; box-shadow: 0 5px 15px rgba(227, 118, 156, 0.4); }
        .submit-btn:hover { background-color: #d05c83; transform: translateY(-2px); }
        .switch-page { text-align: center; font-size: 14px; color: #666; }
        .switch-page a { color: #e3769c; font-weight: bold; text-decoration: none; }
        .auth-image-side { width: 50%; background-color: #eef0f3; position: relative; }
        .auth-image-side img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        .error-msg { color: red; font-size: 14px; text-align: center; margin-bottom: 15px; display: none; }
        
        /* Стили для галочки согласия */
        .consent-group {
            margin: 15px 0;
            text-align: left;
            font-size: 12px;
            color: #555;
            line-height: 1.4;
        }
        .consent-group label {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            cursor: pointer;
        }
        .consent-group input[type="checkbox"] {
            margin-top: 3px;
            accent-color: #e3769c;
            width: 16px;
            height: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .consent-group a {
            color: #e3769c;
            text-decoration: none;
            font-weight: 600;
        }
        .consent-group a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) { 
            .auth-box { flex-direction: column; } 
            .auth-form-side { width: 100%; padding: 30px 20px; } 
            .auth-image-side { display: none; } 
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>
    <script>
        fetch('header.html').then(r => r.text()).then(data => {
            document.getElementById('header-placeholder').innerHTML = data;
        });
    </script>

    <div class="auth-wrapper">
        <div class="auth-box">
            <div class="auth-form-side">
                <span class="decor cross">✕</span>
                <span class="decor circle">○</span>
                <span class="decor triangle">△</span>
                <span class="decor cross2">✕</span>
                <span class="decor circle2">○</span>

                <div class="auth-form-container">
                    <h1>РЕГИСТРАЦИЯ</h1>
                    <div id="error-message" class="error-msg"></div>
                    
                    <form id="register-form">
                        <div class="input-group">
                            <input type="text" id="reg-nick" placeholder="Ник" required maxlength="20">
                        </div>
                        <div class="input-group">
                            <input type="email" id="reg-email" placeholder="Email" required>
                        </div>
                        <div class="input-group">
                            <input type="password" id="reg-password" placeholder="Пароль (мин. 6 символов)" required>
                        </div>

                        <!-- Блок согласия -->
                        <div class="consent-group">
                            <label>
                                <input type="checkbox" id="reg-consent" required>
                                <span>
                                    Я даю <a href="consent.html" target="_blank">согласие на обработку персональных данных</a> 
                                    и принимаю <a href="terms.html" target="_blank">пользовательское соглашение</a>
                                </span>
                            </label>
                        </div>

                        <button type="submit" id="reg-btn" class="submit-btn">Создать</button>
                        
                        <p class="switch-page">Уже есть аккаунт? <a href="login.html">Войти</a></p>
                    </form>
                </div>
            </div>

            <div class="auth-image-side">
                <img src="logo1.jpg" alt="4ak4ak">
            </div>
        </div>
    </div>

   <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDQMXKc1q4SQYIKlhqzPmB9-h0rCV90Itk",
        authDomain: "ak4ak-8be45.firebaseapp.com",
        databaseURL: "https://ak4ak-8be45-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "ak4ak-8be45",
        storageBucket: "ak4ak-8be45.appspot.com",
        messagingSenderId: "408070680295",
        appId: "1:408070680295:web:77b9656094e330b803bc42"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nick = document.getElementById('reg-nick').value.trim();
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        const consent = document.getElementById('reg-consent').checked;
        const errorDiv = document.getElementById('error-message');
        const btn = document.getElementById('reg-btn');

        if (!consent) {
            errorDiv.textContent = "Необходимо дать согласие на обработку персональных данных!";
            errorDiv.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Проверка...';
        errorDiv.style.display = 'none';

        // 1. Проверяем, свободен ли ник
        const nickSnap = await get(ref(db, 'usernames/' + nick));
        if (nickSnap.exists()) {
            errorDiv.textContent = "Этот ник уже занят!";
            errorDiv.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Создать';
            return;
        }

        btn.textContent = 'Создание...';

        // 2. Создаём пользователя и записываем всё в базу
        createUserWithEmailAndPassword(auth, email, password)
            .then((userCredential) => {
                const user = userCredential.user;
                return set(ref(db, 'users/' + user.uid), {
                    email: email,
                    nick: nick,
                    createdAt: Date.now()
                }).then(() => {
                    return set(ref(db, 'usernames/' + nick), user.uid);
                });
            })
            .then(() => {
                window.location.href = "profile.html";
            })
            .catch((error) => {
                errorDiv.textContent = "Ошибка: " + error.message;
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Создать';
            });
    });
</script>
</body>
</html>
