<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - 4ak4ak</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Копируем стили из login.html для единообразия */
        .auth-container {
            max-width: 400px;
            margin: 150px auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
            z-index: 20;
        }
        .auth-container h2 { margin-bottom: 20px; text-align: center; color: #333; }
        .auth-container input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .auth-container button {
            width: 100%;
            padding: 12px;
            background-color: #28a745; /* Зеленая кнопка для регистрации */
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }
        .auth-container button:hover { background-color: #218838; }
        .auth-link { display: block; text-align: center; margin-top: 15px; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

    <div id="header-placeholder" class="header-wrapper"></div>
    <img src="kolo11.png" class="bg-image" alt="Фон" style="position: fixed; z-index: -1;">

    <div class="auth-container">
        <h2>Регистрация</h2>
        <form action="#" method="POST" onsubmit="alert('Регистрация пока не работает (нужна база данных)'); return false;">
            <input type="text" name="login" placeholder="Придумайте логин" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit">Создать аккаунт</button>
        </form>
        <a href="login.html" class="auth-link">Уже есть аккаунт? Войти</a>
    </div>

    <script>
        fetch('header.html').then(r => r.text()).then(data => {
            document.getElementById('header-placeholder').innerHTML = data;
        });
    </script>
</body>
</html>
