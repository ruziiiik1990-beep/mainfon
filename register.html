<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - 4ak4ak</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container { max-width: 400px; margin: 150px auto; background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); position: relative; z-index: 20; }
        .auth-container h2 { margin-bottom: 20px; text-align: center; color: #333; }
        .auth-container input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        .auth-container button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; }
        .auth-container button:hover { background-color: #218838; }
        .auth-link { display: block; text-align: center; margin-top: 15px; color: #007bff; text-decoration: none; }
        .error-msg { color: red; text-align: center; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

    <div id="header-placeholder" class="header-wrapper"></div>
    <img src="kolo11.png" class="bg-image" alt="Фон" style="position: fixed; z-index: -1;">

    <div class="auth-container">
        <h2>Регистрация</h2>
        <div id="error-message" class="error-msg"></div>
        <form id="register-form">
            <input type="email" id="reg-email" placeholder="Email" required>
            <input type="password" id="reg-password" placeholder="Пароль (минимум 6 символов)" required>
            <button type="submit" id="reg-btn">Создать аккаунт</button>
        </form>
        <a href="login.html" class="auth-link">Уже есть аккаунт? Войти</a>
    </div>

    <!-- Подключаем Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDQMXKc1q4SQYIKlhqzPmB9-h0rCV90Itk",
            authDomain: "ak4ak-8be45.firebaseapp.com",
            databaseURL: "https://ak4ak-8be45-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "ak4ak-8be45",
            storageBucket: "ak4ak-8be45.appspot.com",
            messagingSenderId: "408070680295",
            appId: "1:408070680295:web:77b9656094e330b803bc42"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const errorDiv = document.getElementById('error-message');
            const btn = document.getElementById('reg-btn');

            btn.disabled = true;
            btn.textContent = 'Создание...';
            errorDiv.style.display = 'none';

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Успешная регистрация
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    errorDiv.textContent = "Ошибка: " + error.message;
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Создать аккаунт';
                });
        });
    </script>

    <script>
        fetch('header.html').then(r => r.text()).then(data => {
            document.getElementById('header-placeholder').innerHTML = data;
        });
    </script>
</body>
</html>
