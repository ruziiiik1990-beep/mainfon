<!-- Треугольное «одеяло» с подсветкой мыши -->
<script>
(function() {
  const canvas = document.getElementById('triangleCanvas');
  const ctx = canvas.getContext('2d');
  let width, height;
  let triangles = [];
  let mouseX = -1000, mouseY = -1000;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    generateTriangles();
  }

  function generateTriangles() {
    triangles = [];
    const spacing = 110;
    const cols = Math.ceil(width / spacing) + 1;
    const rows = Math.ceil(height / spacing) + 1;
    const points = [];

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const offsetX = (y % 2) * (spacing / 2);
        const px = x * spacing + offsetX + (Math.random() - 0.5) * 18;
        const py = y * spacing + (Math.random() - 0.5) * 18;
        points.push({ x: px, y: py });
      }
    }

    for (let y = 0; y < rows - 1; y++) {
      for (let x = 0; x < cols - 1; x++) {
        const i1 = y * cols + x;
        const i2 = y * cols + x + 1;
        const i3 = (y + 1) * cols + x;
        const i4 = (y + 1) * cols + x + 1;
        if (points[i1] && points[i2] && points[i3]) triangles.push([points[i1], points[i2], points[i3]]);
        if (points[i2] && points[i3] && points[i4]) triangles.push([points[i2], points[i3], points[i4]]);
      }
    }
  }

  function pointInTriangle(px, py, t) {
    const [a, b, c] = t;
    const d1 = (px - b.x) * (a.y - b.y) - (a.x - b.x) * (py - b.y);
    const d2 = (px - c.x) * (b.y - c.y) - (b.x - c.x) * (py - c.y);
    const d3 = (px - a.x) * (c.y - a.y) - (c.x - a.x) * (py - a.y);
    const hasNeg = (d1 < 0) || (d2 < 0) || (d3 < 0);
    const hasPos = (d1 > 0) || (d2 > 0) || (d3 > 0);
    return !(hasNeg && hasPos);
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);

    triangles.forEach(t => {
      const isHovered = pointInTriangle(mouseX, mouseY, t);

      ctx.beginPath();
      ctx.moveTo(t[0].x, t[0].y);
      ctx.lineTo(t[1].x, t[1].y);
      ctx.lineTo(t[2].x, t[2].y);
      ctx.closePath();

      if (isHovered) {
        ctx.fillStyle = 'rgba(255, 215, 0, 0.35)';
        ctx.strokeStyle = 'rgba(255, 215, 0, 0.9)';
        ctx.lineWidth = 2;
      } else {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 1;
      }

      ctx.fill();
      ctx.stroke();
    });

    requestAnimationFrame(draw);
  }

  window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });
  window.addEventListener('resize', resize);
  window.addEventListener('mouseleave', () => { mouseX = -1000; mouseY = -1000; });

  resize();
  draw();
})();
</script>
