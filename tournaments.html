<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Турнир - 4ak4ak</title>
<link rel="stylesheet" href="style.css">
<style>
body {
  margin: 0;
  padding: 0;
  background: transparent;
  font-family: 'Inter', sans-serif;
}

/* Фон страницы */
.page-bg {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-image: url('png/dust2B.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  z-index: -1;
  pointer-events: none;
}
.page-bg::after {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.5);
}

/* Отступ от шапки */
.page-content { margin-top: 100px; }

/* Блок «правила [картинка] турнира» — прижат вправо */
.archive-block {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  margin: 20px auto;
  padding: 0 40px;
  flex-wrap: wrap;
}
.archive-title-part {
  font-family: 'Buran USSR', sans-serif;
  font-size: 28px;
  color: #ffffff;
  text-transform: uppercase;
  letter-spacing: 2px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.6);
  font-weight: 700;
}
.archive-icon-wrapper a {
  display: block;
}
.archive-icon-wrapper img {
  height: 168px;
  width: auto;
  max-width: 400px;
  cursor: pointer;
  transition: transform 0.3s ease;
}
.archive-icon-wrapper img:hover {
  transform: scale(1.05);
}
</style>
</head>
<body>

<!-- Фон -->
<div class="page-bg"></div>

<!-- Шапка -->
<div id="header-placeholder" class="header-wrapper"></div>

<div class="page-content">

  <!-- Блок: «правила [картинка] турнира» — справа -->
  <div class="archive-block">
    <span class="archive-title-part">правила</span>
    <div class="archive-icon-wrapper">
      <a href="rules.html" title="Правила турнира">
        <img src="png/wepon1bez.png" alt="Правила турнира">
      </a>
    </div>
    <span class="archive-title-part">турнира</span>
  </div>

</div>

<script>
fetch('header.html')
  .then(response => response.text())
  .then(data => {
    document.getElementById('header-placeholder').innerHTML = data;
    const script = document.createElement('script');
    script.type = 'module';
    script.src = 'auth.js';
    document.body.appendChild(script);
  })
  .catch(error => console.error('Ошибка загрузки шапки:', error));
</script>

</body>
</html>
