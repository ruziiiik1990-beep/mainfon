<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon/favicon.ico" type="image/x-icon">
<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
<title>Турнир - 4ak4ak</title>
<link rel="stylesheet" href="style.css">
<style>
body {
  margin: 0;
  padding: 0;
  background: transparent;
  font-family: 'Inter', sans-serif;
}

/* Фон страницы */
.page-bg {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-image: url('png/dust2B.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  z-index: -1;
  pointer-events: none;
}
.page-bg::after {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.5);
}

/* Отступ от шапки */
.page-content { margin-top: 100px; }

/* Блок «правила [картинка] турнира» — прижат вправо */
.archive-block {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  margin: 20px auto;
  padding: 0 40px;
  flex-wrap: wrap;
}
.archive-title-part {
  font-family: 'Buran USSR', sans-serif;
  font-size: 28px;
  color: #ffffff;
  text-transform: uppercase;
  letter-spacing: 2px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.6);
  font-weight: 700;
}
.archive-icon-wrapper a {
  display: block;
}
.archive-icon-wrapper img {
  height: 168px;
  width: auto;
  max-width: 400px;
  cursor: pointer;
  transition: transform 0.3s ease;
}
.archive-icon-wrapper img:hover {
  transform: scale(1.05);
}

.tournament-frame {
  display: block;
  width: 100%;
  max-width: none;
  height: 2200px;
  border: none;
  margin: 20px 0;
  border-radius: 12px;
}
</style>
</head>
<body>

<!-- Фон -->
<div class="page-bg"></div>

<!-- Шапка -->
<div id="header-placeholder" class="header-wrapper"></div>

<div class="page-content">

  <!-- Блок: «правила [картинка] турнира» — справа -->
  <div class="archive-block">
    <span class="archive-title-part">правила</span>
    <div class="archive-icon-wrapper">
      <a href="rules.html" title="Правила турнира">
        <img src="png/wepon1bez.png" alt="Правила турнира">
      </a>
    </div>
    <span class="archive-title-part">турнира</span>
  </div>

  <!-- Турнирная сетка в iframe -->
  <iframe src="tournament-bracket.html" class="tournament-frame" id="tournamentFrame"></iframe>

</div>

<script>
fetch('header.html')
  .then(response => response.text())
  .then(data => {
    document.getElementById('header-placeholder').innerHTML = data;
    const script = document.createElement('script');
    script.type = 'module';
    script.src = 'auth.js';
    document.body.appendChild(script);
  })
  .catch(error => console.error('Ошибка загрузки шапки:', error));
</script>

<!-- Подставляем uid в iframe турнирной сетки -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDQMXKc1q4SQYIKlhqzPmB9-h0rCV90Itk",
  authDomain: "ak4ak-8be45.firebaseapp.com",
  projectId: "ak4ak-8be45",
  storageBucket: "ak4ak-8be45.appspot.com",
  messagingSenderId: "408070680295",
  appId: "1:408070680295:web:77b9656094e330b803bc42"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById('tournamentFrame').src = 'tournament-bracket.html?uid=' + user.uid;
  }
});
</script>
<script>
window.addEventListener('message', function(event) {
  if (event.data && event.data.type === 'resize' && event.data.frame === 'tournament') {
    var frame = document.getElementById('tournamentFrame');
    if (frame && event.data.height) {
      frame.style.height = event.data.height + 'px';
    }
  }
});
</script>
</body>
</html>
