<script>
/* ==========================================
Z-INDEX ПРАВОЙ СТОПКИ (страницы НЕ перевёрнуты)
Сверху обложка p0, ниже p1, p2, p2b, p3, p4, p5, задняя обложка(1)
========================================== */
var zRight = {
'0':  8,
'1':  7,
'2':  6,
'2b': 5,
'3':  4,
'4':  3,
'5':  2
};

/* ==========================================
Z-INDEX ЛЕВОЙ СТОПКИ (страницы перевёрнуты)
Чем позже перевернули — тем выше.
Все выше задней обложки (у неё z-index: 1)
========================================== */
var zLeft = {
'0':  2,
'1':  3,
'2':  4,
'2b': 5,
'3':  6,
'4':  7,
'5':  8
};

function turnPage(pageId, direction) {
pageId = String(pageId);
const page = document.getElementById('p' + pageId);
if (!page) return;

if (direction === 'next') {
page.classList.add('flipped');
// Уводим в ЛЕВУЮ стопку, а не оставляем наверху правой
setTimeout(() => { page.style.zIndex = zLeft[pageId]; }, 300);
if (pageId === '0') {
document.getElementById('backToStartBtn').style.display = 'inline-block';
}
} else if (direction === 'prev') {
// На время анимации поднимаем над всеми
page.style.zIndex = 100;
setTimeout(() => { page.classList.remove('flipped'); }, 10);
// Возвращаем в ПРАВУЮ стопку
setTimeout(() => { page.style.zIndex = zRight[pageId]; }, 800);
}
}

function closeBook() {
['1', '2', '2b', '3', '4', '5'].forEach(id => {
const page = document.getElementById('p' + id);
if (page) {
page.classList.remove('flipped');
page.style.zIndex = zRight[id];
}
});
const p0 = document.getElementById('p0');
setTimeout(() => {
p0.classList.remove('flipped');
p0.style.zIndex = zRight['0'];
}, 100);
document.getElementById('backToStartBtn').style.display = 'none';
}
</script>
