html, body {
margin: 0;
padding: 0;
background: transparent !important;
background-color: transparent !important;
overflow-y: auto;
overflow-x: hidden;
}
#tubes-canvas {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
z-index: 5;
pointer-events: none;
background-color: #000000 !important;
mix-blend-mode: screen;
}
.rules-bg {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;

background-size: cover;
background-position: center;
background-repeat: no-repeat;
z-index: -1;
pointer-events: none;
}
.rules-bg::after {
content: '';
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.4);
}
.header-wrapper {
position: relative;
z-index: 10;
}

}
.book-wrapper {
position: relative;
width: 380px;
height: 520px;
transform-style: preserve-3d;
transform: rotateX(15deg) rotateY(-5deg);
}
.b-page {
position: absolute;
width: 100%;
height: 100%;
top: 0;
left: 0;
transform-origin: left center;
transform-style: preserve-3d;
transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
box-shadow: 0 4px 20px rgba(0,0,0,0.4);

.page-side {

height: 100%;

left: 0;

}
.back-side {

background: #fcf8f2;
border-radius: 12px 4px 4px 12px;
border: 1px solid #e8dec9;
}
