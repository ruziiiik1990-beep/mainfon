<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
html, body {
margin: 0;
padding: 0;
background: transparent;
font-family: 'Inter', sans-serif;
overflow-y: auto;
overflow-x: hidden;
}
.bg-image {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: auto;
z-index: 0;
pointer-events: none;
}
.header-wrapper {
position: relative;
z-index: 10;
}

.page-wrapper {
position: relative;
min-height: 100vh;
width: 100%;
}

/* ====== НАКЛЕЙКА (без изменений) ====== */
.holo-sticker {
position: absolute;
left: 60px;
top: 50%;
transform: translateY(-50%);
width: 180px;
height: 180px;
z-index: 5;
filter: drop-shadow(0 0 25px rgba(74, 158, 255, 0.5));
animation: sticker-float 4s ease-in-out infinite;
pointer-events: auto; /* включаем клики */
cursor: pointer;
}
@keyframes sticker-float {
0%, 100% { transform: translateY(-50%) scale(1); }
50% { transform: translateY(-55%) scale(1.03); }
}
.holo-sticker svg {
width: 100%;
height: 100%;
display: block;
}
.color0 { fill: none; }
.color1 { fill: #8EABE5; }
.color2 { fill: #BCACF3; }
.color3 { fill: #FAA9B2; }
.color4 { fill: #F8FCA8; }
.color5 { fill: #B5DFC8; }
.circle { fill: url(#multi-dots); }

@media (max-width: 1100px) {
.holo-sticker { left: 30px; width: 140px; height: 140px; }
}
@media (max-width: 850px) {
.holo-sticker { left: 20px; width: 120px; height: 120px; }
}

/* ====== ПЕРЕМЕННЫЕ ГОЛОГРАММЫ ====== */
:root {
--metafy: url(https://assets.codepen.io/13471/metafy-repeat.png);
--grain: url(https://assets.codepen.io/13471/grain.webp);
--sunpillar-1: hsl(2, 100%, 73%);
--sunpillar-2: hsl(53, 100%, 69%);
--sunpillar-3: hsl(93, 100%, 69%);
--sunpillar-4: hsl(176, 100%, 76%);
--sunpillar-5: hsl(228, 100%, 74%);
--sunpillar-6: hsl(283, 100%, 73%);
--sunpillar-clr-1: var(--sunpillar-1);
--sunpillar-clr-2: var(--sunpillar-2);
--sunpillar-clr-3: var(--sunpillar-3);
--sunpillar-clr-4: var(--sunpillar-4);
--sunpillar-clr-5: var(--sunpillar-5);
--sunpillar-clr-6: var(--sunpillar-6);
--background-x: 50%;
--background-y: 50%;
}

/* ====== ТАБЛИЦА (без изменений) ====== */
.rating-container {
max-width: 650px;
margin: 40px auto 40px auto;
padding: 20px;
background: rgba(10, 42, 107, 0.55);
border: 1px solid rgba(74, 158, 255, 0.45);
border-radius: 14px;
box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
position: relative;
z-index: 5;
isolation: isolate;
overflow: hidden;
}
.rating-holo {
position: absolute;
inset: 0;
border-radius: inherit;
overflow: hidden;
pointer-events: none;
z-index: 0;
}
.rating-holo::before {
content: "";
position: absolute;
inset: 0;
border-radius: inherit;
mask-image: var(--metafy);
mask-mode: luminance;
mask-repeat: repeat;
mask-size: 150%;
mask-position: top calc(200% - (var(--background-y) * 5)) left calc((100% - var(--background-x)));
filter: brightness(0.85) contrast(1.5) saturate(0.5);
animation: holo-bg 18s linear infinite;
mix-blend-mode: color-dodge;
background-image:
repeating-linear-gradient(0deg,
var(--sunpillar-clr-1) calc(5% * 1),
var(--sunpillar-clr-2) calc(5% * 2),
var(--sunpillar-clr-3) calc(5% * 3),
var(--sunpillar-clr-4) calc(5% * 4),
var(--sunpillar-clr-5) calc(5% * 5),
var(--sunpillar-clr-6) calc(5% * 6),
var(--sunpillar-clr-1) calc(5% * 7)
),
repeating-linear-gradient(-45deg,
#0e152e 0%,
hsl(180, 10%, 60%) 3.8%,
hsl(180, 29%, 66%) 4.5%,
hsl(180, 10%, 60%) 5.2%,
#0e152e 10%,
#0e152e 12%
),
radial-gradient(
farthest-corner circle at 50% 50%,
hsla(0, 0%, 0%, 0.1) 12%,
hsla(0, 0%, 0%, 0.15) 20%,
hsla(0, 0%, 0%, 0.25) 120%
);
background-position: 0% var(--background-y), 50% var(--background-y), center center;
background-blend-mode: color, hard-light;
background-size: 500% 500%, 300% 300%, 200% 200%;
background-repeat: repeat;
}
.rating-holo::after {
content: "";
position: absolute;
inset: 0;
border-radius: inherit;
background-image: radial-gradient(
farthest-corner circle at 50% 30%,
hsl(248, 25%, 80%) 5%,
hsla(207, 40%, 30%, 0.8) 90%
);
mix-blend-mode: overlay;
filter: brightness(0.7) contrast(1.2);
opacity: 0.55;
}
@keyframes holo-bg {
0%   { background-position: 0% var(--background-y), 0% 0%, center center; }
100% { background-position: 0% var(--background-y), 90% 90%, center center; }
}
.rating-title,
.rating-scroll,
.rating-note,
.btn-reset {
position: relative;
z-index: 1;
}
.rating-title {
color: #4a9eff;
font-size: 20px;
font-weight: 700;
margin-bottom: 16px;
text-transform: uppercase;
letter-spacing: 1px;
text-align: center;
text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8), 0 0 12px rgba(74, 158, 255, 0.35);
}
.rating-table-wrapper { display: flex; justify-content: center; margin: 0 auto; }
.rating-scroll {
max-height: 400px;
overflow-y: auto;
scrollbar-width: thin;
scrollbar-color: rgba(74, 158, 255, 0.5) rgba(10, 42, 107, 0.3);
border-radius: 8px;
}
.rating-scroll::-webkit-scrollbar { width: 8px; }
.rating-scroll::-webkit-scrollbar-track { background: rgba(10, 42, 107, 0.3); border-radius: 4px; }
.rating-scroll::-webkit-scrollbar-thumb { background: rgba(74, 158, 255, 0.5); border-radius: 4px; }
.rating-scroll::-webkit-scrollbar-thumb:hover { background: rgba(74, 158, 255, 0.7); }
.rating-table { width: 100%; border-collapse: collapse; color: #fff; table-layout: fixed; }
.rating-table th, .rating-table td {
padding: 0;
border-bottom: 1px solid rgba(255, 255, 255, 0.12);
text-align: center;
vertical-align: middle;
background: rgba(10, 42, 107, 0.65);
white-space: nowrap;
}
.cell-content { display: block; padding: 6px 16px; text-align: center; }
.rating-table th {
font-weight: 700;
color: rgba(255, 255, 255, 0.95);
text-transform: uppercase;
font-size: 12px;
letter-spacing: 0.5px;
position: sticky;
top: 0;
z-index: 2;
}
.rating-table tbody tr:last-child td { border-bottom: none; }
.pos-cell { width: 40px; font-weight: 800; font-size: 16px; color: rgba(255, 255, 255, 0.5); }
.pos-cell.first { color: #ffd700; font-size: 18px; }
.pos-cell.second { color: #C0C0C0; font-size: 17px; }
.pos-cell.third { color: #CD7F32; font-size: 16px; }
.name-cell { font-weight: 600; font-size: 15px; }
.name-cell.first { color: #ffd700; font-weight: 800; }
.name-cell.second { color: #C0C0C0; font-weight: 800; }
.name-cell.third { color: #CD7F32; font-weight: 800; }
.name-cell a { color: inherit; text-decoration: none; transition: text-decoration 0.2s; }
.name-cell a:hover { text-decoration: underline; }
.champ-cell, .finalist-cell, .points-cell { text-align: center; }
.champ-cell { width: 90px; font-weight: 700; font-size: 15px; }
.champ-cell.first { color: #ffd700; }
.champ-cell.second { color: #C0C0C0; }
.champ-cell.third { color: #CD7F32; }
.finalist-cell { width: 90px; font-weight: 700; font-size: 15px; }
.finalist-cell.first { color: #ffd700; }
.finalist-cell.second { color: #C0C0C0; }

.points-cell { width: 110px; font-weight: 700; color: #ffd700; font-size: 18px; }

.rating-note {

color: rgba(255, 255, 255, 0.55);

margin-top: 12px;

/* ====== МОДАЛКА С ЭФФЕКТОМ ИСПАРЕНИЯ-ОБЛАКА ====== */
/* ============================================================= */
.vapor-modal {
position: fixed;
inset: 0;
z-index: 9999;
display: none;
align-items: center;
justify-content: center;
pointer-events: none;
}
.vapor-modal.active {
display: flex;
pointer-events: auto;
}
/* Затемнённый фон с размытием */
.vapor-overlay {
position: absolute;
inset: 0;
background: rgba(0, 0, 0, 0);
backdrop-filter: blur(0px);
transition: background 0.6s ease, backdrop-filter 0.6s ease;
}
.vapor-modal.active .vapor-overlay {
background: rgba(0, 0, 0, 0.55);
backdrop-filter: blur(8px);
}
/* Контейнер фото */
.vapor-content {
position: relative;
max-width: 90vw;
max-height: 90vh;
z-index: 2;
}
/* Само фото — эффект испарения */
.vapor-photo {
display: block;
max-width: 90vw;
max-height: 85vh;
border-radius: 12px;
box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 60px rgba(74,158,255,0.3);
/* Начальное состояние "испарения" */
opacity: 0;
filter: blur(40px) brightness(2) saturate(0.3);
transform: scale(1.4) translateY(40px);
transition:
opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1),
filter 1.1s cubic-bezier(0.22, 1, 0.36, 1),
transform 1s cubic-bezier(0.22, 1, 0.36, 1);
}
/* Когда активно — фото "сгущается" из пара */
.vapor-modal.active .vapor-photo {
opacity: 1;
filter: blur(0px) brightness(1) saturate(1);
transform: scale(1) translateY(0);
}
/* Крестик закрытия */
.vapor-close {
position: absolute;
top: -50px;
right: 0;
width: 40px;
height: 40px;
border-radius: 50%;
background: rgba(255,255,255,0.1);
border: 1px solid rgba(255,255,255,0.3);
color: #fff;
font-size: 22px;
line-height: 38px;
text-align: center;
cursor: pointer;
backdrop-filter: blur(10px);
transition: all 0.25s ease;
opacity: 0;
transform: translateY(10px);
}
.vapor-modal.active .vapor-close {
opacity: 1;
transform: translateY(0);
transition-delay: 0.4s;
}
.vapor-close:hover {
background: rgba(255,255,255,0.2);
transform: translateY(-2px) rotate(90deg);
}
/* Парящие частицы пара вокруг фото */
.vapor-particle {
position: absolute;
border-radius: 50%;
background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 70%);
pointer-events: none;
opacity: 0;
}
.vapor-modal.active .vapor-particle {
animation: vapor-rise 2s ease-out forwards;
}
.vapor-particle:nth-child(1) { width: 60px; height: 60px; top: 20%; left: -30px; animation-delay: 0.1s; }
.vapor-particle:nth-child(2) { width: 80px; height: 80px; top: 40%; right: -40px; animation-delay: 0.3s; }
.vapor-particle:nth-child(3) { width: 50px; height: 50px; bottom: 10%; left: 10%; animation-delay: 0.5s; }
.vapor-particle:nth-child(4) { width: 70px; height: 70px; top: 10%; right: 20%; animation-delay: 0.2s; }
.vapor-particle:nth-child(5) { width: 40px; height: 40px; bottom: 30%; right: -20px; animation-delay: 0.4s; }
@keyframes vapor-rise {
0% {
opacity: 0;
transform: translateY(0) scale(0.3);
}
30% {
opacity: 0.8;
}
100% {
opacity: 0;
transform: translateY(-120px) scale(1.8);
}
}
/* При закрытии — обратное испарение */
.vapor-modal.closing .vapor-photo {
opacity: 0;
filter: blur(40px) brightness(1.8) saturate(0.2);
transform: scale(1.3) translateY(-30px);
transition:
opacity 0.6s ease,
filter 0.8s ease,
transform 0.7s ease;
}
.vapor-modal.closing .vapor-overlay {
background: rgba(0, 0, 0, 0);
backdrop-filter: blur(0px);
transition: background 0.6s ease, backdrop-filter 0.6s ease;
}
.vapor-modal.closing .vapor-close {
opacity: 0;
transform: translateY(10px);
transition: all 0.3s ease;
}
</style>

<script>
// ====== ОТКРЫТИЕ МОДАЛКИ ПО КЛИКУ НА НАКЛЕЙКУ ======
(function() {
var sticker = document.getElementById('holoSticker');
var modal = document.getElementById('vaporModal');
var overlay = document.getElementById('vaporOverlay');
var closeBtn = document.getElementById('vaporClose');
var photo = document.getElementById('vaporPhoto');
var isClosing = false;

function openModal() {
if (isClosing) return;
modal.classList.remove('closing');
// Сбрасываем состояние фото, чтобы анимация проигралась заново
photo.style.transition = 'none';
photo.style.opacity = '0';
photo.style.filter = 'blur(40px) brightness(2) saturate(0.3)';
photo.style.transform = 'scale(1.4) translateY(40px)';
// Форсим reflow
void photo.offsetWidth;
// Включаем модалку
modal.classList.add('active');
// Возвращаем плавные переходы
requestAnimationFrame(function() {
photo.style.transition = '';
});
}

function closeModal() {
if (isClosing) return;
isClosing = true;
modal.classList.add('closing');
setTimeout(function() {
modal.classList.remove('active', 'closing');
isClosing = false;
}, 800);
}

sticker.addEventListener('click', function(e) {
e.stopPropagation();
openModal();
});
closeBtn.addEventListener('click', function(e) {
e.stopPropagation();
closeModal();
});
overlay.addEventListener('click', closeModal);
document.addEventListener('keydown', function(e) {
if (e.key === 'Escape' && modal.classList.contains('active')) {
closeModal();
}
});
})();
</script>

var db = firebase.database();
var auth = firebase.auth();
var LOGO_URL = 'png/logo1.jpg';
var isAdmin = false;
function escapeHtml(t) {
if (!t) return '';
return String(t)
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");
}
auth.onAuthStateChanged(function(user) {
if (!user) return;
db.ref('users/' + user.uid).once('value').then(function(snap) {
if (!snap.exists()) return;
var ud = snap.val();
var myNick = ud.nick || (ud.email ? ud.email.split('@')[0] : null);
if (!myNick) return;
db.ref('playoff/adminNicks/' + myNick).once('value').then(function(adminSnap) {
isAdmin = adminSnap.exists() && adminSnap.val() === true;
if (isAdmin) {
document.getElementById('btnReset').classList.add('visible');
}
});
});
});
function renderRating(allResults) {
var body = document.getElementById('ratingBody');
var stats = {};
allResults.forEach(function(finalResult) {
if (!finalResult) return;
var winners = finalResult.winners || [];
var runnersUp = finalResult.runnersUp || [];
winners.forEach(function(nick) {
if (!nick) return;
if (!stats[nick]) stats[nick] = { champ: 0, finalist: 0, points: 0 };
stats[nick].champ++;
stats[nick].points += 2;
});
runnersUp.forEach(function(nick) {
if (!nick) return;
if (!stats[nick]) stats[nick] = { champ: 0, finalist: 0, points: 0 };
stats[nick].finalist++;
stats[nick].points += 1;
});
});
var hasData = Object.keys(stats).length > 0;
if (!hasData) {
body.innerHTML = '<tr><td colspan="5" class="rating-empty">Итоги появятся после финала</td></tr>';
return;
}
var arr = Object.keys(stats).map(function(nick) {
return { nick: nick, champ: stats[nick].champ, finalist: stats[nick].finalist, points: stats[nick].points };
});
arr.sort(function(a, b) {
if (b.points !== a.points) return b.points - a.points;
if (b.champ !== a.champ) return b.champ - a.champ;
return b.finalist - a.finalist;
});
var html = '';
arr.forEach(function(row, i) {
var pos = i + 1;
var posClass = '';
var nameClass = '';
var champClass = '';
var finalistClass = '';
if (pos === 1) { posClass = nameClass = champClass = finalistClass = ' first'; }
else if (pos === 2) { posClass = nameClass = champClass = finalistClass = ' second'; }
else if (pos === 3) { posClass = nameClass = champClass = finalistClass = ' third'; }
var pointsClass = (row.points === 0) ? ' zero' : '';
var logoHtml = (row.points > 0) ? (' <img src="' + LOGO_URL + '" class="points-logo" alt="Чак-чак">') : '';
html += '<tr>'
+ '<td class="pos-cell"><span class="cell-content">' + pos + '</span></td>'
+ '<td><span class="cell-content"><span class="name-cell' + nameClass + '"><a href="profile.html?nick=' + encodeURIComponent(row.nick) + '" target="_top">' + escapeHtml(row.nick) + '</a></span></span></td>'
+ '<td class="champ-cell"><span class="cell-content"><span class="champ-cell' + champClass + '">' + row.champ + '</span></span></td>'
+ '<td class="finalist-cell"><span class="cell-content"><span class="finalist-cell' + finalistClass + '">' + row.finalist + '</span></span></td>'
+ '<td class="points-cell"><span class="cell-content"><span class="points-cell' + pointsClass + '">' + row.points + logoHtml + '</span></span></td>'
+ '</tr>';
});
body.innerHTML = html;
}
function loadAndRender() {
db.ref('playoff/tournaments').on('value', function(snap) {
var tournaments = snap.val() || {};
var allResults = [];
Object.keys(tournaments).forEach(function(tid) {
if (tournaments[tid] && tournaments[tid].finalResult) {
allResults.push(tournaments[tid].finalResult);
}
});
renderRating(allResults);
});
}
document.getElementById('btnReset').addEventListener('click', function() {
if (!isAdmin) return;
if (!confirm('Сбросить чак-чаки? Результаты всех финалов будут удалены.')) return;
db.ref('playoff/tournaments').once('value').then(function(snap) {
var tournaments = snap.val() || {};
var updates = {};
Object.keys(tournaments).forEach(function(tid) {
if (tournaments[tid] && tournaments[tid].finalResult) {
updates['playoff/tournaments/' + tid + '/finalResult'] = null;
}
});
if (Object.keys(updates).length > 0) {
db.ref().update(updates).then(function() {
alert('Чак-чаки сброшены!');
});
} else {
alert('Нет результатов для сброса.');
}
});
});
loadAndRender();
})();
</script>
</body>
</html>
