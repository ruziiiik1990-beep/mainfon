  <div class="container header-container">

  <!-- ===== ПЛАВАЮЩАЯ ПАНЕЛЬ ===== -->

    <div id="panel-header">

    <div id="panel-body"></div>
  </div>

  <!-- ===== OVERLAY ===== -->

  <!-- ===== СТИЛИ ===== -->
  <style>
    /* Позиционирование header и светлый фон как в примере (высота без увеличения: 88px) */
    .header-wrapper {
      position: relative !important;
      overflow: visible !important;
      min-height: 88px;
      background: #F1F5F9;
    }

    /* ===== ФОН С ЦИФРОВОЙ ДЫМКОЙ ===== */
    .header-wrapper #fog-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: inherit;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    .header-wrapper #fogCanvas {
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0.45;
    }

    /* Контент header поверх тумана */
    .header-wrapper .container.header-container {
      position: relative;
      z-index: 5;
    }

    /* ===== СЕТЬ МОДУЛЕЙ (ГОРИЗОНТАЛЬНАЯ) ===== */
    .header-wrapper #core-network {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 6px;
      z-index: 3;
    }

    /* ===== МОДУЛИ (КАРТОЧКИ МЕНЮ И КНОПКИ ВХОДА/ПРОФИЛЯ) ===== */
    .header-wrapper .module {
      position: relative;
      width: 110px;
      height: 55px;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 153, 255, 0.18);
      border-radius: 12px;
      box-shadow:
        0 4px 20px rgba(0, 80, 160, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      padding: 4px 8px;
      text-align: center;
      animation: moduleFloat 6s ease-in-out infinite;
      z-index: 2;
      box-sizing: border-box;
    }
    .header-wrapper .module.auth-module {
      width: auto;
      min-width: 96px;
      padding: 4px 14px;
    }
    .header-wrapper .module:hover {
      transform: scale(1.08);
      border-color: rgba(0, 153, 255, 0.45);
      box-shadow:
        0 10px 30px rgba(0, 120, 220, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.92);
    }

    /* Задержки анимации */
    .header-wrapper .module:nth-child(1) { animation-delay: 0.3s; }
    .header-wrapper .module:nth-child(2) { animation-delay: 0.9s; }
    .header-wrapper .module:nth-child(3) { animation-delay: 1.5s; }
    .header-wrapper .module:nth-child(4) { animation-delay: 2.1s; }
    .header-wrapper .module:nth-child(5) { animation-delay: 2.7s; }
    .header-wrapper .module:nth-child(6) { animation-delay: 3.3s; }

    /* Плавающая анимация */
    @keyframes moduleFloat {
      0%, 100% { transform: translateY(3px); }
      50%      { transform: translateY(-3px); }
    }

    /* Угловые декорации */
    .header-wrapper .chip-corner {
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: rgba(0, 153, 255, 0.28);
      border-style: solid;
      border-width: 0;
      pointer-events: none;
      z-index: 3;
      transition: border-color 0.3s;
    }
    .header-wrapper .chip-corner.tl { top: 3px; left: 3px; border-top-width: 2px; border-left-width: 2px; border-radius: 6px 0 0 0; }
    .header-wrapper .chip-corner.tr { top: 3px; right: 3px; border-top-width: 2px; border-right-width: 2px; border-radius: 0 6px 0 0; }
    .header-wrapper .chip-corner.bl { bottom: 3px; left: 3px; border-bottom-width: 2px; border-left-width: 2px; border-radius: 0 0 0 6px; }
    .header-wrapper .chip-corner.br { bottom: 3px; right: 3px; border-bottom-width: 2px; border-right-width: 2px; border-radius: 0 0 6px 0; }
    .header-wrapper .module:hover .chip-corner { border-color: rgba(0, 153, 255, 0.65); }

    .header-wrapper .module h2 {
      font-size: 0.85rem;
      line-height: 1.1;
      font-weight: 700;
      color: #000000;
      letter-spacing: 0.8px;
      margin: 0;
      text-shadow: none;
    }
    /* Голографический glow по краям */
    .header-wrapper .module-glow {
      position: absolute;
      inset: -2px;
      border-radius: 14px;
      padding: 2px;
      background: conic-gradient(
        from 0deg,
        transparent,
        rgba(0, 180, 255, 0.22),
        transparent,
        rgba(0, 180, 255, 0.12),
        transparent
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.5;
      animation: glowSpin 12s linear infinite;
    }
    @keyframes glowSpin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ===== ПЛАВАЮЩАЯ ПАНЕЛЬ ===== */
    .header-wrapper #floating-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      width: 90%;
      max-width: 520px;
      max-height: 80vh;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 20px;
      border: 1px solid rgba(0, 180, 255, 0.2);
      box-shadow:
        0 24px 64px rgba(0, 40, 80, 0.14),
        0 0 60px rgba(0, 180, 255, 0.08);
      z-index: 10000;
      padding: 0;
      opacity: 0;
      visibility: hidden;
      transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: #1a2a3a;
    }
    .header-wrapper #floating-panel.active {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }
    .header-wrapper #panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 22px;
      border-bottom: 1px solid rgba(0, 180, 255, 0.12);
      flex-shrink: 0;
    }
    .header-wrapper #panel-title {
      font-size: 1.0rem;
      font-weight: 600;
      color: #1a2a3a;
      letter-spacing: 2px;
    }
    .header-wrapper #panel-close {
      background: none;
      border: none;
      font-size: 1.1rem;
      color: #88a8b8;
      cursor: pointer;
      transition: color 0.2s;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header-wrapper #panel-close:hover {
      color: #1a2a3a;
      background: rgba(0, 0, 0, 0.04);
    }
    .header-wrapper #panel-body {
      padding: 18px 22px 24px;
      overflow-y: auto;
      flex: 1;
      text-align: center;
    }
    .header-wrapper #panel-body .panel-content {
      animation: fadeInContent 0.35s ease;
    }
    @keyframes fadeInContent {
      0%   { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ===== OVERLAY ===== */
    .header-wrapper #panel-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 20, 30, 0.25);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.35s ease;
    }
    .header-wrapper #panel-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* ===== АДАПТИВ ===== */
    @media (max-width: 900px) {
      .header-wrapper .module {
        width: 90px;
        height: 45px;
      }
      .header-wrapper .module.auth-module {
        width: auto;
        min-width: 80px;
        padding: 4px 10px;
      }
      .header-wrapper .module h2 { font-size: 0.68rem; }
      .header-wrapper #core-network { gap: 12px; }
    }

    @media (max-width: 650px) {
      .header-wrapper .module {
        width: 70px;
        height: 38px;
        padding: 3px 4px;
      }
      .header-wrapper .module.auth-module {
        width: auto;
        min-width: 68px;
        padding: 3px 8px;
      }
      .header-wrapper .module h2 { font-size: 0.58rem; letter-spacing: 0.4px; }
      .header-wrapper #core-network { gap: 8px; flex-wrap: wrap; }
    }
  </style>
  <!-- ===== JAVASCRIPT ===== -->
  <script>
  (function() {
    'use strict';

    // ============================================================
    // 1. ЦИФРОВАЯ ДЫМКА (CANVAS)
    // ============================================================
    const fogCanvas = document.getElementById('fogCanvas');
    if (!fogCanvas) return;
    const fogCtx = fogCanvas.getContext('2d');
    let fogWidth, fogHeight;
    let particles = [];

    function resizeFog() {
      const rect = fogCanvas.parentElement.getBoundingClientRect();
      fogCanvas.width = rect.width;
      fogCanvas.height = rect.height;
      fogWidth = fogCanvas.width;
      fogHeight = fogCanvas.height;
    }

    function initParticles(count = 50) {
      particles = [];
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * fogWidth,
          y: Math.random() * fogHeight,
          speedX: (Math.random() - 0.5) * 0.08,
          speedY: (Math.random() - 0.5) * 0.05,
          size: 2 + Math.random() * 4,
          opacity: 0.08 + Math.random() * 0.1,
        });
      }
    }

    function drawFog() {
      fogCtx.clearRect(0, 0, fogWidth, fogHeight);
      // Тонкие линии данных
      fogCtx.strokeStyle = 'rgba(0, 153, 255, 0.35)';
      fogCtx.lineWidth = 1;
      for (let i = 0; i < 25; i++) {
        const x = (i / 25) * fogWidth;
        const y = fogHeight * 0.5 + Math.sin(i * 0.7 + Date.now() * 0.00006) * 20;
        fogCtx.beginPath();
        fogCtx.moveTo(x, y);
        fogCtx.lineTo(x + 50, y + 15 + Math.sin(i * 0.5 + Date.now() * 0.00012) * 14);
        fogCtx.stroke();
      }
      // Плавающие частицы
      for (const p of particles) {
        p.x += p.speedX;
        p.y += p.speedY;
        if (p.x > fogWidth) p.x = 0;
        if (p.x < 0) p.x = fogWidth;
        if (p.y > fogHeight) p.y = 0;
        if (p.y < 0) p.y = fogHeight;
        const gradient = fogCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 1.8);
        gradient.addColorStop(0, `rgba(0, 153, 255, ${p.opacity})`);
        gradient.addColorStop(1, `rgba(0, 153, 255, 0)`);
        fogCtx.fillStyle = gradient;
        fogCtx.beginPath();
        fogCtx.arc(p.x, p.y, p.size * 1.8, 0, Math.PI * 2);
        fogCtx.fill();
      }
      requestAnimationFrame(drawFog);
    }

    function initFog() {
      resizeFog();
      initParticles(60);
      drawFog();
      window.addEventListener('resize', () => {
        resizeFog();
        initParticles(60);
      });
    }
    initFog();

    // ============================================================
    // 2. ДАННЫЕ МОДУЛЕЙ
    // ============================================================
    const moduleData = {
      home: {
        title: 'Главная',
        content: '<p style="font-size:0.9rem;color:#1a2a3a;">Добро пожаловать на 4ak4ak!</p>'
      },
      tournaments: {
        title: 'Турниры',
        content: '<p style="font-size:0.9rem;color:#1a2a3a;">Соревнования и чемпионаты</p>'
      },
      rank: {
        title: 'Rank',
        content: '<p style="font-size:0.9rem;color:#1a2a3a;">Рейтинг игроков</p>'
      },
      files: {
        title: 'Файлы',
        content: '<p style="font-size:0.9rem;color:#1a2a3a;">Загрузки и ресурсы</p>'
      },
      rules: {
        title: 'Правила',
        content: '<p style="font-size:0.9rem;color:#1a2a3a;">Регламент и правила</p>'
      },
      hall: {
        title: 'Зал славы',
        content: '<p style="font-size:0.9rem;color:#1a2a3a;">Легенды 4ak4ak</p>'
      }
    };

    // ============================================================
    // 3. ПАНЕЛЬ
    // ============================================================
    const panel = document.getElementById('floating-panel');
    const panelOverlay = document.getElementById('panel-overlay');
    const panelTitle = document.getElementById('panel-title');
    const panelBody = document.getElementById('panel-body');
    const panelClose = document.getElementById('panel-close');

    function openPanel(moduleId) {
      const data = moduleData[moduleId];
      if (!data) return;
      panelTitle.textContent = data.title;
      panelBody.innerHTML = `<div class="panel-content">${data.content}</div>`;
      panel.classList.add('active');
      panelOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function closePanel() {
      panel.classList.remove('active');
      panelOverlay.classList.remove('active');
      document.body.style.overflow = '';
    }
    panelClose.addEventListener('click', closePanel);
    panelOverlay.addEventListener('click', closePanel);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePanel();
    });

    // ============================================================
    // 4. СОБЫТИЯ МОДУЛЕЙ
    // ============================================================
    document.querySelectorAll('.header-wrapper .module').forEach((mod) => {
      mod.addEventListener('click', (e) => {
        const href = mod.getAttribute('href');
        if (!href || href === '#') {
          e.preventDefault();
          const moduleId = mod.dataset.module;
          if (moduleId) openPanel(moduleId);
        }
      });
    });

    console.log('✦ Holographic modules in header loaded');
  })();
  </script>
</header>
