  <!-- ===== СТИЛИ ДЛЯ РОМБОВ-ССЫЛОК ===== -->
  <style>
    /* Обёртка меню — выстраиваем ромбики в ряд */
    .header-wrapper .main-menu-nav .nav-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }

    .header-wrapper .main-menu-nav .nav-list li {
      margin: 0;
      padding: 0;
    }

    /* Ссылка-ромбик */
    .header-wrapper .rhombus-link {
      display: block;
      text-decoration: none;
      padding: 0;
      margin: 0;
      line-height: 1;
    }

    /* Сам ромб (квадрат, повёрнутый на 45°) */
    .header-wrapper .rhombus {
      width: 95px;
      height: 95px;
      background: rgba(10, 42, 107, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(74, 158, 255, 0.45);
      border-radius: 10px;
      transform: rotate(45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 6px 20px rgba(0, 80, 160, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
      position: relative;
      overflow: hidden;
    }

    /* Голографический glow по контуру ромба */
    .header-wrapper .rhombus::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 12px;
      padding: 2px;
      background: conic-gradient(
        from 0deg,
        transparent,
        rgba(74, 158, 255, 0.35),
        transparent,
        rgba(74, 158, 255, 0.2),
        transparent
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.6;
      animation: rhombusGlowSpin 8s linear infinite;
    }

    @keyframes rhombusGlowSpin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Hover-эффект */
    .header-wrapper .rhombus-link:hover .rhombus {
      transform: rotate(45deg) scale(1.12);
      border-color: rgba(74, 158, 255, 0.9);
      background: rgba(74, 158, 255, 0.25);
      box-shadow:
        0 10px 30px rgba(74, 158, 255, 0.5),
        inset 0 1px 0 rgba(218, 178, 255, 0.3);
    }

    /* Текст внутри ромба (контр-вращение, чтобы был читаемым) */
    .header-wrapper .rhombus-text {
      transform: rotate(-45deg);
      display: block;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      white-space: nowrap;
      line-height: 1.2;
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Адаптив: на узких экранах ромбики уменьшаются */
    @media (max-width: 1100px) {
      .header-wrapper .rhombus {
        width: 80px;
        height: 80px;
      }
      .header-wrapper .rhombus-text {
        font-size: 10px;
        max-width: 65px;
      }
      .header-wrapper .main-menu-nav .nav-list {
        gap: 14px;
      }
    }

    @media (max-width: 900px) {
      .header-wrapper .rhombus {
        width: 65px;
        height: 65px;
      }
      .header-wrapper .rhombus-text {
        font-size: 8.5px;
        max-width: 52px;
      }
      .header-wrapper .main-menu-nav .nav-list {
        gap: 8px;
      }
    }

    @media (max-width: 650px) {
      .header-wrapper .rhombus {
        width: 55px;
        height: 55px;
      }
      .header-wrapper .rhombus-text {
        font-size: 7.5px;
        max-width: 42px;
      }
      .header-wrapper .main-menu-nav .nav-list {
        gap: 5px;
      }
    }
  </style>
