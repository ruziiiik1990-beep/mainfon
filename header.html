<header class="header">
  <div class="container header-container">
    
    <div class="header-left" style="margin-left: 200px;">
      <a class="logo-link" href="index.html" title="Главная">
        <img src="logo1.jpg" alt="4ak4ak" class="logo-image" loading="lazy">
      </a>
      
      <div class="main-menu menu-evolving">
        <div class="menubar">
          <nav class="main-menu-nav" id="site_main_menu">
            <div class="main-menu-container">
              <div class="main-menu-scroll-area">
                <ul class="nav-list">
                  <li><a href="index.html" class="nav-link">Главная</a></li>
                  <li><a href="tournaments.html" class="nav-link">Турниры</a></li>
                  <li><a href="rules.html" class="nav-link">Правила</a></li>
                </ul>
              </div>
            </div>
          </nav>
        </div>
      </div>
    </div>

    <div class="header-right" style="display: flex; align-items: center; gap: 20px;">
      <div class="header-auth-block">
        
        <!-- Кнопки для гостей: теперь видны по умолчанию -->
        <div id="guest-buttons" class="auth-links" style="display: flex; align-items: center; gap: 15px;">
          <a title="Вход" href="login.html" style="display: block; cursor: pointer;">
            <img src="Screenshot_11.png" alt="Вход" style="height: 70px; width: auto; max-width: 110px; vertical-align: middle;">
          </a>
          <a title="Регистрация" href="register.html" style="display: block; cursor: pointer;">
            <img src="Screenshot_12.png" alt="Регистрация" style="height: 70px; width: auto; max-width: 200px; vertical-align: middle;">
          </a>
        </div>

        <!-- Кнопки для авторизованных: скрыты по умолчанию -->
        <div id="user-buttons" class="auth-links" style="display: none; align-items: center; gap: 15px;">
          <a title="Мой профиль" href="profile.html" style="display: block; cursor: pointer;">
            <img src="Screenshot_8.png" alt="Профиль" style="height: 70px; width: auto; max-width: 110px; vertical-align: middle;">
          </a>
          <a title="Выход" href="#" id="logout-btn" style="display: block; cursor: pointer;">
            <img src="Screenshot_7.png" alt="Выход" style="height: 70px; width: auto; max-width: 100px; vertical-align: middle;">
          </a>
        </div>

      </div>
    </div>

  </div>
</header>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // ВСТАВЬ СЮДА СВОИ КЛЮЧИ! Без них скрипт не заработает.
    const firebaseConfig = {
        apiKey: "AIzaSyDQMXKc1q4SQYIKlhqzPmB9-h0rCV90Itk",
        authDomain: "ak4ak-8be45.firebaseapp.com",
        databaseURL: "https://ak4ak-8be45-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "ak4ak-8be45",
        storageBucket: "ak4ak-8be45.appspot.com",
        messagingSenderId: "408070680295",
        appId: "1:408070680295:web:77b9656094e330b803bc42"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Эта функция переключает кнопки
    function updateButtons(user) {
        const guest = document.getElementById('guest-buttons');
        const userDiv = document.getElementById('user-buttons');
        
        if (!guest || !userDiv) return;

        if (user) {
            guest.style.display = 'none';
            userDiv.style.display = 'flex';
        } else {
            guest.style.display = 'flex';
            userDiv.style.display = 'none';
        }
    }

    // Следим за входом/выходом
    onAuthStateChanged(auth, (user) => {
        updateButtons(user);
    });

    // Выход
    document.addEventListener('click', function(e) {
        if (e.target.closest('#logout-btn')) {
            e.preventDefault();
            signOut(auth).then(() => window.location.reload());
        }
    });
</script>
