<header class="header">
  <div class="container header-container">
    
    <div class="header-left" style="margin-left: 200px;">
      <a class="logo-link" href="index.html" title="Главная">
        <img src="logo1.jpg" alt="4ak4ak" class="logo-image" loading="lazy">
      </a>
      
      <div class="main-menu menu-evolving">
        <div class="menubar">
          <nav class="main-menu-nav" id="site_main_menu">
            <div class="main-menu-container">
              <div class="main-menu-scroll-area">
                <ul class="nav-list">
                  <li><a href="index.html" class="nav-link">Главная</a></li>
                  <li><a href="tournaments.html" class="nav-link">Турниры</a></li>
                  <li><a href="rules.html" class="nav-link">Правила</a></li>
                </ul>
              </div>
            </div>
          </nav>
        </div>
      </div>
    </div>

    <div class="header-right" style="display: flex; align-items: center; gap: 20px;">
      <div class="header-auth-block">
        
        <!-- БЛОК ДЛЯ ГОСТЕЙ (показывается, когда не залогинен) -->
        <div id="guest-buttons" class="auth-links" style="display: flex; align-items: center; gap: 15px;">
          <a title="Вход" href="login.html" style="display: block; cursor: pointer;">

          </a>
          <a title="Регистрация" href="register.html" style="display: block; cursor: pointer;">

          </a>
        </div>

        <!-- БЛОК ДЛЯ АВТОРИЗОВАННЫХ (показывается после входа) -->
        <div id="user-buttons" class="auth-links" style="display: none; align-items: center; gap: 15px;">
          <a title="Мой профиль" href="profile.html" style="display: block; cursor: pointer;">
            <img src="Screenshot_8.png" alt="Профиль" style="height: 70px; width: auto; max-width: 110px; vertical-align: middle;">
          </a>
          <a title="Выход" href="#" id="logout-btn" style="display: block; cursor: pointer;">

      </div>

<!-- Скрипт, который переключает кнопки (Симуляция входа) -->
<script>
    // Проверяем, сохранен ли статус входа в браузере
    const isLoggedIn = localStorage.getItem('isLoggedIn');

    if (isLoggedIn === 'true') {
        document.getElementById('guest-buttons').style.display = 'none';
        document.getElementById('user-buttons').style.display = 'flex';
    }

    // Обработчик кнопки "Выход"
    document.addEventListener('click', function(e) {
        if (e.target.closest('#logout-btn')) {
            e.preventDefault();
            localStorage.removeItem('isLoggedIn'); // Удаляем статус
            window.location.reload(); // Перезагружаем страницу
        }
    });
</script>
