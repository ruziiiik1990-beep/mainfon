  <!-- ===== JAVASCRIPT: ТУМАН + МОДУЛИ ===== -->
  <script>
  (function() {
    'use strict';

    // ============================================================
    // 1. ЦИФРОВАЯ ДЫМКА (CANVAS)
    // ============================================================
    const fogCanvas = document.getElementById('fogCanvas');
    if (!fogCanvas) return;
    const fogCtx = fogCanvas.getContext('2d');
    let fogWidth, fogHeight;
    let particles = [];

    function resizeFog() {
      const rect = fogCanvas.parentElement.getBoundingClientRect();
      fogCanvas.width = rect.width;
      fogCanvas.height = rect.height;
      fogWidth = fogCanvas.width;
      fogHeight = fogCanvas.height;
    }

    function initParticles(count = 50) {
      particles = [];
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * fogWidth,
          y: Math.random() * fogHeight,
          speedX: (Math.random() - 0.5) * 0.08,
          speedY: (Math.random() - 0.5) * 0.05,
          size: 2 + Math.random() * 4,
          opacity: 0.05 + Math.random() * 0.08,
        });
      }
    }

    function drawFog() {
      fogCtx.clearRect(0, 0, fogWidth, fogHeight);
      // Тонкие линии данных
      fogCtx.strokeStyle = 'rgba(74, 158, 255, 0.9)';
      fogCtx.lineWidth = 1;
      for (let i = 0; i < 25; i++) {
        const x = (i / 25) * fogWidth;
        const y = fogHeight * 0.5 + Math.sin(i * 0.7 + Date.now() * 0.00006) * 25;
        fogCtx.beginPath();
        fogCtx.moveTo(x, y);
        fogCtx.lineTo(x + 50, y + 20 + Math.sin(i * 0.5 + Date.now() * 0.00012) * 18);
        fogCtx.stroke();
      }
      // Плавающие частицы
      for (const p of particles) {
        p.x += p.speedX;
        p.y += p.speedY;
        if (p.x > fogWidth) p.x = 0;
        if (p.x < 0) p.x = fogWidth;
        if (p.y > fogHeight) p.y = 0;
        if (p.y < 0) p.y = fogHeight;
        const gradient = fogCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 1.8);
        gradient.addColorStop(0, `rgba(74, 158, 255, ${p.opacity * 0.9})`);
        gradient.addColorStop(1, `rgba(74, 158, 255, 0)`);
        fogCtx.fillStyle = gradient;
        fogCtx.beginPath();
        fogCtx.arc(p.x, p.y, p.size * 1.8, 0, Math.PI * 2);
        fogCtx.fill();
      }
      requestAnimationFrame(drawFog);
    }

    function initFog() {
      resizeFog();
      initParticles(60);
      drawFog();
      window.addEventListener('resize', () => {
        resizeFog();
        initParticles(60);
      });
    }
    initFog();

    // ============================================================
    // 2. ДАННЫЕ МОДУЛЕЙ
    // ============================================================

              <span class="gusto">PROGRAMADOR</span>
              <span class="gusto">CREATIVO</span>
              <span class="gusto">MAKER</span>
              <span class="gusto">APRENDIZ</span>
            </div>
            <div style="margin-top:12px;font-size:0.65rem;color:rgba(255,255,255,0.5);letter-spacing:1px;">
              Nivel 9 · Clase Holográfico
            </div>
          </div>
        `
      },
      skills: {
        title: '◈ SKILLS — Habilidades',
        content: `
          <div class="item-grid">
            <div class="item-chip"><span class="icon">🌐</span><span class="label">Front-End</span><span class="desc">HTML · CSS · JS</span></div>
            <div class="item-chip"><span class="icon">⚛️</span><span class="label">Frameworks</span><span class="desc">React · Vue</span></div>
            <div class="item-chip"><span class="icon">🧊</span><span class="label">3D & Animación</span><span class="desc">Three.js · GSAP</span></div>
            <div class="item-chip"><span class="icon">🎨</span><span class="label">Diseño</span><span class="desc">UI/UX · Figma</span></div>
            <div class="item-chip"><span class="icon">🔧</span><span class="label">Herramientas</span><span class="desc">Git · Webpack</span></div>
            <div class="item-chip"><span class="icon">📐</span><span class="label">Gráficos</span><span class="desc">SVG · Canvas</span></div>
          </div>
        `
      },
      vibes: {
        title: '◇ VIBES — Inspiraciones',
        content: `
          <div class="item-grid">
            <div class="item-chip"><span class="icon">🎮</span><span class="label">Juegos</span><span class="desc">Dark Souls · Elden Ring</span></div>
            <div class="item-chip"><span class="icon">🎬</span><span class="label">Películas</span><span class="desc">Blade Runner · Dune</span></div>
            <div class="item-chip"><span class="icon">🎵</span><span class="label">Música</span><span class="desc">Synthwave · Bandas sonoras</span></div>
            <div class="item-chip"><span class="icon">📚</span><span class="label">Libros</span><span class="desc">Ciencia ficción · Filosofía</span></div>
            <div class="item-chip"><span class="icon">🏛️</span><span class="label">Arte</span><span class="desc">Digital · Neoclásico</span></div>
            <div class="item-chip"><span class="icon">🧠</span><span class="label">Filosofía</span><span class="desc">Estoicismo · Exploración</span></div>

      gear: {
        title: '⚙ GEAR — Herramientas',
        content: `
          <div class="item-grid">
            <div class="item-chip"><span class="icon">📝</span><span class="label">VS Code</span><span class="desc">Editor principal</span></div>
            <div class="item-chip"><span class="icon">🔍</span><span class="label">Chrome DevTools</span><span class="desc">Depuración</span></div>

    // ============================================================
    // 3. ПАНЕЛЬ
    // ============================================================
    const panel = document.getElementById('floating-panel');
    const panelOverlay = document.getElementById('panel-overlay');
    const panelTitle = document.getElementById('panel-title');
    const panelBody = document.getElementById('panel-body');
    const panelClose = document.getElementById('panel-close');

    function openPanel(moduleId) {
      const data = moduleData[moduleId];
      if (!data) return;
      panelTitle.textContent = data.title;
      panelBody.innerHTML = `<div class="panel-content">${data.content}</div>`;
      panel.classList.add('active');
      panelOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function closePanel() {
      panel.classList.remove('active');
      panelOverlay.classList.remove('active');
      document.body.style.overflow = '';
    }
    panelClose.addEventListener('click', closePanel);
    panelOverlay.addEventListener('click', closePanel);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePanel();
    });

    // ============================================================
    // 4. СОБЫТИЯ МОДУЛЕЙ
    // ============================================================
    document.querySelectorAll('.header-wrapper .module').forEach((mod) => {
      mod.addEventListener('click', () => {
        const moduleId = mod.dataset.module;
        if (moduleId) openPanel(moduleId);
      });
    });

    // ============================================================
    // 5. SVG ЛИНИИ СОЕДИНЕНИЯ МЕЖДУ МОДУЛЯМИ
    // ============================================================
    function updateConnections() {
      const modules = document.querySelectorAll('.header-wrapper .module');
      const connLines = document.querySelectorAll('#connections line');
      const network = document.getElementById('core-network');
      if (!network || modules.length < 4) return;

      const networkRect = network.getBoundingClientRect();
      const centers = [];
      modules.forEach(mod => {
        const modRect = mod.getBoundingClientRect();
        centers.push({
          x: modRect.left + modRect.width / 2 - networkRect.left,
          y: modRect.top + modRect.height / 2 - networkRect.top,
        });
      });

      // Соединяем модули крест-накрест (по диагонали)
      const connections = [
        [centers[0].x, centers[0].y, centers[1].x, centers[1].y],
        [centers[1].x, centers[1].y, centers[3].x, centers[3].y],
        [centers[3].x, centers[3].y, centers[2].x, centers[2].y],
        [centers[2].x, centers[2].y, centers[0].x, centers[0].y],
      ];

      connLines.forEach((line, i) => {
        if (i < connections.length) {
          const [x1, y1, x2, y2] = connections[i];
          if (x2 && y2) {
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);
          }
        }
      });
    }

    setTimeout(updateConnections, 300);
    window.addEventListener('resize', updateConnections);
    window.addEventListener('load', updateConnections);

    console.log('✦ Holographic modules in header loaded');
    console.log('◈ Módulos: CARD, SKILLS, VIBES, GEAR');
  })();
  </script>
